[facet]                         # every field typed; seeded empty (captured later)
context = "Operator: no id should mean the currently active conversation, if cheap. The daemon tracks attachments per connection only; both listeners run in one process and already share an operator-input hook (onOperatorInput)."
choice = "When pair names no conversation, the daemon looks at the conversations its attach listener currently has bound. Exactly one: pair binds it (subject to the interactive check). None: refused no operator client is attached; name a conversation. Several: refused several conversations are attached (N, M); name one. The attach listener exposes its bound conversations to the bridge host the way onOperatorInput is passed."
alternatives = ["Require an id always: one fewer seam, but the operator must read and type an id every time", "Most recently created conversation: not what the operator is looking at"]
rationale = "Matches what the operator means by active; explicit refusals when ambiguous."
consequences = ["Supersedes DEC-092 and DEC-093: pair creates nothing, so no topic or model is chosen at pair", "An attach client from any source counts, Emacs or terminal"]
