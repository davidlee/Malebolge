[facet]                         # every field typed; seeded empty (captured later)
context = "Today the bridge section renders BRIDGE_UNTRUSTED even on a never-bridged conversation, harmless only because only bridge-mode conversations had it. All room interactive conversations now carry the extension."
choice = "Never bridged (no pairing document, or tokenHash empty): no section. Once bridged, including after end: unchanged (untrusted framing; environment and posture text), since bridge messages stay in that conversation's context."
alternatives = ["Render only while live (not ended): drops the untrusted framing while bridged text is still in context"]
rationale = "The framing must cover every bridge message in context; a conversation never bridged has none."
consequences = ["isBridged (tokenHash non-empty) is the gate"]
