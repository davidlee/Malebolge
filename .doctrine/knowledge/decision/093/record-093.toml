[facet]                         # every field typed; seeded empty (captured later)
context = "DEC-016's choice refuses an unknown topic on attach and never creates it implicitly; src/conversations.ts:11 overstates this as 'no frame ever creates a topic implicitly'. SL-009's pair (bridge.sock) creates <project>-bridge when absent. After SL-010 a topic record decides a model, so the creation is load-bearing. ISS-004 M-19."
choice = "pair names its project, and creating the <project>-bridge topic (toolset bridge, no directory, no model) is part of what pair does: explicit, not implicit. DEC-016's rule stays for attach and the durable.sock frames. The comment at src/conversations.ts:11 is corrected to say so. A created bridge topic carries no model, so its conversations take the daemon default until the operator sets one."
alternatives = ["pair refuses an absent topic; the operator runs --set-topic <project>-bridge --toolset bridge per project first"]
rationale = "A jailed pi cannot create the topic itself, so the alternative adds a manual host step per project for no safety gain: pair already validates the name and requires toolset bridge."
consequences = ["Refines DEC-016's scope; does not supersede it", "SL-009 sec-3 and sec-8 cite this decision"]
decided_by = "user (accepted agent proposal, 2026-10-29)"
decided_on = "2026-10-29"

