[facet]                         # every field typed; seeded empty (captured later)
context = "The attach client treats each stdin line as one input, while the daemon already accepts string content."
choice = "An explicit Emacs attach mode accepts one JSON stdin frame per submitted draft or command; the attach client forwards one existing daemon ClientMessage. Default terminal stdin remains typed-line mode."
alternatives = ["A sentinel-delimited multiline mode", "Escaping newlines in an ordinary typed line"]
rationale = "JSON frames preserve arbitrary newlines and slash-leading text without sentinel collisions or daemon protocol changes."
consequences = ["Add strict client-side frame handling and a mode flag.", "Emacs serializes input and controls; quit stays local to the attach client."]
