[facet]                         # every field typed; seeded empty (captured later)
context = "DEC-103 resets outbox, seq and budget on re-pair. pi dedupes deliveries by conversation and seq and keeps its session's keys across pairings, so a re-pair of the same conversation reuses seqs and pi drops new messages as duplicates (RV-029 F-15)."
choice = "openPairing keeps nextSeq: a seq is never reused within a conversation, across pairings. Token, posture, project, ended, outbox and budget still reset as DEC-103 says."
alternatives = ["Key pi's dedupe by a pairing-instance digest of the token: touches injection; persistence; ack and stored session-record compatibility"]
rationale = "Extends DEC-066's own rule (a seq is never reused) from one pairing to the conversation; one line on the daemon side and nothing on pi's."
consequences = ["Refines DEC-103 (seq is no longer reset)", "Refines DEC-066"]
decided_by = 'user (accepted agent proposal, 2026-10-30: "Q1 - yes / Q2 - yes")'
decided_on = "2026-10-30"

