[facet]                         # every field typed; seeded empty (captured later)
context = "A draft must remain usable while the attach process emits output, and readers must be able to inspect older transcript text."
choice = "Keep the draft in its own buffer; before each comint output insertion note which transcript windows show the old end, then move only those windows to the new end. Preserve point and window start elsewhere."
alternatives = ["Always scroll to the newest output", "Never follow streamed output"]
rationale = "This meets the reader-follow rule without moving the draft cursor."
consequences = ["Emacs-local preoutput and postoutput handling must account for multiple windows and reattachment."]
