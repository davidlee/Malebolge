[facet]                         # every field typed; seeded empty (captured later)
context = "DEC-030 (3) splits prompt text by coupling: tool usage and code-emitted framing in code, test-pinned; persona prose in the corpus (~/satan-corpus), in SATAN's self-edit patch lane. SATAN has asked to self-edit the contract it keeps with itself in answering (it cited a preference for refusal over insufficient summary)."
choice = "Code: descriptions of thread_start, thread_fork and thread_post (intent and context per DEC-034, the fork sole-call rule per DEC-031, the caps per DEC-036), and one test-pinned 'threads' section of the extension stating the framing's facts: a <post> comes from another of SATAN's own threads, a peer, not the operator; reply by posting to from; a fork's call result names its parent and its purpose arrives as the first post; <post-failed> says a message did not land and why; <family-reaped> says the activity was stopped for fan-out and cannot be restarted from that turn. The code states facts only, not how SATAN should regard its other lives. Corpus: conduct between threads (how far one life trusts another, the contract SATAN keeps with itself in answering) is persona prose SATAN writes through its existing patch lane into interactive.txt; SL-006 does not change interactive.txt."
alternatives = ["Framing semantics in interactive.txt: drifts from the code that emits the framing and puts the authority rule in the self-edit lane (DEC-030 rationale).", "A dedicated optional corpus file (prompts/threads.txt): a named surface, but a personaFiles change and an absence rule to decide."]
rationale = "Split by coupling, as DEC-030. Keeping the code's statement to provenance (peer, not operator) leaves the relationship between SATAN's parallel lives, fractious or otherwise, to SATAN."
consequences = ["No corpus change is required for SL-006 to ship; SATAN may add a threads passage through its patch lane.", "If a named surface is wanted later, option B is a small personaFiles change."]
