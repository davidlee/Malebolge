title = "Every bridge message starts a turn on the receiving side, except a note, which waits for the next one"
record_kind = "decision"
status = "proposed"
created = "2026-10-29"
updated = "2026-10-29"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "Operator: messages start turns; tee output is a note. pi-durable: an input starts a run or follows up; a write carrying model content waits for the next boundary like a steer (pi-durable README, Busy Conversations). pi: sendMessage {triggerTurn, deliverAs}."
choice = "A message has kind turn (default) or note. Into SATAN: turn = input, whenBusy followUp; note = write with model content, seen at the next turn. Into pi: turn = sendMessage triggerTurn true, deliverAs followUp when busy; note = sendMessage triggerTurn false (deliverAs nextTurn when busy). The post tools send turns; malebolge-bridge send and tee send notes by default. No reply ids: one pair, conversation order suffices."
alternatives = ["Every message starts a turn: teed logs would each start a SATAN turn"]
rationale = "Notes let pi hand SATAN material without spending a SATAN turn on it."
consequences = ["notes do not count against the loop budget (they start nothing)", "ASM: a write with model content on an idle conversation does not start a run; verify in plan"]
decided_by = "operator, 2026-10-29 session"
decided_on = "2026-10-29"

