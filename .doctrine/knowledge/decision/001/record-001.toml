[facet]                         # every field typed; seeded empty (captured later)
context = "Streaming output must not disturb a multiline draft."
choice = "Use a dedicated editable draft buffer alongside a read-only comint transcript. RET inserts newline; C-c C-c sends the entire draft."
alternatives = ["Compose in comint's prompt region"]
rationale = "Separate buffers keep stream insertion and output-follow independent of draft point and text."
consequences = ["The session uses two buffers and needs explicit discoverable key bindings."]
