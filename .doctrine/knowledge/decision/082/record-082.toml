context = "A topic write and conversation creation must check a model against the gateway catalog, which only startDaemon holds (src/daemon-start.ts:210); conversations() has no catalog (research.md fact 3)."
choice = "requireKnownModel moves to src/models.ts and takes a ref string, returning a ModelRef or throwing 'unknown model <ref>'. startDaemon builds requireModel: (ref) => ModelRef from the loaded catalog and passes it to conversations(...) and the thread deps. Conversation code depends on that function, not on pi-ai Models."
alternatives = ["Pass Models into conversations(): couples conversation code to pi-ai's catalog API and makes tests build catalogs", "Expose Models on Session"]
rationale = "Narrowest dependency; tests stub one function."
consequences = ["~30 conversations(session, DEFAULTS, profile) test call sites gain an argument", "requireKnownModel gets its first direct test, with a slashed-id catalog fixture"]
