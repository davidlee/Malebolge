context = "SL-010 (DEC-083..086) gives every topic an optional model, applied at creation through topicInit; <project>-bridge topics match the topic name rule and appear in malebolge-set-topic-model's completion. ISS-004 M-15, M-18."
choice = "Intended. pair creates the bridged conversation through topicInit, so a bridge topic's stored model, else the daemon default, becomes SATAN's model for that project. A stored model the catalog lacks refuses pair with refused {reason: unknown model <ref>} and nothing is created (DEC-083); the extension reports it like any other pair refusal."
alternatives = ["Bridge topics carry no model: exclude them from set-topic-model and its completion"]
rationale = "No code beyond the shared seam; a per-project SATAN model is a reasonable operator choice; exclusion would add a special case."
