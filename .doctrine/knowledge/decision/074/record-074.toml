context = "DEC-059: transport is a deployment concern; malebolge's design owns the contract, other repos' sessions make their changes. The room daemon's jail already binds /run/user/1000/satan/durable/room read-write (satan flake.nix:486)."
choice = "Contract: (1) the directory …/durable/room/bridge, created before a pi jail starts, ro-bound into pi jails; (2) MALEBOLGE_BRIDGE_SOCKET forwarded; (3) pi-bridge/ ro-bound at ~/.pi/agent/extensions/malebolge-bridge; (4) a read-only option for the project mount (--ro-bind). A ~/flakes backlog item carries it."
alternatives = ["Change the satan launcher to create the directory: unnecessary, the daemon creates it inside its rw bind; the flakes combinator's host-side mkdir covers the before-start case"]
rationale = "One owner per side; no cross-repo edits from this slice."
