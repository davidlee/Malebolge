slug = "a-pairing-binds-one-pi-session-to-one-bridge-mode-conversation-by-a-token-the-newest-connection-wins"
title = "A pairing binds one pi session to one bridge-mode conversation by a token; the newest connection wins"
record_kind = "decision"
status = "accepted"
created = "2026-10-29"
updated = "2026-10-29"
tags = []

[facet]                         # every field typed; seeded empty (captured later)
context = "The daemon cannot reach into a jail, so pi dials out. Every jail is the same uid and shares one socket directory (research X3). Mode is fixed at creation (DEC-025)."
choice = "pair {posture, project} creates a bridge-mode conversation in the topic <project>-bridge, where project is the project root basename. The topic is created with toolset bridge on first pair, so DEC-025's rule (a new conversation takes its topic's toolset) selects bridge unchanged. A topic of that name with another toolset is refused, as is a name the topic rule rejects. The pair commit also writes a pairing document holding a hash of a random token; paired {conversation, token} replies. The extension stores {conversation, token} in its pi session (appendEntry) and sends resume {conversation, token} on every reconnect. A valid resume supersedes any live connection for that pairing (the old one is closed with a reason). end closes the pairing: later frames for it are refused; the conversation stays an ordinary transcript."
alternatives = ["No token, pairing by conversation id alone: any session could resume any pairing by accident", "Token held in memory only: pairing would not survive a pi restart"]
rationale = "Cheap reconnect and resume across pi restarts; the token stops a wrong session resuming a pairing by accident. The mount is the real boundary."
consequences = ["Accepted residual (operator): session files live in the shared jail home so a subverted jail could read another pairing's token; supervised agents", "project is a client assertion used only for naming", "the topic name is validated and a mismatched toolset is refused", "bridge conversations live in their own topic so attach by project topic never lands on one", "Accepted residual: pi writes no session file before the first user or assistant message; a pairing made before then dies with that pi process and the operator pairs again"]
decided_by = "operator, 2026-10-29 session"
decided_on = "2026-10-29"

