[facet]                         # every field typed; seeded empty (captured later)
statement = "The operator must be able to tweak screwtape's classifier schema (mail-1) without cross-repo brittleness. Malebolge validates classify answers by type shape (choice/noul/score), never by question name, and passes schema through without comparing it to a fixed id. Rendering is generic by answer type, bounded by a fixed per-item budget. Question names appear only in the pre-filter policy table; a named question absent from the answers makes the item unclassified (withheld) with the missing question named in the header."
