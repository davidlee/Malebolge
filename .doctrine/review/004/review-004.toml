title = "reconciliation review of SL-001"
# no status — a review's status is DERIVED from its findings, so
# it is never stored (the storage rule forbids derived data in authored files).

[review]
facet     = "reconciliation"     # scope|design|plan|phase-plan|implementation|code-review|reconciliation
raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = """
Conformance audit of SL-001 on main (4ef3751..6c8ca60, plus fix 336b317). Checked:
- the delivered code against design sec-1..sec-6 as amended by DEC-006;
- `slice conformance`;
- `just check` (1813 tests), `just ert` and `just smoke` (5 of 5 runs);
- `slice verify-vt` (all VTs pass) and `doctrine check gate` (no recipe; CHR-001);
- the smoke's event order against pi-durable's submit semantics (EVD-001).
8 findings, all terminal. The design drift (F-1, F-2) and the selector drift (F-4) are in the Reconciliation Brief.
"""

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-001"

[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "Design sec-5 still specifies pre/post output hooks; implementation uses comint's native follow (DEC-006)"
detail = """
Expected: design.md sec-5 (and the sec-6 code-impact row for emacs/malebolge.el) describe the shipped following rule.
Observed: sec-5 specifies buffer-local preoutput/postoutput hooks that follow windows whose view included the old end, and says returning to the bottom resumes following. DEC-006 (accepted by the user) replaced this with comint's native rule: a window follows only when its point is at the process mark; a scrolled-back window resumes with M->. emacs/malebolge.el sets `comint-scroll-to-bottom-on-output` nil and has no hooks; README and malebolge-help document M->. PHASE-04 EX-1 ("only transcript windows that showed the old end") is worded to the old rule; plan criteria are immutable, so it is read as amended by DEC-006.
"""
disposition = "design-wrong"
response = """
The implementation is correct per DEC-006; the design is stale. Reconciliation brief: rewrite design.md sec-5 to DEC-006's point-at-mark rule, M-> resume, and no hooks, and fix the sec-6 emacs/malebolge.el row. PHASE-04 EX-1 is not edited (immutable); the brief records that it is satisfied as amended by DEC-006.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "design-wrong"
response = """
The implementation is correct per DEC-006; the design is stale. Reconciliation brief: rewrite design.md sec-5 to DEC-006's point-at-mark rule, M-> resume, and no hooks, and fix the sec-6 emacs/malebolge.el row. PHASE-04 EX-1 is not edited (immutable); the brief records that it is satisfied as amended by DEC-006.
"""

[[finding.turn]]
