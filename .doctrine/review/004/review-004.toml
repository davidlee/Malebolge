[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Design sec-4 omits a live user turn arriving mid-answer and the daemon's queued-input order"
detail = """
Expected: sec-4 states how a live user turn interacts with an answer in flight, matching the daemon's event order.
Observed: src/render.ts routes a live user message_end through `interrupt` (fresh line, later text under `Satan (continued):`), added in PHASE-05; sec-4 says nothing about it. pi-durable's `Conversation.submit` docs (node_modules/@earendil-works/pi-durable/dist/harness/types.d.ts:595) say a busy conversation queues input in `pi.inbox`, so the real echo lands at a turn boundary; the interleaved case arises only from atypical event orders. Sec-2's "daemon's user event supplies the transcript echo" is consistent, but sec-4 should state the boundary order and the defensive cut-in.
"""
disposition = "design-wrong"
response = """
The code is correct: a defensive cut-in is right for either order. Reconciliation brief: add to design.md sec-4 that a busy conversation queues input, so a live user turn normally follows the answer's completion, and that a user turn arriving mid-answer is handled as a notice-style interruption.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "design-wrong"
response = """
The code is correct: a defensive cut-in is right for either order. Reconciliation brief: add to design.md sec-4 that a busy conversation queues input, so a live user turn normally follows the answer's completion, and that a user turn arriving mid-answer is handled as a notice-style interruption.
"""

[[finding.turn]]
act = "verify"
role = "raiser"
note = "Reconciliation Brief entry written"

[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "Smoke test modelled a mid-answer echo the real daemon does not produce"
detail = """
Expected: test/emacs-attach-smoke.ts's fake daemon follows the real daemon's event order so its transcript assertion reflects real output.
Observed (at 6c8ca60): the fake echoed the input as the user message_end immediately on receipt, between streamed chunks, and the check asserted `You:` ... `Satan (continued):` mid-answer. pi-durable queues input to a busy conversation (see the sec-4 finding), so the real echo follows the answer's message_end. The smoke therefore pinned an unrealistic transcript and never exercised the realistic one end to end. The mid-answer interleaving remains covered by render.test.ts.
"""
disposition = "fix-now"
response = '''
Fixed in 336b317. The fake daemon now echoes the input as the user message_end after the answer's message_end. The elisp waits for the echo (ECHOED), and the check asserts `Satan:\n<answer>\n\nYou:\n<draft>\n[status] detached\n`. Just smoke passed 5 of 5 runs; eslint and tsc are clean. Interleaved order stays covered by render.test.ts.
'''

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
