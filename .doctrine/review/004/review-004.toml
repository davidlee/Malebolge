[[finding]]
id = "F-5"
status = "verified"
severity = "nit"
title = "Terminal presentation drops trailing newlines that arrive only at message_end"
detail = """
Expected (plan PHASE-01 EX-1): the default terminal output reproduces existing expectations.
Observed: all existing terminal render tests pass unchanged, but terminal behaviour differs in one untested edge: trailing newlines present only in the final message_end text (not streamed) are no longer printed; the old renderer printed them plus a terminator. Emacs prints them (snapshot parity). Accepted during PHASE-01 review as benign.
"""
disposition = "tolerated"
response = """
The terminal presentation is one-line oriented. Trailing newlines that arrive only at message_end carry no content, and the terminal still ends every answer with its line terminator. Matching the old bytes would need a terminal-only branch in the shared end-of-message path, adding code for no user-visible gain. The plan's terminal test expectations are unchanged. Accepted during the PHASE-01 review.
"""

