[[finding]]
id = "F-7"
status = "verified"
severity = "minor"
title = "A draft queued mid-answer is invisible in the Emacs transcript until the turn boundary"
detail = """
Expected (sec-2): a submit gives the user enough feedback; only the daemon's user event echoes the turn.
Observed: since the daemon queues a mid-answer input (pi.inbox), the transcript shows nothing until the answer ends; the only feedback is the minibuffer "malebolge: sent N characters". The renderer silences `inbox_update`. This meets sec-2, which allows a local minibuffer acknowledgement, but a long answer leaves the queued message unseen. It is a UX gap outside this slice's design, not a defect.
"""
disposition = "follow-up"
response = """
Captured as IDE-001. It meets the locked sec-2 (a minibuffer acknowledgement is allowed); changing it is new UX scope, not a defect in this slice.
"""

