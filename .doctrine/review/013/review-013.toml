[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Design sec-2 room masking evidence cites a launch path malebolge does not use"
detail = """
Design sec-2 says the room daemon is "started through the room user's login shell (pi-env/dist/ssh.js:421)". That is pi-env's sshConnectionFor/launchCommand path, login shell only when options.loginShell === true (ssh.js:405-421). Malebolge builds its own command: src/room/connection.ts:238 [ssh, ...sshArguments(target, true), launch(daemon)], directLaunch = [daemon] (:57), with -o SendEnv=-* (pi-env/dist/ssh.js:65). Production room daemon env is sshd's non-login env for the room user (inference: SATAN_* reaches it only via PAM/pam_env or ~/.ssh/environment). DEC-021 still holds as defence in depth; the stated reason is wrong, and PHASE-02 EX-4's fixture (fake ssh inheriting the test process env) over-approximates production — the plan should say so. Verified by orchestrator at the cited lines. pi review, quotient run-20261024T111155349Z-9.
"""
disposition = "design-wrong"
response = """
Design sec-2 Masking rewritten (design.md edited directly, user 2026-10-24): room daemon launched directly (connection.ts:57,238, SendEnv=-*), sshd's non-login env; inherited SATAN_* only via sshd/PAM (inference); masking is defence in depth; merge order daemon < shellEnv < per-exec checked by running the shipped daemon; scope limited to env (BASH_ENV) and inheritEnv: false noted. Plan PHASE-04 EX-2 states the fixture over-approximates production. DEC-021 unchanged.
"""

