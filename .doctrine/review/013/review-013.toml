[[finding]]
id = "F-9"
status = "open"
severity = "minor"
title = "Masking tests: process.env mutation against a lazy shared daemon"
detail = """
EX-2/EX-4 set SATAN_TOPIC on process.env. The room daemon is spawned lazily at first exec and kept by the connection (test/daemon-env.test.ts:139-147; src/room/connection.ts:178-193), and inherits env at spawn. The variable must be set before the first exec on a fresh connection and restored in afterEach; plan notes say restore only. pi review, quotient run-20261024T111155349Z-9.
"""

