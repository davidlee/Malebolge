[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "Env-build failure semantics unspecified: a failed index read now fails the tool call"
detail = """
The hook becomes async and reads the index on every build. A rejected env promise is caught at pi-durable/dist/harness/tool.js:309-329: result isError, task ending failed ("Tool <name> threw"). readIndex can reject (storage error; pi-durable documents.js:78-86 refuses a newer/migrating malebolge.index version). Before SL-004 neither hostEnv nor roomEnv construction could throw. The prompt path instead degrades (generation.js:63-71 passes env undefined; prompt.js falls back to shown). Design sec-3/sec-6 state no policy (propagate vs degrade to empty context) and no criterion covers it. Verified by orchestrator at tool.js:309-329. pi review, quotient run-20261024T111314368Z-10.
"""
disposition = "design-wrong"
response = """
User decision 2026-10-24: a failed index read propagates; the tool call fails with the error's message, no fallback to an empty context (would write a wrong mem.origin attribution silently). Design sec-3 "Failure" bullet and new design VT-6; plan PHASE-02 EX-7 + VT-5.
"""

