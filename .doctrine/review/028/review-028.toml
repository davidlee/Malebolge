Fixed in this audit: READ_PARAMETERS' max_bytes text is now built from READ_MAX_BYTES, as READ_DESCRIPTION is. Red then green: test/mail/tools.test.ts "mail_read's max_bytes parameter states READ_MAX_BYTES (RV-028 F-2)" (asserts against the constant, not a pinned number).
"""

