[[finding]]
id = "F-11"
status = "verified"
severity = "minor"
title = "Expected 'bridge stopped' to fail only classification (VH-1 step 4); observed it takes the room's model down too"
detail = """
Expected: design § Reaching Jev from the jail: "A dead bridge … degrades to unavailable/failed items, withheld and counted in the header". VH-1 step 4: "with the bridge stopped, items are unclassified and withheld".
Observed (2026-10-30 11:02): killing the jail's socat (TCP 127.0.0.1:4000 → gateway client socket) made the room's own model calls fail ("model error: connection error"; journal: wake 1976 failed: unanswered (model_error)). /home/david/.config/malebolge/gateway-models.json has baseUrl http://127.0.0.1:4000/v1: the room model and Jev share the one bridge. The bridge also predates SL-007 (an old instance's socat exits in the 10:39:55 journal).
Consequence: step 4 cannot be observed as written, because with the bridge down there is no agent left to call a mail tool. The design's diagram and the "Malebolge knows nothing of the bridge" framing present the bridge as Jev's transport only. A dead bridge is a room outage, not a degraded mail state. The degraded mapping itself (classify failure → unavailable/failed → withheld, counted) is covered by VT: PHASE-02 VT-2, PHASE-05 VT-2.
"""
disposition = "design-wrong"
response = """
The code is right; the design's model of the bridge is wrong. Reconcile design.md § Reaching Jev from the jail: the jail's 127.0.0.1:4000 bridge carries the room model's traffic (gateway-models.json baseUrl) as well as Jev's, and it predates SL-007. So a dead bridge is a room outage, not a degraded mail state. The degraded state the design means is "Jev unreachable while the model is up", which yields unavailable/failed items, withheld and counted. Also correct § Verification VH step 4 to that wording (observed by VT, PHASE-02 VT-2 and PHASE-05 VT-2) and the slice's risk line accordingly. Operator choice (a), 2026-10-30: steps 1–3 pass live, and step 4 rests on VT.
"""

