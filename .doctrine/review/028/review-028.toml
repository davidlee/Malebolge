[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Expected mail_read's max_bytes description to state 1024-16384; observed 1024-32768"
detail = """
Expected: design § Jev's window: "mail_read's max_bytes stays at most 16,384"; READ_MAX_BYTES = { min: 1024, max: 16384 } (src/mail/tools.ts:59).
Observed: READ_PARAMETERS (src/mail/tools.ts, `max_bytes: Count("Bytes of body (1024-32768)")`) still advertises 32768. READ_DESCRIPTION is computed from READ_MAX_BYTES and is right, so the tool's description and its parameter schema disagree. A call above 16384 is clamped and reported, so the effect is a misleading schema and a clamp line, not a wrong bound.
Fix: derive the parameter text from READ_MAX_BYTES as READ_DESCRIPTION does.
"""
disposition = "fix-now"
