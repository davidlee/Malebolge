[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "Expected too_large/unavailable only on a non-zero exit (design table); observed stderr read for any ending"
detail = """
Expected: design § One classify(ids) call, step 4 table: `too_large` (jev_context at input[k]) and `unavailable` (config / credential) rows require "exit != 0"; "any other exit, timeout, spawn failure, stdout breach" -> input[k..n) failed.
Observed: src/mail/screwtape.ts stopReason(spawned, current) reads firstDiagnostic(spawned.stderr) without checking spawned.outcome. A timeout, spawn failure or breach whose stderr holds an error line `limit_exceeded`/`jev_context` naming input[k]'s cursor maps input[k] to too_large. too_large is cached (classifications.ts cacheable), so a transient failure would withhold that message until restart. With `config`/`credential` it would map to unavailable instead of failed (harmless, uncached).
Tests: test/mail/screwtape.test.ts "any other ending" covers timeout/spawn_error/breach only with empty stderr, so the gap is untested.
Likelihood is low (screwtape writes the error line and then exits), but the fix is one guard: read stderr only when outcome is exited with a non-zero code.
"""
disposition = "fix-now"
response = """
Fixed in this audit: src/mail/screwtape.ts stopReason reads stderr only when exitedFailing(spawned), meaning no breach and exited with a non-zero code. Every other ending is `failed`, as the design table says. Red then green: test/mail/screwtape.test.ts "any other ending > with a <jev_context at input[k] | credential> stderr line" x timeout / spawn_error / breach, 6 cases (all 6 failed before the fix).
"""

