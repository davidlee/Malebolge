title = "Expected DEC-007 and DEC-010 to describe shipped behaviour; observed DEC-007 still prescribes `list: unknown key topic` and DEC-010 still refuses `--here`"
detail = """
Expected: accepted decisions agree with what SL-003 shipped (design sec-7 "Decision amendments at reconcile" lists them as owed).
Observed (`doctrine show DEC-007`, `DEC-008`, `DEC-010`, today):
- DEC-007:86-87 says the next step will send `{"type":"list","topic":"name"}` and that it "must be answered `list: unknown key topic`". SL-003 retired that refusal; `list` now takes `topic` and `topics`, and a new reply type `topics` exists (DEC-016).
- DEC-010:1,34 "labels, `--here` and paging are refused". `--here` now ships, host-only (DEC-014).
- DEC-008 names the `--list` exclusivity set; SL-003 widened it with `--topic`, `--topics`, `--set-topic`, `--dir`/`--no-dir`, `--here` (DEC-017, design sec-5).
Major: a future agent reading governance would refuse or "fix" shipped behaviour.
"""
disposition = "design-wrong"
response = """
Governance drift, owed at reconcile per design sec-7. A DEC is not a REV target (SL-002 precedent, RV-007 F-1): reconcile appends amendment sections to DEC-007, DEC-008 and DEC-010 by direct edit. Reconciliation Brief § Decisions.
"""

