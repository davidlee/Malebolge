disposition = "fix-now"
route = "review"
response = """
Accepted. The observation holds and extends to entries: storedEntry and indexConversation read StoredEntry outside entryToolsets. Fix in prose (R-1): IndexDoc holds honest stored types (StoredEntry and a new StoredTopicRecord, toolset StoredToolset); TopicRecord, NamedTopic and IndexEntry stay DaemonToolset. One pure function, liveToolset, maps StoredToolset to DaemonToolset by the RETIRED rule; entryToolsets uses it and writes back, and the existing narrowing readers (storedEntry, storedTopic, topicsOf, indexConversation's fork copy) use it too, so the types are honest without casts. The readers never meet bridge at runtime once reconcile has run; the claim in sec-3 is restated as that. Settled in this review; no DEC change (DEC-101 says rewrite once, which still holds).
"""

