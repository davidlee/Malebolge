[[finding]]
id = "F-7"
status = "verified"
severity = "nit"
title = "Two import doors onto one vocabulary: jobs.ts re-exports vocab.ts, store.ts re-exports rows.ts"
detail = """
Expected: a concept has one import site, so the canonical home is where a reader looks.

Observed: two modules re-export another module's vocabulary, giving each concept two doors:

  src/runner/jobs.ts:10-16   re-exports END_REASONS, isJobState, JOB_STATES, EndReason, JobState from ./vocab.ts (whose own header states it is "data only; the rules over them live in jobs.ts and classify.ts")
  src/runner/store.ts:35     re-exports Job, JobEvent, NewJob from ./rows.ts

Both doors are in use — vocab.ts has 13 importers and jobs.ts 6; rows.ts 3 and store.ts 15 — so neither is dead. The effect is mild but real: an author asking "where is JobState defined?" gets two answers, and the answer that is a re-export looks like ownership. It also makes the dependency graph read as if `jobs.ts` owned states it merely passes through.
"""
disposition = "follow-up"
response = """
Accepted, low priority, and the remedy is a judgement call rather than a fix: both doors are load-bearing (vocab 13 importers, jobs 6; rows 3, store 15), so removing the re-exports means touching call sites in both directions. The smaller version — keeping `jobs.ts`'s re-export but stating in its header that `vocab.ts` owns the data — buys most of the clarity for one comment. Deferred; no vehicle yet, worth folding into whichever slice next touches the runner's vocabulary.
"""

