[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "The runner has no in-repo mechanism record; its invariants are cited by label against a foreign corpus"
detail = """
Expected: this repo accounts for the mechanism half its source implements — the state machine, the recovery split, the ceiling/warning rules, the port/adapter seam — so a change here can be checked against intent here.

Observed: 8.2k of `src`'s 10.4k lines (45 files) are the patch runner, and the repo has no account of it. `docs/internals.md` is 118 lines and covers the daemon only (its opening line: "Notes for working on Malebolge. The README covers what it is"). The README's runner section is good product copy — queue, scopes, ceilings, quarantine, promotion — but says nothing about how the runner is built.

The code's own comments are dense with rationale and cite it by label: ~150 occurrences of ~35 distinct labels across `src` (I13 x13, DEC-057 x15, DEC-065/DEC-060 x10, DEC-054 x9, EX-8 x7, AS-4 x5, EVD-008 x7, R1 x4, PHASE-09 x5, plus SL-006/SL-026/PHASE-01..15/OQ-A..C). `grep -rE 'I16|EX-8|DEC-055' docs .doctrine` returns nothing: none of the labels is defined in this repository. `.doctrine/` holds no slices, one backlog item and an unedited `project-orientation.md`. The design they name lives in the SATAN repo (README:176 names it; SPEC-004, SL-023..SL-026).

This is not merely missing prose. The comments assert rules the reader cannot verify: `run.ts:1-34` justifies the entire ordering of a run by DEC-055/057/054 and I16; `rejoin.ts:1-12` justifies the two-phase recovery split by I14/I15/R1/R2; `guard.ts:1-16` justifies which hook may write the audit by EVD-008. A reviewer here cannot tell whether a change preserves I15, and cannot tell why `shell.ts` exists between `room.ts` and `pause.ts`. Since the review's own purpose is deciding what moves where, the reasons for the present boundaries are the thing most needed and the thing least available.

Fix shape is IMP-002 step 3. A `docs/runner.md` carrying the state machine, the phase A/B split, the one-warning/ceiling rules and the seat/tenancy invariant would do; it need not restate SATAN's slice record, only be sufficient to judge a diff locally.
"""
disposition = "follow-up"
response = """
Accepted, and it is the finding I would fix first. Deferred to IMP-002 step 3: a `docs/runner.md` (or a technical spec once SATAN's SL-023..SL-026 settle) covering the state machine and legal moves, the phase A/B recovery split with its I14/I15 rationale, the one-warning and ceiling rules, the room/slot port seam, and the seat/tenancy invariant. It should carry the labels it uses rather than cite them by number alone, so the next reader can judge a diff here. Out of scope for this pass: rewriting the existing comment citations, which are accurate today. Nothing changed.
"""

