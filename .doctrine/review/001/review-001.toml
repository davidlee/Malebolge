Read all 26 modules of src/ (10.4k lines) and the test tree's shape, not just the diff: the import census (fan-in/fan-out per module, computed), a TS-AST census of every function's length and branch count (879 functions; none over 82 lines or 12 branches), each module's exported vocabulary, the runner's dependency-injection shapes, docs/ and .doctrine/ for the design record the comments cite, and the structural tests (test/runner/room.test.ts "door knowledge (EX-10)"). Contract, coupling direction and the two programs' seams were verified by computation rather than reading alone; every line reference was re-read before raising.
