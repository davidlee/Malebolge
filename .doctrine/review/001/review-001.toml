[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "run.ts aggregates seven concerns in 660 lines; the natural units are already marked by its own section comments"
detail = """
Expected: one use case per module, or a stated reason for the aggregation.

Observed: `src/runner/run.ts` is 660 lines with 24 module imports (the runner's highest efferent coupling; the next is start.ts's 22, which is a composition root and earns it). It holds seven concerns, and its own section comments already draw most of the lines:

  - the pre-run ending: endUnrun, startPreparing            (~85-140)
  - run construction and seat composition: openRun, meterOf, runStops, seat, armed, unarmed  (~200-330)
  - admission: admit (room ready + project context + recordDegradations + configure + prompt + submit + `running`)  (~331-390)
  - settlement: settleSubmission, settle, endStrayWarning, settleSegment  (~395-470)
  - the segment loop: runSegments, afterSegment, toCollecting, recordCancel  (~470-560)
  - the waiting episode: awaitResume, owesWarning  (~560-620)
  - the entry points: superviseRun, prepareAndAdmit, runJob  (~620-660)

To be clear about what is *not* wrong: there is no god function here. The longest function in `src` is 82 lines (`startRunner`), and run.ts's own are all under 60. The problem is aggregation, not complexity.

Two consequences worth weighing. First, no unit-level test can reach any of these concerns: `test/runner/run.test.ts` (496 lines) and `ceilings-harness.test.ts` (548) drive run.ts through `run-fixture.ts`, which stands up a faux provider, a real SQLite handle, a local pi-env daemon and a fake slot — so a change to settlement is tested by booting a world. Second, `admit()` is where the layering blurs most: one function knows the room shell, the project-context fetch, the prompt composition, the conversation's model/extension configuration, and the `running` transition. Every other runner module is a narrow, injected dependency; admit is the one place that reaches across all of them.

The extraction is mechanical (the section comments are the cuts). *Where* admission belongs — with `prepare.ts` and `prompt.ts`, or with the run — is the decision that needs F-2's record first.
"""
disposition = "follow-up"
response = """
Accepted with a caveat on ordering. The aggregation is real and the cuts are already drawn, but choosing where admission belongs (with `prepare`/`prompt`, or with the run) is a design decision, and the design it would have to respect is F-2's missing record. So: deferred to IMP-002 step 4, strictly after step 3. The sub-finding worth acting on independently is admission's testability — once F-2 is written, extracting `admit` to a module with its own deps would give the settlement and segment-loop units their first harness-free tests. Nothing changed.
"""

