[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "The shared kernel is real but unnamed: src/ mixes the runner's contract with the daemon's private modules"
detail = """
Expected: a module that a second program may import is identifiable from the tree, and one that only the first program uses is too — so a move, a rename or a new import cannot cross the seam unseen.

Observed: `src/` holds 26 non-entry modules for two programs with no directory to say which is which. The dependency is clean and one-way — no root module imports `src/runner/*` except the `runner-main.ts` entry point — but the runner's contract set is emergent:

  runner imports (count of runner modules):
    src/json.ts           12
    src/fields.ts         11
    src/context.ts        10
    src/config.ts          2   (parseModel only: run.ts:34, model-gate.ts:38)
    src/project-context.ts 2
    src/session.ts         1   (registryOf only: start.ts:26)
    src/grep.ts            1
    src/message-of.ts      1   (via runner/errors.ts:37)
    src/models.ts          1   (via runner/gateway.ts:8)
    src/ndjson.ts          1
    src/truncate.ts        1
    src/unix-socket.ts     1

  runner never imports (14): attach-main, attach, cwd, daemon-extensions, daemon-main, daemon, persona, protocol, render, runner-main (entry), satan-tools, skills, unix-socket-transport, xml (transitively shared via project-context).

So twelve modules are contract and fourteen are private, distinguished only by an unwritten convention. The cost is asymmetric: an author tidying `session.ts` into a daemon directory, or moving `parseModel` into `runner/config.ts`, silently inverts an arrow or breaks a dependency the code relies on, and nothing fails until a runner test does.

The repo already knows how to express this. `src/project-context.ts` is the reference shape for a shared module (policy in one place, the acquisition injected: daemon reads node fs, runner reads the room shell). `test/runner/room.test.ts:624` "door knowledge (EX-10)" is the reference shape for enforcing a boundary structurally — it asserts which files may name the door, and fails if a new one does. `test/` itself already encodes the very seam `src/` lacks: `test/*.test.ts` is the daemon's, `test/runner/*` the runner's.

Fix shape is IMP-002 steps 1-2; the structural test in step 1 is the durable part.
"""
disposition = "follow-up"
response = """
Accepted. The seam is real and one-way; what is missing is its expression, not its integrity, so the fix is a move plus a test rather than a redesign. Deferred to IMP-002 steps 1-2: the shared directory and split of `config.ts`/`session.ts` first, then the structural test that mirrors EX-10 ("only `runner-main.ts` imports `runner/*`; `runner/` imports no root module outside the shared allowlist"). That test is the part worth keeping — a directory is a suggestion, the test is the boundary. Nothing changed in this pass.
"""

