[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "Two config.ts and two protocol.ts modules; parseModel and ModelRef sit in the daemon's config"
detail = """
Expected: one meaning per name for the concepts that carry the wire and the port types.

Observed: `config` names two unrelated things in sibling modules — `src/config.ts` (process environment to paths, for the daemon: `Config`, `resolveConfig`, `daemonSocket`) and `src/runner/config.ts` (TOML text to typed config: `RunnerConfig`, `parseRunnerConfig`, 454 lines, 16 importers). Same for `protocol`: `src/protocol.ts` is the client↔daemon message set, `src/runner/protocol.ts` the control socket's request set. The second of each pair is correctly the runner's; the collision only costs the reader a disambiguation on every mention, and it will cost more if either moves into a shared directory.

The sharper half of this finding is `parseModel`. `ModelRef`, `DEFAULT_MODEL` and `parseModel` (src/config.ts:7-38) are shared vocabulary — `runner/run.ts:34` and `runner/model-gate.ts:38` import them — sitting in the daemon's environment-resolution module. That is a genuine misplacement today, not just a naming clash: the runner depends on a daemon-named file for a pure string parser.

Also: `Env` is spelled twice for the same thing (`src/config.ts:28` local, `src/runner/errors.ts:42` exported), as is "a required environment variable" — `required` (src/config.ts:40, throws Error) and `requiredEnv` (runner/errors.ts:47, throws StartRefused). Two failure types is defensible (startup refusal vs daemon throw); two `Env` types is not.

Fix shape: IMP-002 step 1's split of `src/config.ts` (parseModel to the shared module, `Config` stays with the daemon), and one `Env` type.
"""
disposition = "follow-up"
response = """
Accepted. Two halves with different urgency: `parseModel`/`ModelRef`/`DEFAULT_MODEL` sitting in the daemon's environment-resolution module is a real misplacement (the runner imports it from a daemon-named file), fixed by IMP-002 step 1's split of `src/config.ts`; the `config`/`protocol` name collisions are disambiguation cost only, and resolving them in the same move is cheap. One `Env` type, either in the shared kernel or per program, but not both. Deferred to IMP-002 step 1. Nothing changed.
"""

