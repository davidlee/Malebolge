[[finding]]
id = "F-7"
status = "verified"
severity = "major"
title = "Client notices must share renderer stream state"
detail = "design.md:46 routes direct attach notices through an independent helper, while design.md:50 expects the renderer to resume assistant text after an interrupting notice. A malformed Emacs frame or detach notice during an answer can make later assistant deltas append without a continuation cue. Route in-stream client notices through the stateful renderer; only preconnect failures may be formatted statelessly."
disposition = "fix-now"
route = "review"
response = "All in-stream client notices now pass through the same stateful renderer as daemon events; the design explicitly covers continuation cues and adds a renderer check for a client notice during an answer."

