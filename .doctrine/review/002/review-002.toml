[[review.turn]]
act = "conclude"
role = "raiser"
note = "Read-only hostile pass over the materialised SL-001 design and current Emacs, attach, renderer, protocol, and focused test surfaces; seven findings integrated and verified against revised design text."

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-001"

[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Route --emacs through one strict CLI parser"
detail = "design.md:34 and :65 require --emacs with target options, but src/attach.ts:40-52 parses argv strictly and src/attach-main.ts:24-27 passes all args to attachTargetOf. The design must name the single parser extension; otherwise --emacs is rejected or validated in a second parser."
disposition = "fix-now"
route = "review"
response = "Added a single strict invocation parser in the attach client; main consumes the parsed target and mode. The design now names the existing parser extension and combined flag validation."

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
route = "review"
response = "Added a single strict invocation parser in the attach client; main consumes the parsed target and mode. The design now names the existing parser extension and combined flag validation."

[[finding.turn]]
act = "verify"
role = "raiser"
note = "design.md:34 and :69-70 now name one strict parser shared by main and attach."

[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "Prevent transcript comint input from reaching frame stdin"
detail = "design.md:6 and :30 call the transcript read-only and say typing does not submit, while emacs/malebolge.el:47-52 currently creates ordinary comint. The design must disable comint-send-input at the sender and route RET to the draft; a read-only visual treatment alone does not protect stdin."
disposition = "fix-now"
route = "review"
response = "Specified a read-only transcript, RET routing to the draft, a refusing comint input sender, and direct process-send-string only from the draft. ERT now checks that transcript input writes zero bytes."

