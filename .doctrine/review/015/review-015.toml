[[finding]]
id = "F-3"
status = "verified"
severity = "blocker"
title = "Only bodies are bounded: one hostile message can block all progress"
detail = "sec-4: subject, preview, address lists, references, attachments, mailbox names are unbounded in v1 and in our projection. One message with a huge Subject makes mail_new(limit 1) exceed MAIL_MAX_BYTES; fail-the-call then repeats forever and the cursor can never pass it. Need per-field bounds and a guarantee that limit 1 at minimum max_bytes always fits. Sources: M-1, M-13."
disposition = "fix-now"
response = "Operator agreed a redesign (2026-10-28, reply: agree). sec-4 Bounds now measures every size in rendered bytes; each item has a core (ids and received_at validated by the contract schema, subject capped at 200) of at most 1 KiB (read: 2 KiB), and limits are clamped so the core fits its share; other fields fill in a fixed order and are left out when they do not fit; the body is cut to the remainder. No stub, no over-budget error. DEC-026 refreshed to this mechanism. Control: the criterion must reject an implementation that measures caps or the body on raw bytes, and one that drops or replaces a message; VT-8's property test over generated hostile envelopes at every limit asserts each result is within MAIL_MAX_BYTES and every core is whole. Host phase needs the pure render and projection modules and the v1 fixtures."
route = "control"

