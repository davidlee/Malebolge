detail = "sec-4 Bounds. Budget = (50 KiB - 2 KiB) / limit (limit 10: 4915 B; 20: 2457 B; thread 100: 491 B; list 50: 983 B) while max_bytes and field caps count raw bytes; the three JSON-escaped characters cost 6 B each and are the commonest in quoted mail. Failures: limit 10 default, a body with 820 B of quote markers escapes past 4915 and the whole message (subject, from, preview) becomes an id-only stub; limit 20, 410 B suffices; mail_read max_bytes 32768 of escape-heavy text (about 192 KiB) stubs although max_bytes 1024 would show it; a normal 512 B subject + 512 B preview + 10-entry from is about 5.2 KiB, over the limit-20 budget; at thread and list maxima a minimal summary (ids + cursor, about 1.2 KiB) exceeds the budget, so every entry is a stub. The stub, meant for hostile mail, becomes the common path. Direction: measure caps on escaped bytes; give the body only the residual budget after the bounded non-body fields (truncate body, flag it) instead of stubbing; size non-body caps so they fit the smallest per-message budget; clamp thread and list limits to the summary size; a stub keeps id, received_at and a bounded subject. Sources: pi adv-budget F-3, F-4, F-7; verify-b N3; verify-c N1."
