response = "Per-field caps with marker, count and cut list; per-message rendered budget; oversize message replaced by a visible stub that still counts toward next. No over-budget failure, no page cut (operator: 'per-field max and truncating, or rejecting the offending message'). DEC-026 refined. sec-4."

[[finding.turn]]
