detail = """
Observed uncovered at HEAD: src/threads/task.ts 64 (isPostInput non-record), 295-296 (abort handler finds the post delivered), 333 (abort: submission not admitted), 383 (blocked report on a non-post input); src/threads/tools.ts 206, 210 (soleCall guards: not an assistant entry / no assistant message), 311 (reap-own commit finds the family already reaped by another conversation); src/threads/admission.ts 126 (caller without index entry). Notes deferred 295-296 and 311 to audit.
