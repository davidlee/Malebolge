[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "behaviour chosen during execution (Autonomy log) is not in the locked design"
detail = """
Expected: design.md tells the truth about observable behaviour; choices the design left open are recorded there once made.
Observed: the Autonomy log (notes.md) records these as decided, but design.md does not carry them:
- sec-2: the top container (placesRoot) adds no path segment and is not a folder; a container with no or an unknown `root` key is named by its title.
- sec-2: a JSON.parse failure, and any throw from the schema check or the walk (deep-nesting RangeError), map to `invalid`; `corrupt` is the mozlz4 frame only. `no_backup` text does not name the directory.
- sec-3: an empty `tag` or `folder` filters nothing, as an absent one (the design says so for `query` only).
- sec-3: ties sort by code unit, not localeCompare. bookmarks_tags counts tags exactly (case-sensitive), while the search `tag` filter is case-insensitive. Probe 2026-10-29 on the live backup (host, counts only): 384 distinct tags exact and 384 case-folded, so 0 case-only collisions today; the asymmetry is latent.
- sec-4: header line order (search: items, matched[, next_offset], source, stale, clamps; listings: `shown N of M[, next_offset: X]`, source, stale, cut by caps, clamps); `stale` counts whole days to `now`'s local calendar date, and a backup dated after now prints no stale line; a non-empty window that fits no item throws rather than sending next_offset = offset.
- sec-2: the decoder is 80 lines, not "~30" (40-line body plus refusals).
Code and tests are consistent with each choice (host review of src/bookmarks/*.ts).
"""
disposition = "design-wrong"
response = """
Each choice is reasonable, fail-closed or deterministic, and test-pinned; the design should carry them. Reconcile appends them to sec-2, sec-3 and sec-4. The tag-case asymmetry is recorded as a known, latent inconsistency (0 collisions on live data) rather than changed: Firefox's own tag handling decides whether it can occur, and IDE-008 step 2 (tag rationalisation) is where it would matter. Brief § Per-slice.
"""

