[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "DEC-009 still prescribes a merged stderr and a ten-second listing bound; the picker's real bound is unrecorded in the design"
detail = """
Expected: an accepted decision and a locked design describe what the code ships, and a mechanism the design leans on for a user-facing guarantee is named somewhere a reader can find it.

Observed: DEC-009's Choice still says "The listing is a synchronous subprocess into a temporary buffer, stderr merged, bounded by the client's own 10 s connect wait." Three of those clauses are no longer true, and only one has an amendment that covers it.

- "stderr merged" contradicts design sec-5 step 1 ("stderr kept in its own buffer rather than merged") and the code: `malebolge--list-conversations` runs the client with `make-process :stderr <pipe-process>` (emacs/malebolge.el:238-262), pinned by the ERT case `malebolge-listing-keeps-stdout-and-stderr-apart`, which runs a real `sh`. The separation is what keeps truncation prose out of the candidate list (RV-005 F-12).
- "bounded by the client's own 10 s connect wait" is false twice over. DEC-008's amendment moved the listing onto `LIST_WAIT` (1 s, src/attach.ts:255), and that wait bounds *connecting*, not answering: the listing client settles on the socket's close. Measured today against a fake daemon that accepts `{"type":"list"}` and never answers, `malebolge-attach --list` was still running when `timeout 20` killed it (exit 124). Measured against no daemon: exit 1 after 1059 ms.

What actually bounds the pause in Emacs is a mechanism neither DEC-009 nor design sec-5 names: `malebolge--list-timeout` (5.0 s, emacs/malebolge.el:220) with `malebolge--await-listing` (:271-282), which delete the client and signal `user-error`. Design sec-5 step 1 claims the `message` + `redisplay` announcement means "a stopped daemon does not freeze the editor silently" — true, but only because of that unrecorded bound; without it the editor waits on the socket indefinitely.

Consequence: PHASE-04 EX-5 ("No shipped document claims the listing waits ten seconds") was checked against README and docs/internals.md only. Both are clean. The accepted decision the slice descends from still carries the ten-second and merged-stderr claims, and the design omits the one mechanism that makes its own guarantee true.
"""
disposition = "design-wrong"
response = """
Confirmed, and the asymmetry is the finding. DEC-008 got the "its amendment supersedes it" treatment (design sec-4 says so in as many words). DEC-009 got amendments for the buffer-local record and for following, but none for the listing's streams or its wait, so its Choice still tells a reader that stderr is merged and that ten seconds bounds the listing.

The measurement settles the wait: 1 s bounds connecting, the reply is unbounded (>=20 s against a daemon that accepts the frame and says nothing), and only `malebolge--list-timeout` (5 s) plus `malebolge--await-listing` keeps Emacs responsive — a mechanism design sec-5 leans on without naming.

Delegated to /reconcile. Per-slice direct edit: design.md sec-5 names `malebolge--list-timeout` and `malebolge--await-listing` as the bound that makes "a stopped daemon does not freeze the editor silently" true, and notes that IMP-006 owns the client-side reply bound. Governance: REV amend DEC-009 — stderr kept separate (and why: the truncation prose must not become a candidate, RV-005 F-12), the reply unbounded and measured (2026-10-24, IMP-006), the picker's five-second bound as the defence. No code change: the code is right and the prose is behind it.
"""

