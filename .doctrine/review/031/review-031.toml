[[finding]]
id = "F-2"
status = "verified"
severity = "minor"
title = "Operator-directed pi prompt changes (6eaa43e, ffb8d61, e9698dc) are outside the design; pi-bridge/posture.ts is undeclared"
detail = """
Expected: design sec-7/sec-8 cover every source file changed, and design-target selectors cover them (conformance).
Observed: `slice conformance SL-011` lists `M pi-bridge/posture.ts` as undeclared. Design sec-7 says "The `malebolge-bridge` command and env are unchanged" and sec-8 has no posture.ts row. After PHASE-08's docs, three operator-directed commits changed pi's prompt:
- PI_BRIDGE_ENVIRONMENT: names the `malebolge-bridge send|tee [--turn]` command, its exit codes, the commit-named shared-reference rule, own-side checks, and that bridge_post starts a turn.
- PI_POSTURE_TEXT: placeholders replaced by operator texts (consult: sounding board; delegate: bounded representative).
Accuracy check, done here: the exit codes match `EXIT = {accepted:0, connectFailure:1, refused:2, unknown:3}` (pi-bridge/command.ts:24); `send` prints `accepted` (:146-148); `--turn` selects kind turn (:51-54); bridge_post is a turn (state.ts kind "turn", per notes). The text is accurate, so the defect is the design record and the selector registry, not the code.
"""
disposition = "design-wrong"
response = """
The prompt text is accurate to the code (checked against command.ts) and was operator-directed. The design and the selector registry are what's wrong. Reconciliation Brief § Per-slice: `doctrine slice selector add` for pi-bridge/posture.ts (load-bearing), plus a design.md sec-7 bullet and a sec-8 row as the human mirror.
"""

