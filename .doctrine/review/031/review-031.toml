raiser    = "raiser"
responder = "responder"
rounds_base = 0
contests_base = 0
concluded = true

[[review.turn]]
act = "conclude"
role = "raiser"
note = """
Conformance audit of SL-011 at 6c2f699 (primary tree), against design.md (locked 0c2c9f2), plan.toml criteria and DEC-099..107. Examined:
- `slice conformance` (every undeclared and undelivered path) and `slice verify-vt` (19/19 pass).
- `just check` (4198 green). The plan's VA greps, re-run.
- The PHASE-04 test-count dip, from the 01ef085 diff.
- The four autonomy-log "flag for audit" shapes, in code.
- The three post-run pi prompt commits: accuracy against pi-bridge/command.ts; fit with DEC-040, DEC-072, DEC-098, CHR-008 and IMP-030.
- README and internals, for current-behaviour drift.
- The VH-1 waiver and the VT coverage behind it.
"""

[target]                   # the outbound `reviews` edge: RV-NNN ──reviews──▶ <ref>
ref   = "SL-011"

[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "Design prose names shapes the code did not take (same behaviour): sec-3, sec-4, sec-6, sec-9"
detail = """
Expected: design.md describes the mechanism as built.
Observed (each the same behaviour, per notes § Autonomy log and code read):
- sec-4 Target: `attachedTarget(host)` → the code has `pairTarget(host, frame)` (project-length check + id choice, all before the commit) and `openPairOn(host, id, frame, token)` (the one commit). src/bridge/listener.ts:242-291.
- sec-4 Attached set: "passes `() => daemon.attached()`" → `socket.attached()` (src/daemon-start.ts:393); plan PHASE-01 EX-3 already corrected this (daemon is `Daemon | undefined` there).
- sec-3: `liveToolset` is `RETIRED[t] ?? t` with a RETIRED table → `t === "bridge" ? "interactive" : t`, no table (src/topics.ts:173-175). A Partial<Record> lookup cannot narrow without a cast (RV-029 F-1 bans casts).
- sec-6: silent on a `satan.bridge` entry with no readable `data.kind` → the code skips it like a note (src/threads/admission.ts:77-80).
- sec-9 table: section and fork cases listed under test/bridge-extension.test.ts → they live in test/daemon-sections.test.ts (plan PHASE-05 VT-1/VT-2 name that file).
Not a finding: pi's pairing phase / pair event spread `PairRequest` flat (`{name:"pairing"} & PairRequest`). Design sec-7 names no nesting; plan PHASE-07 EX-2 says "the pairing phase's content". Aligned.
"""
disposition = "design-wrong"
response = """
The code's shapes are sound and keep the behaviour (pairTarget/openPairOn split pre-commit checks from the commit; the ternary avoids a cast RV-029 F-1 bans; skipping an unreadable bridge entry is fail-safe, since only a turn is known to be an input). The design text is wrong. Reconciliation Brief § Per-slice: design.md sec-3, sec-4 (Target, Attached set), sec-6, sec-9.
"""

