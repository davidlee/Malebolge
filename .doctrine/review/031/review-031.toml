"""
disposition = "tolerated"
response = """
The other session's commits interleave with PHASE-08's range on `main`. A start..end range can't exclude interleaved commits, and an explicit end oid would still span them, since 6e65b2d..a90abec lie between f144e26 and 6eaa43e. Every swept path is under trees the handover names as SL-012's. The slice's own undeclared paths (posture.ts, wake/tools.ts) are separately dispositioned (F-2, F-3). Accepted as registry noise. Rationale: concurrent sessions on one branch, no exclusion verb.
"""

