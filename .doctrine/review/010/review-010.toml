[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Expected an unwritten topic named `constructor` refused like any other; observed it passes the existence check, creates an orphaned conversation, and can never be written"
detail = """
`topicNameOf` (src/protocol.ts:138) accepts `constructor`, the one lowercase own-key of Object.prototype. Lookups read inherited keys:
- src/conversations.ts:127 `index.topics[name] === undefined` → `Object`, so the DEC-016 existence check passes
- src/conversations.ts:139 `index.topics[target.name]?.cwd`
- src/topics.ts:143 `index.topics[name] ?? {}` → spreads a function into the record

Reproduced (scratchpad proto.mts, real memory harness, fresh store):
- `list {topic:constructor}` → `{"ids":[],"truncated":false}` (expected `no topic constructor`)
- `attach {topic:constructor}` → creates conversation 8; index `conversations.8 = {topic:"constructor"}`, `topics` stays `{}` — a topic created implicitly (DEC-016 breach) and never listed by `--topics`
- `topic {name:constructor}` → pi-durable `Value contains a non-JSON function; expected strict JSON`; the topic can never be made, so conversation 8 is orphaned.

Fix: `Object.hasOwn` at every `index.topics[...]` read (or null-prototype maps); add `constructor` to the name tests.
"""
