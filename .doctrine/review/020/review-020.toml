[[finding]]
id = "F-15"
status = "answered"
severity = "major"
title = "Cached too_large depends on mutable metadata"
detail = "GPT r2: design step 2 calls the line-size bound deterministic because content is immutable, but the read line includes keywords and mailbox_ids (screwtape render.gleam:169), which sync refreshes (normalise.gleam). A 2,700-keyword fixture is 279,368 B; without them, 1,269 B."
disposition = "tolerated"
response = "Accepted, modified (R-13 revised): CLASSIFY_LINE_MAX and the adapter-side too_large are deleted. Each read line is already capped by MAIL_STDOUT_MAX; overrunning screwtape's 16 MiB stdin limit is hypothetical and maps to uncached 'failed' via the 'any other exit' row. too_large then comes only from jev_context, which depends on Jev's input alone, so caching it is sound."

