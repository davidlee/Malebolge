[[finding]]
id = "F-1"
status = "answered"
severity = "major"
title = "Jev's window is spent on stripped bytes; the agent clamp on raw bytes"
detail = "state.gleam:119-131 spends the 16,384 body budget on pii.strip output; mail_read's max_bytes counts raw bytes. pii.strip can lengthen text: worst case the URL rule, 'http://a/ ' (10 B) -> 'http://a/[…] ' (15 B), ratio 1.5 (pii.gleam:79-81). Jev may cover only 10,922 raw bytes, leaving 5,462 raw sender bytes visible to the agent only: the DEC-048 hole. Same for attachment name/type (Jev 128 stripped, agent 128 rendered; Jev covers 85 raw). Subject safe (200 x 1.5 < 512)."
disposition = "design-wrong"
response = """Resolved by DEC-077 (operator, 2026-10-29: "that's the way to go, yes"): screwtape owns Jev's window (raw-byte bounds before stripping, every address list in Jev's state, a seen.bodies field); malebolge clamps to seen and to screwtape's documented raw bounds. Screwtape work: screwtape IMP-006."""

