Expected: ordinary pi use in unpaired state has no bridge side effect; a refill frame is sent only on a usable authenticated binding. Observed: the outside-table rule maps every interactive input directly to refill, explicitly in all states. The unpaired start rows (:362-363) have no socket or credentials, and outage has no working socket. No no-op/refusal/defer rule is supplied for these state/event pairs.

Verified production of the event: local pi packages/coding-agent/src/core/agent-session.ts:2116-2121 runs input handlers for normal input with source defaulting to interactive, before deciding how to start or queue the run. No pairing is required to reach that code. Therefore unpaired + interactive input is the default pi operation, not a hypothetical transport race.

Inferred consequence, not executed: implementing the literal all-states effect tries to send on an absent/closed socket, or requires the shell to invent a silent-drop policy outside step. This finding does not question the accepted refill verb or source:interactive rule; it is the missing state guard introduced by calling that rule all-states.

Smallest fix: state the guard/rows: unpaired interactive input is a no-op; bound interactive input emits refill. For connecting/outage, explicitly choose the existing outage/refusal behavior or remember one pending refill for the same pairing until bound; do not attempt a frame on a nonexistent socket. Likewise route the deliver effect only through a current binding, leaving stale/unpaired socket events inert without ack. These are guards on existing effects, not a new queue or protocol. Add the unpaired-input case to the pure step tests.
