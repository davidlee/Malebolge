Concrete inferred trace, not executed: client A is bound; client B validly resumes the same pairing and supersedes A. A's backoff resume supersedes B; B's identical recovery supersedes A again. Newest-wins becomes an automatic takeover loop, not a stable handoff. This is the explicitly supported resume-from-elsewhere case, not a request for many-pi-per-conversation support. Pi permits opening the same persisted session via SessionManager.open (local coding-agent src/core/session-manager.ts:1766-1785) and switchSession (:196-218 in agent-session-runtime.ts), with no session-ID change that would trip the already-settled owner check.

