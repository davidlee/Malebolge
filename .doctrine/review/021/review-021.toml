[[finding]]
id = "F-4"
status = "verified"
severity = "major"
title = "The withdrawal-notice path has no full-outbox failure policy"
detail = """
Reviewer: codex. Design facet. Sections: "Pairing and the pairing document", "Messages", and "Verification". Authority: DEC-066/067 and loud terminal failure reporting.

Expected: failure reporting has a defined outcome when its own delivery channel is unavailable; it neither silently drops the notice nor defeats the bounded outbox. Observed: design.md:129 names one appendOutbox rule; :174-180 caps unacked outbox entries at 32; :205-213 unconditionally appends a withdrawal/delivered-incomplete note. It specifies handling of a rejected submission wait, but no policy for failure/refusal of the subsequent append, including outbox full or pairing ended. The verification row :416 only covers an outbox with room.

Concrete inferred scenario (not executed): fill the outbox with 32 unacked messages while pi is busy/disconnected, then abort an accepted queued pi turn. Appending its notice must either hit the same cap or bypass it. The first loses the promised terminal report unless there is a fallback; the second makes the stated bound incomplete and can grow with repeated failures. Ending a pairing while a detached wait remains has the analogous unavailable-recipient problem. Neither fallback nor exemption is an accepted residual in these decisions.

Smallest fix: keep the cap and existing messages; explicitly log an undeliverable notice and use the existing best-effort operator notification fallback, with the message ID and reason. src/threads/task.ts:214-240 already follows this terminal-notice pattern, and src/task-support.ts:19-28 supplies notifyBestEffort. Do not add a priority queue, reserved slots, or recursive failure notices. Pin this fallback in the design and test full-outbox and ended-pairing settlement.
"""
