severity = "major"
title = "Terminal unpairing clears request timers without settling in-flight post calls"
detail = """
Reviewer: codex, round 4; facet design. Subject: "The pi side and deployment", terminal row :371 and outside-table post rule :377-385. Authority: DEC-073's explicit failure and the accepted bounded post wait.

Expected: an in-flight bridge_post completes even when its pairing ends or a resume is terminally refused. Its unknown original outcome must not be reinterpreted as a new post to a later pairing. Observed: the terminal row clears credentials and timers and enters unpaired, but has no effect to complete pending post waiters or remove them from the resend set. Outside the table, an in-flight post completes on its reply or deadline, or is resent on the next bound. Terminal cleanup removes the deadline and prevents the expected re-bind.

Concrete inferred trace, not executed: post P is sent; the connection drops before its reply; P is retained for resume. While disconnected, the pairing is ended from the newer valid client. The old client's resume receives pairing ended and takes :371: its timer is cleared, no re-bind will occur, and no post-specific reply will arrive. As written, P's tool promise has no completion event. If pending sends survive to a subsequent fresh pair, the unqualified "next bound" rule also allows P to be resent into a different conversation.

Pi can keep a model tool in flight while processing operator extension commands: ~/.local/src/pi/packages/coding-agent/src/core/agent-session.ts:2085-2106 executes them immediately even during streaming, before the busy-input queue at :2136-2147. Thus intentional end/re-pair must also have this cleanup contract; serialization behind the model turn cannot be assumed.

Smallest fix: add one terminal effect that completes every outstanding send for the outgoing pairing (outcome unknown where it may already have committed), removes it from the resend set, then cancels its timer. Capture the originating conversation on each existing pending-send record; resend only after that same pairing resumes. Apply the same local cleanup to intentional end, terminal refusal and supersession. Do not add receipts or change reply deadlines. Add terminal-refusal-with-pending-post and end/re-pair tests. This is completion on a new terminal transition, not a re-raise of the disposed deadline or unpaired-marker findings.
