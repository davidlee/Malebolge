[[finding]]
id = "F-9"
status = "verified"
severity = "blocker"
title = "The reconciliation row treats agent_end as final settlement while pi can still consume the original queued turn"
detail = """
Reviewer: codex, round 4; facet design. Subject only: "The pi side and deployment", step(state,event) table and its delegated receive effect. Evidence: .doctrine/slice/009/design.md:372; the receive options it calls are at :193-206. Authority: DEC-066/068/069/079.

Expected: downgrade and re-inject a handed turn only after pi has actually settled without persisting that turn. Observed: the row treats agent_settled and agent_end as interchangeable, although the latter is the end of one low-level loop rather than the end of pi's automatic processing.

Verified pi source (paths relative to ~/.local/src/pi/packages/): agent/src/agent-loop.ts:254-264 emits agent_end and returns on an assistant error before reaching its follow-up drain at :310-315. coding-agent/src/core/agent-session.ts:1303-1308 forwards this event to extensions; :1988-1991 then schedules a retry, and :1899-1904 continues the agent afterwards. The original bridge follow-up can therefore still be queued. The true agent_settled event is emitted only afterwards (:1910-1916 and :1078-1085); extensions/types.ts:1032-1036 explicitly distinguishes that final event.

Concrete inferred trace, not executed: a bridge turn is handed to pi.followUp while a model request is running; the request gets a retryable error; agent_end fires with the turn absent from the session but still queued. The table re-injects it as a note. Automatic recovery later consumes the original turn as well, so one seq enters context twice. This is not ASM-004's uncertainty about observing a consumed message: the source proves the original queue has not been drained, and the extra injection itself is the defect.

There is also a missing state on this same row: reconnecting with existing credentials is connecting, but reconciliation is only defined for bound/outage. Pi can settle an aborted run while the independent socket resume is awaiting paired; the single settle event is then missed and the handed turn remains suppressed after re-bind.

Smallest fix: replace the row with true agent_settled only, covering every state retaining the existing pairing and handed set (including connecting(resume)). Do not infer final settlement from agent_end. Preserve DEC-079's no-turn re-injection. Test queued delivery plus retryable model error (one entry), and abort/settle while waiting for resume (one passive entry). No new subsystem or assumption about entry timing is needed.
"""
disposition = "fix-now"
response = "Verified: agent_end fires before retry drains the follow-up queue (agent/src/agent-loop.ts:254-264; agent-session.ts:1899-1916); agent_settled is final and carries aborted (extensions/types.ts:1032-1037). Fixed by removing the mechanism rather than patching it: the extension never hands pi a bridge message while pi runs. It buffers in memory from agent_start (or its own turn injection) to agent_settled, then flushes notes up to the first turn and that turn with triggerTurn !aborted. No handed set, no settle reconciliation, no agent_end use; the buffer is not state-gated, so the connecting(resume) gap goes too. New DEC refining DEC-066/069/079 (mechanism only). Tests: retryable error before settle; abort while resuming."
