[[finding]]
id = "F-1"
status = "verified"
severity = "blocker"
title = "Clearing pi's queue permanently suppresses an unacked bridge delivery"
detail = """
Reviewer: codex. Design facet. Sections: "Messages" and "Verification". Authority: DEC-066/068, durable outbox delivery and context deduplication.

Expected: an unpersisted delivery remains recoverable from the daemon outbox, including after a normal pi operation clears its pending queue. Observed: design.md:188-194 skips a seq once it was "handed to pi by this process"; design.md:182-186 only pushes an entry once per connection. No path removes handed-but-never-persisted IDs or requests their redelivery after pi discards a queue.

Verified source: ~/.local/src/pi/packages/coding-agent/src/core/agent-session.ts:2372-2376 queues a busy turn through agent.followUp; :2466-2473 clearQueue calls agent.clearAllQueues. packages/agent/src/agent.ts:322-330 clears the custom follow-up queue too. packages/coding-agent/src/modes/interactive/interactive-mode.ts:4700-4712 and :4734-4750 invoke that clearing in the normal restore/abort path; :1978-1979 wires it as the extension abort handler. Only user-text arrays are returned to the editor, so the bridge custom message is not restored there.

Concrete inferred scenario (not executed): receive seq 7 while pi is busy; mark it handed, with no session entry or ack yet; clear/abort the queue; pi remains alive. Seq 7 never persists. The daemon retains it but does not send it again on this connection; even a reconnect in this process skips it because it was handed previously. It is stranded until a process restart. This is distinct from ASM-004's observation timing for messages that are actually consumed: here the queued message is discarded.

Smallest fix: define the handed set as pending delivery state, not a lifetime receipt. Reconcile it when pi discards queued work and re-arm unpersisted deliveries through the existing resume/redelivery path. If the API cannot reliably distinguish queue loss, fail loudly and suspend delivery with the affected seqs left unacked and an explicit recovery instruction; do not silently keep suppressing them. Use the existing agent_settled/abort lifecycle rather than a new receive tool or store. Add a real-pi PHASE-01 probe and a regression: busy delivery, clear queue, reconnect without restarting, verify persistence exactly once or explicit refusal.
"""
disposition = "fix-now"
response = "Contest accepted. A running flag set on agent_start leaves a window where pi is already busy (an externally started run before agent_start) and a delivery could still enter a queue that abort clears. Fix (Messages; The pi side and deployment): the shell checks ctx.isIdle() (pi extensions/types.ts:348) at each deliver. It injects only when isIdle() is true and the reducer is not running; otherwise it buffers until agent_settled. The running flag stays for the extension's own turn injection, which isIdle may not yet reflect. Behaviour is still DEC-079's via DEC-090. Verification: a delivery arriving between input submit and agent_start is buffered, not queued in pi."
route = "probe"

