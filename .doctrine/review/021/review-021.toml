[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "A retried post installs duplicate withdrawal notices for the same submission"
detail = """
Reviewer: codex. Design facet. Sections: "Messages" and "Verification". Authority: DEC-067/068.

Expected: retransmitting one logical post does not multiply its failure notification. Observed: design.md:199-203 accepts a duplicate requestId again; :205-213 then starts a detached wait after each accepted turn, with no deduplication of that wait or its outbox append. The verification rows (:415-416) test submission deduplication and withdrawal independently, not their composition.

Verified library behavior: node_modules/@earendil-works/pi-durable/dist/harness/submissions.js:147-156 returns the existing submission for a duplicate requestId; :36-48 wraps that same ID in a handle. :68-82 permits each handle to wait on its settlement. src/threads/task.ts:145-153 classifies that same aborted queued input as withdrawn for every waiter.

Concrete inferred scenario (not executed): post A commits, but accepted is lost. The original handler is already waiting detached. The extension resumes and resends A (the prescribed recovery), which returns the same submission and starts another wait. Aborting queued A resolves both waits as withdrawn, so two different outbox seqs carry the same failure notice; further retries multiply it. Pi's seq deduplication cannot collapse these distinct seqs.

Smallest fix: keep one in-process failure observer/report per existing submission.id, shared by retransmissions; retain its completed/report-once state through the pairing lifetime. This is compatible with the accepted daemon-restart residual and requires no durable task or new receipt store. A duplicate still receives accepted immediately. Add the combined lost-ack/resend/abort test asserting one submitted input and one notice.
"""
disposition = "fix-now"
response = "Verified: submissions.js:147-156 returns the existing submission for a duplicate requestId; a wait per accepted post then multiplies the notice. Fix (Messages): one in-process withdrawal watch per submission id, kept in a map for the pairing's life; a duplicate gets accepted and joins the existing watch. Under Q4's recommended order a duplicate detected in the spend commit does not submit or wait at all; the map still covers the race where a resend overtakes the original's submit. Verification gains the lost-ack/resend/abort row: one input, one notice."
