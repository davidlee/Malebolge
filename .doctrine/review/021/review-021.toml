[[finding]]
id = "F-3"
status = "verified"
severity = "major"
title = "An open socket that never replies leaves bridge calls waiting without a deadline"
detail = """
Reviewer: codex. Design facet. Sections: "Bridge listener and wire", "The pi side and deployment", and "Verification". Authority: DEC-073/075 and explicit denial over silent stop.

Expected: a connected but non-responsive daemon produces a bounded, explicit failure or unknown outcome. Observed: design.md:330-334 applies BRIDGE_POST_WAIT_MS to recovery when a connection drops. :345-349 describes failed connects and refused resumes. :353-359 defines one-shot exit 3 for a lost reply, but neither path defines a reply deadline while the socket stays open. Pair/resume also have no bind-reply deadline. Verification :421-423 covers disconnects, not this case.

Concrete reproduction specification: use the planned fake daemon, accept a connection and read pair/resume/post/post-once, then send no reply and leave the connection open. The conditions that start the documented disconnect recovery or connect-failure notification never occur. Inference: implemented literally, bridge_post or the shell command can wait indefinitely even for finite stdin, and an extension can sit connected but unbound. This is a design liveness gap; no implemented bridge was run.

Smallest fix: start an end-to-end reply timer when the request is sent, using the existing named wait constant/waiter machinery. A timed-out post must return outcome unknown and must not be blindly retried as a fresh request; post-once exits 3 without retry. A timed-out pair/resume reports the named outage and closes the socket so the existing connection policy can act. Add the fake-daemon test that withholds replies without disconnecting. No heartbeat protocol is needed. This is a different case from the disposed r2 F-9 (unbound calls and reconnect after a drop).
"""
disposition = "fix-now"
response = "Verified: no reply deadline while the socket stays open. Fix (Bridge listener and wire; The pi side and deployment): one reply deadline per request frame (pair, resume, post, post-once) reusing BRIDGE_POST_WAIT_MS. On expiry a post answers outcome unknown and is not retried; post-once exits 3; pair/resume report the outage and close the socket so the existing reconnect policy acts. No heartbeat. Verification gains the fake daemon that withholds replies."
