status = "verified"
severity = "major"
title = "Forked or cloned pi sessions automatically inherit the original session's pairing"
detail = """
Reviewer: codex. Design facet. Sections: "Pairing and the pairing document", "The pi side and deployment", and "Verification". Authority: DEC-065's one pi session per pairing; many pi sessions per conversation is a slice non-goal.

Expected: a new pi session does not accidentally resume or end another session's pairing. Observed: design.md:325-329 restores from only {conversation, token, posture}; there is no originating session identity, and all session_start reasons follow the same restore rule. :132-133 ends whatever pairing is restored before a new pair.

Verified pi source: ~/.local/src/pi/packages/coding-agent/src/core/session-manager.ts:1632-1678 copies the selected branch's custom entries into a newly identified session; :1712-1714 installs that copied history with its new session ID. core/agent-session-runtime.ts:315-327 then starts the new runtime with session_start reason fork. core/session-manager.ts:1815-1855 also supports copying history into a new session/cwd. The readonly API already exposes getSessionId (:245-250).

Concrete inferred scenario (not executed): clone/fork after the pairing entry. The child copies the token and automatically resumes the original conversation, superseding its connection under "Bridge listener and wire". Resuming the original later takes it back; pairing afresh from the child first ends the original's pairing. This requires normal session operations, not a subverted jail stealing a token, and is not the accepted shared-home exposure residual.

Smallest fix: include the existing pi session ID in the local pairing entry and restore only entries whose owner ID equals ctx.sessionManager.getSessionId(). An inherited entry leaves the child unpaired with an explicit explanation; importantly it must not send end for the parent. No server-side session authentication or many-pi support is needed. Add a fork/clone regression alongside restart restoration.
"""
