[[finding]]
id = "F-1"
status = "verified"
severity = "minor"
title = "Design sec-5 says exit 2's code comes from the stderr diagnostics' code; the adapter reads reason, and maps outcomes the table omits"
detail = """
Expected (design sec-5 outcome table): exit 2 → `screwtape usage error: <code>`, `<code>` "from the stderr JSON diagnostics"; the table lists exit 0, 2, other, timeout, aborted.
Observed: screwtape README § CLI (e61d01b) writes `{"level":"error","error":"usage","reason":"<code>"}`, possibly after a warning line. `src/mail/screwtape.ts:136-145` takes `reason` from the first stderr line whose level is error (fix `bac193a`); the smoke confirmed it against the real binary (`unknown_message`). The adapter also maps `spawn_error` to `screwtape could not run` and an unterminated last stdout line to the contract violation `unterminated line`; neither is in the table. The port error `MailSourceError { failure }` (src/mail/source.ts) is not named in sec-5's Port.
Code is right; the design text is incomplete.
"""
disposition = "design-wrong"
response = """
Reconcile design sec-5 (per-slice direct edit; Reconciliation Brief item F-1): the usage code is the `reason` of the first error-level stderr line; add rows for `spawn_error` → `screwtape could not run` and an unterminated stdout line → contract violation; name `MailSourceError { failure }` on the port.
"""

