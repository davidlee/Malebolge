[[finding]]
id = "F-10"
status = "verified"
severity = "nit"
title = "Runner start's installed-name refusal is tested on requireInstalled, not through startRunner"
detail = """
Expected (design VT-3): "a runner registry missing a `job` name refuses start".
Observed: `src/runner/start.ts:143` calls `requireInstalled(toolsetList("job"), …)` over the extensions it builds itself; `test/runner/conversations.test.ts:145` tests `requireInstalled` with a registry missing `job-guard`. startRunner hardcodes its two extensions, so no test can hand it a short registry without a seam (notes, PHASE-02 carry-forward).
"""
disposition = "tolerated"
response = """
Rationale: the start path is a single call over a list it builds in code, so a missing name there is a code change, which `requireInstalled`'s unit test (registry missing `job-guard` refuses) covers. A startRunner seam just to inject a short registry is test-only machinery (YAGNI).
"""

