[[finding]]
id = "F-4"
status = "verified"
severity = "major"
title = "The list client's failure contract was unstated, so 'exits 1 with one message' had no implementation"
detail = "src/attach-main.ts:28-32 exits 1 only for an error carrying a `code` and rethrows everything else. The design named no rejection type, no dispatch from attach-main to the list mode, and no owner for ending the socket against an old daemon that binds root and stays open (src/daemon.ts:176-185)."
disposition = "fix-now"
response = 'Sec-4 now names it: `NotListedError` with `readonly code = "NOT_LISTED"`, mirroring `NotAttachedError` (src/attach.ts:35); `AttachInvocation` becomes a union of a `mode: "attach"` arm and a `mode: "list"` arm, which gives attach-main one dispatch; and the reader owns its socket, ending it on an error frame, a refusal or a skew (`failBeforeAttach` is the precedent, src/attach.ts:271-281) instead of waiting for a close that will not come.'

