severity = "minor"
title = "Sec-6's following case could not distinguish the fix it claimed to test"
detail = "Comint follows a *window* whose point is at the process mark (emacs/malebolge.el:161-163), so an assertion on buffer point at point-max passes with the remedy deleted; and goto-char (point-max) on a freshly erased buffer is a no-op, so the cited lines (:218-222) do not establish the stated cause."
disposition = "fix-now"
response = "Sec-5 and sec-6 restate the remedy per window (every window showing the transcript goes to the end) and the test asserts `window-point` at `point-max` for a window that was scrolled back before the switch, dropping the false causal claim."

