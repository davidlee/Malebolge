[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "`truncated` had no consumer, and the docs duty it licensed could not be supported"
detail = "Sec-6 required `--list` to print ids and no notices, and the picker read ids only, so nothing read the wire key. Worse, ids ascend while the scan descends (pi-durable dist/types.d.ts:867-870), so a full page trims the oldest conversation -- possibly root, the client's default target -- while the docs claimed older conversations stay attachable by id."
disposition = "fix-now"
response = "`truncated` now has two consumers: `--list` writes one truncation line to **stderr** (stdout stays ids-only, and the criterion says so) and the Emacs picker adds a minibuffer message. Sec-2 and sec-6 also say what happens to root when the page fills: a plain `malebolge-attach` always binds it, and `ROOT_CONVERSATION_ID` (pi-durable index.d.ts:29) names it explicitly."

