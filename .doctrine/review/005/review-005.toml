[[finding]]
id = "F-11"
status = "verified"
severity = "major"
title = "A well-formed `list` on a bound connection would have written nothing (RV-006 F-1, re-raised on the run's pass)"
detail = """Sec-2's bound-connection paragraph covered only frame lines that fail to parse as a command. A well-formed `{"type":"list"}` parses cleanly, raises no FrameRefused and reaches `act`'s input/abort/compact switch (src/daemon.ts:120-135), which has no `list` case: the daemon would answer nothing and the connection would stay silently bound."""
disposition = "fix-now"
response = "Sec-2 now names both branches: `laterLine` refuses a well-formed `list` beside a well-formed `attach`, and maps any `FrameRefused` to `alreadyAttached(conversation)`; its lead-in is reworded to lines that are not an actionable command for the bound conversation."

