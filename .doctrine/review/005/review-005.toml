[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "Bound-connection refusal text contradicted DEC-007 and left laterLine unspecified"
detail = "Sec-3 and sec-6 fixed the text as `list: already attached to conversation N`, while DEC-007's Choice says the *existing* (unprefixed) message and `docs/internals.md:112-114` documents it. `alreadyAttached` (src/daemon.ts:51-54) takes no frame, so a prefixed variant has no signature. Sec-2 replaced AttachRefused with FrameRefused but never said what laterLine's `error instanceof AttachRefused ? alreadyAttached(...) : errorMessage(...)` branch (src/daemon.ts:197-219) becomes; a mechanical rename would ship `attach: conversation must be a positive integer` where test/daemon.test.ts:624-629 requires `already attached to conversation 1`."
disposition = "fix-now"
response = "Sec-2 gained a bound-connection paragraph: the rule is about the connection, not the frame. Any frame line that fails to parse as a command -- valid or malformed `attach`, valid or malformed `list` -- answers the *unprefixed* `already attached to conversation N`, the connection stays open and the binding unchanged, so `laterLine` maps any `FrameRefused` to `alreadyAttached(conversation)`. Sec-3 and sec-6 now use the unprefixed message. DEC-007's Choice needed no change; the design was wrong, not the decision."

