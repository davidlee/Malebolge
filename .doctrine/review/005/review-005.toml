[[finding]]
id = "F-5"
status = "verified"
severity = "major"
title = "The Emacs switch order was unspecified, and a failed second attach could strand the user"
detail = "Sec-5 put the detach before the draft refusal without saying the listing, prompt and draft check settle first, so one implementer would refuse with the client intact and another detach then refuse. It also did not say what happens when the second attach fails after a successful detach -- `open` rejects `no conversation N` (src/conversations.ts:44) because an id is a snapshot of the store."
disposition = "fix-now"
response = "Sec-5 fixes the order in one clause -- list, prompt, draft check, detach, attach -- with the draft refusal at step 3, holding the client attached, and says a failed second attach reports the failure and leaves the transcript empty rather than falling back to root."

