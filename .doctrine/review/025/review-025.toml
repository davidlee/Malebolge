[[finding]]
id = "F-9"
status = "verified"
severity = "minor"
title = "Expected Emacs `new` to stay usable against an old daemon; observed it now errors where it used to attach to default"
detail = """`malebolge--new-target` calls `malebolge--topic-names` → `malebolge--client '("--topics")`. Against a daemon predating the topics query the client exits non-zero (restart hint) and `malebolge--client` signals `user-error` quoting it, so `new` refuses where before PHASE-07 it attached a new conversation in default. Design sec-6: the client 'signals a verb-neutral user-error ... so callers check nothing'; DEC-089/DEC-091."""
disposition = "aligned"
response = "This is the design: sec-6 'so callers check nothing' and DEC-089/091. The user-error quotes the client's restart hint, so the operator learns to restart the daemon; SKEWED_KEYS covers the topics key. Old-daemon skew under DEC-007 is answered by the hint, not a silent fallback (consistent with the operator's preference for explicit denial over silent stop)."

