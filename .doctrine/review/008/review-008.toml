[[finding]]
id = "F-5"
status = "verified"
severity = "minor"
title = "The verification matrix can miss root being indexed only by backfill"
detail = """
Expected: D7's 'in the creating commit' guarantee must have a test that fails if fresh root is indexed later by startup backfill.

Observed: .doctrine/slice/003/design.md:357-361 makes openTestHarness go through openSession, including backfill. The creating-commit row at :370 names createConversation, fork, raw creation, task ownership and a throwing hook, but no fresh-root observation before backfill or storage-batch assertion. The root-specific check at :371 deliberately observes a pre-index store after backfill. This does not distinguish correct fresh-root hook coverage from a hook that accidentally skips root.

Verified source context: test/harness-fixture.ts:53-64 calls openSession, whose proposed order in design.md:115-132 is root creation then backfill then return. Exact pi-durable v1.4.0 packages/durable/src/harness/harness.ts:401-431 does support root through the hook, so this finding concerns the promised verification, not a defect in pi's implementation.

Inferred regression/control: change indexConversation to skip the root id. A post-open indexOf sees root repaired by backfill; all creation paths explicitly listed at :370 can still pass, while the first commit violated D7. Similarly, a final snapshot alone cannot identify the storage commit that first contained the entry.

Repair: require a fresh-store test before backfill (or record Storage.commit batches) that shows the root conversation and its index entry in the same durable batch. For the other creation paths, observe the entry from the same transaction/init or assert batch co-membership, and after an injected init failure assert that neither the new conversation nor its staged index entry persisted."""
disposition = "fix-now"
response = """
Agreed: openSession's backfill would repair a hook that skipped root before any test observed it. Sec-7 adds a test that opens a fresh store with Harness.open and the hook only (no backfillIndex), calls root(), and asserts root's entry; and one where an init that throws persists neither the conversation nor its entry. Batch co-membership on Storage.commit is not adopted: the hook runs inside the creating transaction and a throwing hook already fails the commit, so these two tests discriminate the named faults.
"""

[[finding.turn]]
act = "raise"
role = "raiser"

[[finding.turn]]
act = "dispose"
role = "responder"
disposition = "fix-now"
response = """
Agreed: openSession's backfill would repair a hook that skipped root before any test observed it. Sec-7 adds a test that opens a fresh store with Harness.open and the hook only (no backfillIndex), calls root(), and asserts root's entry; and one where an init that throws persists neither the conversation nor its entry. Batch co-membership on Storage.commit is not adopted: the hook runs inside the creating transaction and a throwing hook already fails the commit, so these two tests discriminate the named faults.
"""

[[finding.turn]]
act = "verify"
role = "raiser"
note = "VERIFIED at design-review depth. design.md:398-401 now requires a fresh Harness.open with index hook installed and no backfill, then root() and an entry assertion; :407 also requires a throwing init to persist neither the conversation nor its index entry. A hook that skips root can no longer be repaired before the named test observes it. Rechecked v1.4.0 harness.ts:401-431: hook and init run inside the same creating commit. A Storage.commit recorder is therefore not required to settle this particular design finding; the isolated root check and rollback control discriminate the faults named in the finding. These are authored verification obligations, not tests already run."

[[finding]]
id = "F-6"
status = "verified"
severity = "minor"
title = "The scope and DEC-014 apply lookup refusals to --set-topic --here as well"
detail = """
Expected: the binding scope, amended decision and resolver must agree about --here's two intents: looking up a topic for attach/list, and supplying a directory for --set-topic.

Observed: .doctrine/slice/003/design.md:291 explicitly permits --set-topic NAME --here. resolveHere at :335 returns the git root as that mode's directory before the zero/one/several-match branch (:336-341); a host daemon therefore allows setting a topic even with no matching directory or with several matches. This is useful: it allows creating the first directory-associated topic. But the updated scope .doctrine/slice/003/slice-003.md:94-98 says unqualified --here outside any topic directory or in one shared by several says so 'without creating anything'. Amended DEC-014's choice (.doctrine/knowledge/decision/014/record-014.toml:15; doctrine show DEC-014) also unconditionally says that several matching topics cause refusal, without exempting --set-topic. The design's broad criterion at design.md:416 likewise needs its match-cardinality cases tied to the lookup modes.

Concrete design trace, not an executed SL-003 reproduction: on a host daemon with no topics, run --set-topic work --here in git root /work/project. The resolver passes the host check, sets cwd=/work/project at step 4, and dispatches a topic write. The scope's literal no-match done-when forbids that creation. With alpha and beta already at /work/project, --set-topic gamma --here has the same conflict with the scope and DEC-014's several-match refusal. Verified: these texts and branch order conflict; inference: implementers/test authors following the scope or DEC can incorrectly reject the intended directory-supply mode, or write acceptance tests contradicting the resolver.

Repair: qualify no-match/ambiguity rules in the scope, DEC-014 and verification row as applying to attach/list topic lookup. State explicitly that --set-topic --here only supplies the git root after checking the daemon profile and does not require or disambiguate a matching topic. Add success cases for --set-topic --here with zero and several existing directory matches, while keeping lookup modes' refusals and the room-daemon refusal. If a different policy is intended, reconcile all three owners instead."""
disposition = "fix-now"
response = """
Agreed: the resolver's intent was that set-topic with here only supplies the git root, and the scope and DEC-014 overstated the refusals. Repaired in all three owners: design sec-5 step 4 states no topic need match and others may share the directory, and step 5 names attach and list; sec-7 adds set-topic with here succeeding with zero and several existing matches and refusing against a room daemon; slice-003.md's done-when and DEC-014's choice limit the no-match and several-match refusals to attach and list.
"""

