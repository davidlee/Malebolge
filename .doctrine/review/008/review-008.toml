[[finding]]
id = "F-2"
status = "verified"
severity = "major"
title = "The local profile variable does not establish the overridden socket's daemon profile"
detail = """
Expected: DEC-014's host-only --here rule must apply to the daemon whose topic directories will actually be read or written.

Observed: .doctrine/slice/003/design.md:308-313 treats MALEBOLGE_PROFILE (default room) as the profile even with a socket override. src/config.ts:76-89 selects MALEBOLGE_SOCKET independently of that profile; the existing protocol replies in src/protocol.ts:43-63 do not report daemon profile. Daemon-side socket/profile directory validation at src/config.ts:92-98,148 does not validate a client's environment.

Verified in-memory reproduction using the actual attachSocket function: attachSocket({MALEBOLGE_PROFILE:'host', MALEBOLGE_SOCKET:'/tmp/room/durable.sock'}) returns '/tmp/room/durable.sock'. The reverse mismatch is possible too, including an unset profile and a host socket override.

Inference for the proposed code: MALEBOLGE_PROFILE=host MALEBOLGE_SOCKET=<room daemon socket> malebolge-attach --set-topic work --here passes the proposed guard and writes a host git root as a room topic directory. Conversely, a valid host daemon selected only through MALEBOLGE_SOCKET is refused as room. Reading the variable is internally consistent with attachSocket, but does not enforce the path-space premise that justifies --here.

Repair: specify how the selected endpoint's profile is established (daemon metadata, a validated endpoint/profile contract, or refusal when an override cannot be verified). If the environment is deliberately only a caller assertion, document that limitation explicitly rather than claiming it establishes host execution. Test both mismatch directions and --set-topic --here."""
disposition = "fix-now"
route = "review"
response = """
Verified: attachSocket honours MALEBOLGE_SOCKET independently of MALEBOLGE_PROFILE (src/config.ts:76-89), so the client environment does not establish the reached daemon's profile. Repaired with the daemon as the source: the topics reply now carries profile, the answering daemon's execution profile (sec-4; conversations takes config.execution.profile, sec-6). resolveHere fetches topics first and refuses unless profile is host, so neither mismatch direction passes; MALEBOLGE_PROFILE only picks the default socket. The room refusal now follows a connection, so it exits 1, not 2. Sec-7 tests both mismatch directions and set-topic with here. DEC-014 and DEC-016 amended with the user's assent.
"""

