[[finding]]
id = "F-3"
status = "verified"
severity = "minor"
title = "--here needs an unresolved invocation and a typed, silent topic lookup"
detail = """
Expected: the client design should show how command-line parsing reaches the asynchronous topic lookup and how that internal lookup returns records without printing them.

Observed: .doctrine/slice/003/design.md:261-265 contains only resolved AttachCommand/list topic names and a resolved set-topic cwd. It has no representation of a pending --here. Section 5 (:286-294) generalises the existing listing function into a request that renders the reply to stdout, while :301-304 needs topic data to choose the name before sending another frame. Section 6 (:338-339) specifies neither a resolver boundary nor the request's data-return contract.

Verified current code: src/attach.ts:172-181 synchronously returns the final invocation; src/attach-main.ts:16-30 consumes it synchronously before dispatch. listConversations returns Promise<void> (src/attach.ts:563-577), and the reply handler prints records rather than returning them (:511-524).

Inference: an implementer must invent an extra invocation/state transition and a way to recover structured records. Reusing the proposed request's stdout behavior for --list --here would also print the preliminary topics table before the ids, violating the ids-only listing contract; capturing and parsing rendered TSV would introduce an unstated second protocol.

Repair: define an unresolved --here form and an async resolution step before final dispatch, and have the shared request return a typed reply with rendering performed by the public mode's caller (or specify an equivalent silent structured-data path). Test --here attach/list/set-topic, including that the preliminary lookup produces no stdout."""
disposition = "fix-now"
response = """
Verified: parsing and dispatch are synchronous today (src/attach.ts:172-181, src/attach-main.ts:16-30) and listConversations prints rather than returns. Repaired in sec-5: a Here marker in a parameterised AttachInvocation; attach-main awaits resolveHere and dispatches only a ResolvedInvocation; request resolves to the typed reply and never writes stdout, and each public mode's caller renders. Sec-7 asserts the lookup writes nothing to stdout; sec-6 names Here, resolveHere and the request contract.
"""

