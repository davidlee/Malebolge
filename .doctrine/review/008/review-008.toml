note = "VERIFIED at design-review depth. Read the responder's fix-now response and checked every named owner. design.md:335-343 now explicitly separates directory supply (--set-topic, zero or several existing matches allowed) from topic lookup (attach/--list, exact single match required); :329-334 still applies the daemon-reported host check before either branch. The verification criterion at :418 now requires set-topic success with zero and several matches plus refusal against a room daemon, while keeping lookup-mode no-match/ambiguity refusals and silent preliminary lookup. slice-003.md:94-100 qualifies the no-match/several-match rule as attaching or listing and explicitly permits set-topic directory supply. DEC-014's current choice makes the same mode distinction and preserves the shared profile check. No new supported contradiction or regression found in the repaired passages and immediate siblings. These are reconciled design commitments and authored test obligations, not executed implementation/runtime proof. Only this ledger was changed; no new finding, so the existing concluded marker remains valid."

