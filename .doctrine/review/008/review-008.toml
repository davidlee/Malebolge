[[finding]]
id = "F-4"
status = "verified"
severity = "minor"
title = "snapshot does not return initial() for an absent index document"
detail = """
Expected: the design's dependency contract must distinguish snapshot reads from transactional document acquisition.

Observed: .doctrine/slice/003/design.md:134-136 states that harness.snapshot(IndexDocument, context) reads an absent document as initial(). In the exact v1.4.0 source (git -C ~/.local/src/pi show v1.4.0:packages/durable/src/session/session.ts, lines 305-322), snapshot returns undefined at line 319 when the document is absent. initial() is used by transaction document acquisition, not snapshot. The installed 1.3.0 dist/session/session.js:190-208 has the same absence behavior.

Verified reproduction: opened a Harness over new MemoryStorage, defined a session-scoped document with initial() returning {topics:{},conversations:{}}, and called harness.snapshot before any tx.doc access. The result was undefined. This execution used the installed 1.3.0 distribution; the 1.4.0 conclusion is verified by tagged-source inspection, not a 1.4.0 runtime test.

Impact/inference: readers implemented against the stated contract may dereference undefined, and the proposed indexOf fixture cannot assume snapshot itself manufactures an empty index on a pre-index harness. Normal openSession hook/backfill should ensure a persisted document, so this is not a demonstrated daemon-start failure.

Repair: state the real return type and explicitly choose a topics.ts fallback or an invariant check after startup; keep that policy separate from pi-durable's API behavior. Add an absent-document read assertion for whichever behavior is chosen."""
disposition = "fix-now"
response = """
Verified against pi v1.4.0 packages/durable/src/session/session.ts:305-322: snapshot returns undefined for an absent document. Sec-2 now states this and adds one reader, readIndex in src/topics.ts, which maps undefined to initial(); every listing and the test fixture indexOf read through it. Sec-7 adds a criterion for readIndex over a store whose index was never written.
"""

