[[finding]]
id = "F-1"
status = "verified"
severity = "major"
title = "--here has no rule for multiple topics with the same directory"
detail = """
Expected: --here must resolve a git root to an unambiguous topic before it attaches, creates a conversation, or produces a filtered listing.

Observed: .doctrine/slice/003/design.md:4-5 makes the name unique, while :199-203 permits setting any topic's cwd without directory uniqueness. Section 5 (:301-305) says to take 'the one' whose cwd equals the git root, but specifies only the zero-match failure. The acceptance row at :378 also omits multiple matches.

Reproduction of the permitted state: topic alpha cwd=/work/project; topic beta cwd=/work/project; run --here in /work/project. Both records satisfy the exact-match predicate. The :198 ordering would make alpha the first match, but that ordering is not a choice of the user's intended topic.

Verified: the design allows this state and defines no ambiguity policy. Inference: a first-match implementation silently attaches to the wrong conversation/topic, and --here --new persists the new conversation in that topic. No SL-003 implementation exists to execute.

Repair: explicitly reject multiple matches with the matching names and require --topic, or define another deliberate disambiguation policy. Directory need not become the identity. Add a two-topics/one-cwd test that checks no attach/create frame is sent on ambiguity."""
disposition = "fix-now"
route = "review"
response = """
Verified: topic names are unique and directories are not, and the design defined only the zero-match case. Repaired in design sec-5: resolveHere collects every topic whose cwd equals the git root; several matches refuse with the matching names and the hint to use --topic, exit 1, and no frame follows the listing. Sec-7 adds the several-matches refusal to the --here criterion. DEC-014 amended to say --here never picks among several.
"""

