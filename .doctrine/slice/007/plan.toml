name      = "Live check from a room mail conversation"
objective = "The operator confirms the whole path in the deployed room (design § Verification, VH). Waits on satan IMP-060 (bridge, bind, variable), flakes IMP-055 (unit credential, LimitCORE=0) and a deployed screwtape with seen (screwtape SL-005 closed)."
