objective = "Bound the fan-out: the ThreadsDocument and each post task's tombstone enforcement (DEC-044), admission's tombstone refusal, familiesOf and verdict (K=4 per origin, N=12 daemon-wide), the reap commit (tombstone plus family-reaped notice task, in the admitted call's own commit for reap-other), withdrawal one input at a time, and the reap journal and notify. Tests of concurrency and crash cases are the point of the phase. Order: tombstone and its enforcement first, then pure counting, then the reap."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-05 completed (thread_post exists, sequential, and wired)." },
]
exit_criteria = [
  { id = "EX-1", text = "src/threads/tombstones.ts: ThreadsDocument (session scope, checkpoint policy), isReaped, tombstone() returning false when the mark already existed; nothing outside it names ThreadsDocument." },
  { id = "EX-2", text = "The post task gains step 1 of design § One phase: deliver (letter post only: tombstoned origin withdraws its own input if queued and settles reaped) and the step-5 re-check; notices skip the check." },
  { id = "EX-3", text = "Admission refuses a tombstoned origin: 'origin 12/340 was reaped for fan-out; posts and thread starts from it are refused'." },
  { id = "EX-4", text = "familiesOf and verdict are pure and unit-tested without a harness, using FAMILY_CAP and GLOBAL_CAP; blocked tasks and reaped origins are not counted; notices are cap-exempt." },
  { id = "EX-5", text = "reap-own commits the reap alone and refuses; reap-other puts tombstone and notice in the admitted call's commit; each commit re-reads the tombstone first (table read before any table write) and creates nothing if set; tombstone() true gates the notice." },
