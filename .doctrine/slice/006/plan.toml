# Implementation plan for SL-006 — the authored, durable phase plan.
# Runtime status lives under .doctrine/state/ (phase tracking), never here.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-006"

[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# ---------------------------------------------------------------------------
[[phase]]
id        = "PHASE-01"
name      = "Seams: late binding, neutral sweep, talk sets"
objective = "Land the behaviour-neutral seams the threads module needs, and the one pure policy table: lateBinding replaces wakeBinding, the blocked-task start sweep becomes a per-kind table, and TALK_SETS/requireSameTalkSet exist. No thread tool, no new extension, no change a wake or operator can observe."
entrance_criteria = [
  { id = "EN-1", text = "Design SL-006 locked (run rev 64); full suite, lint and typecheck green on main." },
]
exit_criteria = [
  { id = "EX-1", text = "src/late-binding.ts exports lateBinding<Early, Late>(name); wakeBinding is a use of it; no second copy of the two-step binding remains (DRY)." },
  { id = "EX-2", text = "src/task-sweep.ts exports SweptKind and sweepBlockedTasks; src/wake/sweep.ts shrinks to wake's SweptKind row; daemon-start passes the wake row. Neither src/wake nor the sweep imports threads, and the sweep imports neither." },
  { id = "EX-3", text = "src/toolsets.ts exports TalkSet, TALK_SETS (room: interactive; host: empty) and requireSameTalkSet with the design's two refusal texts naming both toolsets." },
  { id = "EX-4", text = "Existing wake sweep and heartbeat tests pass unchanged in behaviour (moved, not rewritten)." },
]
verification = [
  { id = "VT-1", expects = "TALK_SETS names only toolsets each profile allows; mail is in no set; host is empty", test_file = "test/toolsets.test.ts", keywords = ["TALK_SETS names only toolsets each profile allows"], waived = false },
  { id = "VT-2", expects = "requireSameTalkSet refuses mail, host and mixed sets, naming both toolsets", test_file = "test/toolsets.test.ts", keywords = ["requireSameTalkSet refuses mail, host and mixed sets"], waived = false },
  { id = "VT-3", expects = "the generalised late binding throws when read before both steps and merges early and late once bound", test_file = "test/late-binding.test.ts", keywords = ["lateBinding", "read before"], waived = false },
  { id = "VT-4", expects = "the wake start-sweep cases still pass through sweepBlockedTasks with the wake row", test_file = "test/task-sweep.test.ts", keywords = ["sweepBlockedTasks", "SweptKind"], waived = false },
]
specs        = []
requirements = []

# ---------------------------------------------------------------------------
[[phase]]
id        = "PHASE-02"
name      = "Daemon run policy: a failed run continues (DEC-042)"
objective = "Open the daemon's harness with DAEMON_SETTINGS (afterFailedRun continue, followUpMode one-at-a-time) and rewrite the wake tests that pinned afterFailedRun keep. Isolated from the thread code because it changes wake and operator-input behaviour daemon-wide: a regression here must be attributable to this phase alone."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 completed; suite green." },
  { id = "EN-2", text = "Read test/wake-wait.test.ts behindFailure and VT-1..VT-3: list which cases need an input stuck in the queue, and decide per case between 'placed in the next run' and 'held run instead of a failed one' before editing." },
]
exit_criteria = [
  { id = "EX-1", text = "src/session.ts exports DAEMON_SETTINGS and passes it to Harness.open; the setting key and value types are confirmed against pi-durable's HarnessSettings." },
  { id = "EX-2", text = "behindFailure and VT-1..VT-3 in test/wake-wait.test.ts are rewritten: a queued wake input behind a failed run is placed in the next run; cases needing a stuck input get it from a held run. No case is deleted without a stated reason in notes.md." },
  { id = "EX-3", text = "An operator input queued behind a failed run is answered in the next run (new case: the daemon-wide effect is pinned)." },
  { id = "EX-4", text = "notes.md records the observed blast radius on wake (heartbeat, one-shot, abort handler) and operator input." },
]
verification = [
  { id = "VT-1", expects = "the session opens with DAEMON_SETTINGS (continue, one-at-a-time)", test_file = "test/session.test.ts", keywords = ["DAEMON_SETTINGS", "afterFailedRun"], waived = false },
  { id = "VT-2", expects = "a wake's queued input behind a failed run is placed in the next run, with no further input", test_file = "test/wake-wait.test.ts", keywords = ["behindFailure", "next run"], waived = false },
  { id = "VT-3", expects = "an operator input queued behind a failed run is answered in the next run", test_file = "test/session.test.ts", keywords = ["queued behind a failed run", "operator"], waived = false },
  { id = "VA-1", expects = "the agent reviews the rewritten wake-wait cases for lost coverage: every behaviour the old cases pinned is pinned by a rewritten case or listed as removed with the reason in notes.md" },
]
specs        = []
requirements = []

# ---------------------------------------------------------------------------
[[phase]]
id        = "PHASE-03"
name      = "Index: startedBy, thread predicate, latest skips threads"
objective = "The conversation index learns which conversations are threads (DEC-037): IndexEntry.startedBy, isThread, markOf, latestIn skipping threads, and toolsetInit's optional StartedThread (with the cwd lookup extracted from creationCwd). The fork half of IMP-017 is NOT here; it lands with thread_fork (DEC-033)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 completed; suite green." },
]
exit_criteria = [
  { id = "EX-1", text = "IndexEntry carries optional startedBy; isThread and markOf live beside each other in src/topics.ts; a conversation is a thread exactly when its entry has parent or startedBy." },
  { id = "EX-2", text = "latestIn skips threads; attach by topic, wake_schedule {topic} and the heartbeat re-creation inherit it; idsIn is unchanged." },
  { id = "EX-3", text = "toolsetInit(profile, topic, thread?) writes startedBy and runs thread.require on the toolset chosen inside the commit; the cwd lookup is one function used by creationCwd and the later thread_start." },
  { id = "EX-4", text = "No fork-toolset hook change and no refuseUnsupported change in this phase (DEC-033)." },
]
verification = [
  { id = "VT-1", expects = "latestIn skips forks and started threads; a topic of threads only has no latest", test_file = "test/topics.test.ts", keywords = ["latestIn skips forks and started threads"], waived = false },
  { id = "VT-2", expects = "attach by topic and wake_schedule {topic} land on the operator-created conversation", test_file = "test/conversations.test.ts", keywords = ["attach by topic and wake_schedule"], waived = false },
  { id = "VT-3", expects = "toolsetInit with a StartedThread records startedBy and refuses a toolset outside the talk set inside the commit", test_file = "test/conversations.test.ts", keywords = ["StartedThread", "startedBy"], waived = false },
]
specs        = []
requirements = []

# ---------------------------------------------------------------------------
[[phase]]
id        = "PHASE-04"
name      = "The satan.post task: delivery, notices, tombstone check"
objective = "The durable delivery path, driven by tests through createPostTask before any tool exists: satan.post v1, its unbounded delivery, outcomes, post-failed and family-reaped notices, the abort handler, the sweep row, ThreadsDocument and the tombstone check each post task enforces. First, prove the two queue premises the origin rule and the reap rest on."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 and PHASE-02 completed (SweptKind, lateBinding and DAEMON_SETTINGS exist)." },
]
exit_criteria = [
  { id = "EX-1", text = "FIRST: VT-1 and VT-2 (premises b and c, DEC-036) are written and pass before any other code of the phase. If either fails, STOP and return to the operator: the design names no fallback (a failure undermines the origin rule or makes a reap able to harm a co-resident loop)." },
  { id = "EX-2", text = "src/threads/task.ts: POST_KIND, PostInput, PostState, PostResult, postRequestId, postTask(deps), createPostTask(tx, task, input) owned by input.to in the background; deliver phase per design (tombstone check for letter post, submit followUp, unbounded wait, DEC-045 outcomes); a close rethrows and re-runs." },
  { id = "EX-3", text = "A post that ends withdrawn or delivered-incomplete creates a post-failed notice in the same commit that settles it; notices are terminal (journal and best-effort notify_send, no further notice) and the tombstone check applies to letter post only." },
  { id = "EX-4", text = "The abort handler withdraws the task's queued input and maps abortSubmission's answer (aborted/not_found withdrawn; already_placed delivered-incomplete; settled reads the record)." },
  { id = "EX-5", text = "src/threads/tombstones.ts: ThreadsDocument (session scope, checkpoint policy), isReaped, tombstone; the satan.post SweptKind row is exported for daemon-start." },
  { id = "EX-6", text = "src/threads/extension.ts holds ThreadDeps/EarlyThreadDeps/LateThreadDeps and a threadsExtension registering the task (tools and section follow in later phases); test/thread-fixture.ts exists with a room session, scripted caller turns and readers for post tasks, entries and the tombstone document." },
  { id = "EX-7", text = "src/threads imports neither src/wake nor anything outside the design's coupling rules (WAKE_KIND and EpisodeClass only); a structure test or lint enforces it if the repo already has that mechanism." },
]
verification = [
  { id = "VT-1", expects = "premise (b): two posts queued behind a busy recipient are placed in two runs", test_file = "test/threads-post.test.ts", keywords = ["two posts queued behind a busy recipient are placed in two runs"], waived = false },
  { id = "VT-2", expects = "premise (c): withdrawing one queued post leaves the other queued input in place", test_file = "test/threads-post.test.ts", keywords = ["withdrawing one queued post leaves the other queued input in place"], waived = false },
  { id = "VT-3", expects = "a post starts a turn in the recipient with from, topic and origin; a busy recipient queues it and places it when its turn ends", test_file = "test/threads-post.test.ts", keywords = ["a post starts a turn in the recipient", "a post to a busy recipient is queued"], waived = false },
  { id = "VT-4", expects = "a post behind a failed recipient run is placed with no further input, and across a restart (DEC-042)", test_file = "test/threads-post.test.ts", keywords = ["a post queued behind a failed recipient run is placed"], waived = false },
  { id = "VT-5", expects = "a post behind a faulted run stays queued until the recipient's next input (pins the residual)", test_file = "test/threads-post.test.ts", keywords = ["a post queued behind a faulted run stays queued"], waived = false },
  { id = "VT-6", expects = "outcomes: failure before placement is withdrawn; abort after placement and a run failing after a tool succeeded are delivered-incomplete; each notifies the sender once", test_file = "test/threads-post.test.ts", keywords = ["failure before placement reports withdrawn", "delivered-incomplete"], waived = false },
  { id = "VT-7", expects = "a notice that cannot be delivered journals and notifies, and sends no further notice", test_file = "test/threads-post.test.ts", keywords = ["a notice that cannot be delivered journals and notifies"], waived = false },
  { id = "VT-8", expects = "tombstone enforcement: a post task created before the reap and not yet submitted withdraws itself; one that passed its check before the reap and restarted before submit settles reaped", test_file = "test/threads-tombstone.test.ts", keywords = ["not yet submitted withdraws itself", "re-checks on re-run and settles reaped"], waived = false },
  { id = "VT-9", expects = "the start sweep withdraws a blocked post's queued input and aborts it; a blocked post is not counted", test_file = "test/threads-tombstone.test.ts", keywords = ["the start sweep withdraws a blocked post's queued input", "a blocked post task is not counted"], waived = false },
]
specs        = []
requirements = []

