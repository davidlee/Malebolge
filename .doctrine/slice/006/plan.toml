name      = "Queue premises, then the daemon run policy (DEC-036, DEC-042)"
objective = "First prove the two pi-durable queue premises the origin rule and the reap rest on (DEC-036 (b), (c)); only then open the daemon's harness with DAEMON_SETTINGS (afterFailedRun continue, followUpMode one-at-a-time) and rewrite every test that pinned afterFailedRun keep. The premises gate all post work; DEC-042 follows them, as the design places it, so a failed premise leaves nothing daemon-wide landed."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 completed; suite green." },
  { id = "EN-2", text = "Enumerate every test that pins 'keep': grep test/ for failingOnce, model_error and stopReason \"error\". Positive control: test/wake-wait.test.ts (behindFailure at 113, VT-3a at 313) and test/wake-heartbeat.test.ts (behindFailure at 274, used at 395, 552, 582, 602, 629, 659, 681) must appear. For each case, decide between 'placed in the next run' and 'stuck behind a held run instead of a failed one' before editing; record the list in the phase sheet." },
]
exit_criteria = [
  { id = "EX-1", text = "FIRST: VT-1 and VT-2 (premises (b) and (c), design § Verification) are written and pass before any other change of the phase. They drive raw Conversation.submit (whenBusy followUp, post-shaped request ids) and harness.abortSubmission on the wake fixture's openSession harness; no satan.post code exists yet. If either fails, STOP and return to the operator: the design names no fallback, and DAEMON_SETTINGS has not landed." },
  { id = "EX-2", text = "src/session.ts exports DAEMON_SETTINGS (typed HarnessSettings from pi-durable) and openSession passes it to Harness.open." },
  { id = "EX-3", text = "Every case EN-2 listed is rewritten: a queued wake input behind a failed run is placed in the next run; a case that needs an input stuck in the queue gets it from a held run. Both behindFailure recipes (test/wake-wait.test.ts, test/wake-heartbeat.test.ts) are replaced. No case is deleted without a stated reason in notes.md." },
  { id = "EX-4", text = "An operator input queued behind a failed run is answered in the next run (new case: the daemon-wide effect is pinned)." },
  { id = "EX-5", text = "notes.md records the observed blast radius on wake (heartbeat, one-shot, abort handler, start sweep) and operator input." },
]
verification = [
  { id = "VT-1", expects = "premise (b): two follow-ups queued behind a busy recipient are placed in two runs", test_file = "test/queue-premises.test.ts", keywords = ["two posts queued behind a busy recipient are placed in two runs"], waived = false },
  { id = "VT-2", expects = "premise (c): withdrawing one queued follow-up leaves the other queued", test_file = "test/queue-premises.test.ts", keywords = ["withdrawing one queued post leaves the other queued input in place"], waived = false },
  { id = "VT-3", expects = "a wake's queued input behind a failed run is placed in the next run, with no further input", test_file = "test/wake-wait.test.ts", keywords = ["placed in the next run", "no further input"], waived = false },
  { id = "VT-4", expects = "the heartbeat's parked and too-old cases get their stuck input from a held run", test_file = "test/wake-heartbeat.test.ts", keywords = ["behindHeldRun"], waived = false },
  { id = "VT-5", expects = "an operator input queued behind a failed run is answered in the next run", test_file = "test/session.test.ts", keywords = ["an operator input queued behind a failed run is answered in the next run"], waived = false },
  { id = "VA-1", expects = "the agent reviews the rewritten wake cases for lost coverage: every behaviour the old cases pinned is pinned by a rewritten case or listed as removed with the reason in notes.md" },
]
