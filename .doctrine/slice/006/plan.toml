[[phase]]
id        = "PHASE-07"
name      = "thread_start and thread_fork, with IMP-017's fork branch"
objective = "Start and fork in one phase (DEC-033), both through the admission PHASE-05 and PHASE-06 built: thread_start through toolsetInit(startedBy); thread_fork forking at the latest entry with the sole-call check and the child's written ToolResultEntry; the index hook copies the fork's toolset and the startup refusal narrows to a fork without one. First, probe the fork-result premise; its outcome selects the written result or the design's fallback."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-06 completed." },
]
exit_criteria = [
  { id = "EX-1", text = "FIRST: probe premise (a), DEC-031: a tool appends a ToolResultEntry for its own call id to a fork child, and the child's context shows it in place of pi-durable's synthetic 'Tool result unavailable'. Record the outcome on DEC-031 and in notes.md. It selects the path for EX-3: pass, the written result; fail, the design's fallback (the first post carries fork_of and a note, design § Envelopes the model reads; the synthetic result stays). Either way continue; the sole-call refusal stays. The probe test is kept only on the pass path; on the fail path it becomes the fallback's test (VT-1)." },
  { id = "EX-2", text = "thread_start: unknown topic refused ('unknown topic: x'); the topic's toolset and cwd, else the defaults; creates, configures, indexes with startedBy, and creates the first post in one commit; returns {conversation, topic}. Admission (talk set, tombstone, caps) is the shared one." },
  { id = "EX-3", text = "thread_fork: callers [model], sequential, replay unsafe; refuses ('thread_fork must be the only tool call in its message') unless the caller's newest entry is a pi.assistant with exactly one toolCall with api.callId; forks at that entry, creates the first post and, on EX-1's pass path, writes the child's ToolResultEntry (on its fail path the first post carries fork_of and the note instead), all in one commit with reads before writes." },
  { id = "EX-4", text = "indexConversation copies the parent entry's toolset to a fork and throws without one; refuseUnsupported refuses a fork whose index entry has no toolset (text per design) and every task-owned conversation." },
  { id = "EX-5", text = "The DEC-024 guard (test/conversations.test.ts 'VT-1 records each create's toolset and resolves it again after a reopen') gains thread_start and thread_fork; PHASE-05's baseline-delta case gains both tools." },
  { id = "EX-6", text = "Journal lines 'thread start N (topic) by C origin K' and 'thread fork N of C (topic) origin K'." },
]
