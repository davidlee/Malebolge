# ---------------------------------------------------------------------------
[[phase]]
id        = "PHASE-01"
name      = "Seams: late binding, neutral sweep, talk sets, module boundaries"
objective = "Land the behaviour-neutral seams the threads module needs, and the one pure policy table: lateBinding replaces wakeBinding, the blocked-task start sweep becomes a per-kind table with wake as its one row, TALK_SETS/requireSameTalkSet exist, and the structure test states the threads/wake/sweep boundaries. No thread tool, no new extension, no change a wake or operator can observe."
entrance_criteria = [
  { id = "EN-1", text = "Design SL-006 locked (run rev 64); full suite, lint and typecheck green on main." },
]
exit_criteria = [
  { id = "EX-1", text = "src/late-binding.ts exports lateBinding<Early, Late>(name); wakeBinding is a use of it; no second copy of the two-step binding remains." },
  { id = "EX-2", text = "src/task-sweep.ts exports SweptKind and sweepBlockedTasks (design § Components and boundaries). src/wake/sweep.ts shrinks to a factory for wake's row, closing over WakeDeps and the IndexReader its report needs; sweepBlockedWakes is gone. Its 8 call sites (test/wake-heartbeat.test.ts 108, 436, 609, 636, 687, 725, 784; src/daemon-start.ts 90) call sweepBlockedTasks with the wake row. Every journal assertion stays unchanged: 'wake N blocked (reason); aborting' and 'wake N withdrew N queued input(s)' are byte-identical. If the row needs a journal noun the design's SweptKind lacks, add one field and record it in notes.md as a design-drift item." },
  { id = "EX-3", text = "src/toolsets.ts exports TalkSet, TALK_SETS (room: interactive; host: empty) and requireSameTalkSet. Refusal texts, verbatim from design § Talk sets and the catalog: caller in no set 'toolset mail has no talk set on profile room'; target outside 'conversation 13 (toolset mail) is outside this conversation's talk set (interactive)'; for a start 'topic inbox (toolset mail) is outside this conversation's talk set (interactive)'. requireSameTalkSet takes the target's label (conversation or topic) to produce them; the design's signature has none, so record that in notes.md as a design-drift item." },
  { id = "EX-4", text = "test/structure.test.ts gains the design's coupling rules as allowlist rules with checker cases: src/wake/ and src/task-sweep.ts import nothing in src/threads/; src/task-sweep.ts imports nothing in src/wake/; src/threads/ imports from src/wake/ only wake/task.ts (WAKE_KIND, EpisodeClass); outside src/threads/ only daemon-extensions.ts, daemon-start.ts and render.ts import it." },
]
verification = [
  { id = "VT-1", expects = "TALK_SETS names only toolsets each profile allows; mail is in no set; host is empty", test_file = "test/toolsets.test.ts", keywords = ["TALK_SETS names only toolsets each profile allows"], waived = false },
  { id = "VT-2", expects = "requireSameTalkSet refuses mail, host and mixed sets with the verbatim texts", test_file = "test/toolsets.test.ts", keywords = ["requireSameTalkSet refuses mail, host and mixed sets", "has no talk set on profile room"], waived = false },
  { id = "VT-3", expects = "lateBinding throws when read before both steps and merges early and late once bound", test_file = "test/late-binding.test.ts", keywords = ["lateBinding", "read before both binding steps"], waived = false },
  { id = "VT-4", expects = "sweepBlockedTasks withdraws, reports and aborts only the listed kinds' blocked tasks", test_file = "test/task-sweep.test.ts", keywords = ["sweepBlockedTasks touches only the listed kinds"], waived = false },
  { id = "VT-5", expects = "the wake start-sweep cases pass through sweepBlockedTasks with the wake row, journal assertions unchanged", test_file = "test/wake-heartbeat.test.ts", keywords = ["sweepBlockedTasks", "wakeSweptKind"], waived = false },
  { id = "VT-6", expects = "the structure checker rejects a wake module importing threads and a threads module importing wake beyond wake/task.ts", test_file = "test/structure.test.ts", keywords = ["rejects a wake module importing threads", "rejects threads importing wake beyond its constants"], waived = false },
]
specs        = []
requirements = []

