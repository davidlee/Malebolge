name      = "Index: startedBy, thread predicate, latest skips threads"
objective = "The conversation index learns which conversations are threads (DEC-037): IndexEntry.startedBy, isThread, latestIn skipping threads, and toolsetInit's optional StartedThread (with the cwd lookup extracted from creationCwd). Behaviour-neutral in production, since no store yet holds a thread. The fork half of IMP-017 is NOT here; it lands with thread_fork (DEC-033)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 completed; suite green." },
]
exit_criteria = [
  { id = "EX-1", text = "IndexEntry carries optional startedBy; isThread lives in src/topics.ts (markOf joins it in PHASE-08, with ThreadMark, its return type); a conversation is a thread exactly when its entry has parent or startedBy." },
  { id = "EX-2", text = "latestIn skips threads; attach by topic, wake_schedule {topic} and the heartbeat re-creation inherit it; idsIn is unchanged." },
  { id = "EX-3", text = "toolsetInit(profile, topic, thread?) writes startedBy and runs thread.require on the toolset chosen inside the commit; the cwd lookup is one function used by creationCwd and, later, thread_start." },
  { id = "EX-4", text = "No fork-toolset hook change and no refuseUnsupported change in this phase (DEC-033)." },
]
verification = [
  { id = "VT-1", expects = "latestIn skips forks and started threads; a topic of threads only has no latest", test_file = "test/topics.test.ts", keywords = ["latestIn skips forks and started threads"], waived = false },
  { id = "VT-2", expects = "attach by topic lands on the operator-created conversation, not a thread", test_file = "test/conversations.test.ts", keywords = ["attach by topic lands on the operator-created conversation"], waived = false },
  { id = "VT-3", expects = "wake_schedule {topic} lands on the operator-created conversation, not a thread", test_file = "test/wake-tools.test.ts", keywords = ["wake_schedule {topic} lands on the operator-created conversation"], waived = false },
  { id = "VT-4", expects = "toolsetInit with a started thread records startedBy and refuses a toolset outside the talk set inside the commit", test_file = "test/conversations.test.ts", keywords = ["toolsetInit with a started thread records startedBy"], waived = false },
]
specs        = []
requirements = []

