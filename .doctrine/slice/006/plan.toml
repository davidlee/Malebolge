[[phase]]
id        = "PHASE-06"
name      = "thread_start and thread_fork, with IMP-017's fork branch"
objective = "Start and fork in one phase (DEC-033): thread_start through toolsetInit(startedBy); thread_fork forking at the latest entry with the sole-call check and the child's written ToolResultEntry; the index hook copies the fork's toolset and the startup refusal narrows to a fork without one. First, prove the fork-result premise."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-05 completed." },
]
exit_criteria = [
  { id = "EX-1", text = "FIRST: VT-1 (premise a, DEC-031) passes before the rest of the phase. If it fails, apply the design's fallback (the first post carries fork_of and a note; pi-durable's synthetic result stays), record the choice on DEC-031 and in notes.md, and continue; the sole-call refusal stays." },
  { id = "EX-2", text = "thread_start: unknown topic refused; topic's toolset and cwd else the defaults; creates, configures, indexes with startedBy, and creates the first post in one commit; returns {conversation, topic}." },
  { id = "EX-3", text = "thread_fork: callers [model], sequential, replay unsafe; refuses unless the caller's newest entry is a pi.assistant with exactly one toolCall with api.callId; forks at that entry, writes the child's ToolResultEntry, creates the first post, all in one commit with reads before writes." },
  { id = "EX-4", text = "indexConversation copies the parent entry's toolset to a fork and throws without one; refuseUnsupported refuses a fork whose index entry has no toolset (text per design) and every task-owned conversation, taking the index as an argument." },
  { id = "EX-5", text = "The DEC-024 guard includes thread_start and thread_fork across a restart." },
  { id = "EX-6", text = "Journal lines for start and fork, carrying the origin key." },
]
verification = [
  { id = "VT-1", expects = "premise (a): a fork's child sees the written fork result, not 'Tool result unavailable'", test_file = "test/threads-fork.test.ts", keywords = ["a fork's child sees the written fork result"], waived = false },
  { id = "VT-2", expects = "thread_fork keeps topic and toolset and survives a restart; forks at the latest entry after compaction; a sibling tool call is refused", test_file = "test/threads-fork.test.ts", keywords = ["thread_fork keeps the caller's topic and toolset", "after compaction forks at the latest entry", "thread_fork with a sibling tool call is refused"], waived = false },
  { id = "VT-3", expects = "the hook copies a fork's toolset and fails the commit when the parent has none", test_file = "test/topics.test.ts", keywords = ["the hook copies a fork's toolset from its parent"], waived = false },
  { id = "VT-4", expects = "session refuses a fork without a toolset with the new text; a store holding a fork with a toolset opens", test_file = "test/session.test.ts", keywords = ["a fork without a toolset is not supported"], waived = false },
  { id = "VT-5", expects = "thread_start creates in the named topic with the post as first turn; takes the topic's toolset and cwd else the defaults and records startedBy; refuses an unknown topic and a topic outside the talk set", test_file = "test/threads-tools.test.ts", keywords = ["thread_start creates a conversation in the named topic", "thread_start takes the topic's toolset and cwd", "thread_start refuses an unknown topic"], waived = false },
]
specs        = []
