  { id = "EN-2", text = "Before VT-4: find a faux recipe that ends a recipient run unanswered (faulted), not model_error (pi-durable dist/harness/live.js:133-155; the scheduler faults a run whose invocation throws, scheduler.js:1761). If none exists without patching pi-durable, consult the orchestrator before writing VT-4; never waive it silently." },
]
exit_criteria = [
  { id = "EX-1", text = "src/threads/admission.ts holds Origin and originKey only (pure data, design § The origin); the caller's-origin read and every refusal follow in later phases. task.ts and later tombstones.ts import Origin as a type." },
