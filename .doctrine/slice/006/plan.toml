[[phase]]
id        = "PHASE-05"
name      = "thread_post, origins, and the threads extension in the room"
objective = "The first tool a model can call. thread_post with the shared admission steps (caller read, talk set, tombstone refusal) and the origin read, the threads extension and section installed in the interactive toolset only, the daemon wiring, and journal lines for posts. Caps are not enforced yet: verdict is a stub admitting everything, replaced in PHASE-07."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 and PHASE-04 completed." },
]
exit_criteria = [
  { id = "EX-1", text = "src/threads/admission.ts: Origin, originKey, the caller's-origin read over tx.scanEntries (human, wake, post inheritance, reset rows; no input found refuses), requireSameTalkSet use, tombstone refusal. Pure parts take plain data." },
  { id = "EX-2", text = "thread_post refuses a missing, unindexed, own or out-of-talk-set target; one api.commit creates the post task; declared sequential and replay unsafe (DEC-041, DEC-043); returns {post, to}." },
  { id = "EX-3", text = "'threads' joins the interactive list after 'tasks' and ROOM_ONLY; DaemonParts.threads and the builder exist; daemon-start builds and binds ThreadDeps early and late and passes the wake and post rows to sweepBlockedTasks. Host installs no thread tools." },
  { id = "EX-4", text = "THREADS_SECTION text is a constant in src/threads/extension.ts, pinned by test; tool descriptions state the caps (4 and 12) as constants shared with the later cap code, not retyped." },
  { id = "EX-5", text = "The DEC-024 guard (every create path, across a restart, has exactly its toolset's tools) and toolsets.test.ts catalog and host-filter expectations include 'threads'/thread_post; the first-restart reconcile log line for changed interactive lists is observed in a test." },
  { id = "EX-6", text = "Journal lines 'post N a->b origin K' and 'post N failed ...' emitted through ThreadDeps.log." },
]
verification = [
  { id = "VT-1", expects = "a human input and a wake open origins; a post inherits its post's origin", test_file = "test/threads-admission.test.ts", keywords = ["a human input and a wake open origins"], waived = false },
  { id = "VT-2", expects = "thread_post refuses a missing, unindexed or own target, and mail", test_file = "test/threads-tools.test.ts", keywords = ["thread_post refuses a missing, unindexed or own target"], waived = false },
  { id = "VT-3", expects = "thread tools are not installed on host", test_file = "test/threads-tools.test.ts", keywords = ["thread tools are not installed on host"], waived = false },
  { id = "VT-4", expects = "the threads section text is pinned", test_file = "test/threads-tools.test.ts", keywords = ["the threads section text is pinned"], waived = false },
  { id = "VT-5", expects = "a turn started by family-reaped cannot post (origin inheritance, via a hand-created notice)", test_file = "test/threads-admission.test.ts", keywords = ["a turn started by family-reaped cannot post"], waived = false },
  { id = "VA-1", expects = "the agent confirms no table read follows a table write inside any thread commit (pi-durable read-after-write rule) by reading each tool's commit body" },
]
