# ---------------------------------------------------------------------------
[[phase]]
id        = "PHASE-07"
name      = "Caps, families and reaping"
objective = "Replace the admit-everything stub with the real bound: familiesOf and verdict (K=4 per origin, N=12 daemon-wide), the reap commit (tombstone plus family-reaped notice task, in the admitted call's own commit for reap-other), withdrawal one input at a time, and the reap journal and notify. Tests for concurrency and crash cases are the point of the phase."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-05 and PHASE-06 completed (all three tools exist and sequential)." },
]
exit_criteria = [
  { id = "EX-1", text = "familiesOf and verdict are pure and unit-tested without a harness; FAMILY_CAP and GLOBAL_CAP are constants used by the tool descriptions." },
  { id = "EX-2", text = "reap-own commits the reap alone and refuses; reap-other puts tombstone and notice in the admitted call's commit; the commit re-reads the tombstone first (table read before any table write) and creates nothing if set; tombstone() true gates the notice." },
  { id = "EX-3", text = "Withdrawal uses harness.abortSubmission per queued family input by request id post:<task>, never Conversation.abort; a crash before withdrawal loses nothing (each task withdraws its own)." },
  { id = "EX-4", text = "Reap journal line with the withdrawn count and best-effort notify_send 'SATAN threads reaped'." },
  { id = "EX-5", text = "Thread tools' sequential mode is shown to make one message's calls count each other (DEC-041)." },
]
verification = [
  { id = "VT-1", expects = "one message issuing more thread calls than K admits K and the crossing call reaps the family", test_file = "test/threads-caps.test.ts", keywords = ["one message issuing more thread calls than K admits K"], waived = false },
  { id = "VT-2", expects = "a family over 4 is reaped and its originator told, while a co-resident loop is untouched", test_file = "test/threads-caps.test.ts", keywords = ["a family over 4 is reaped and its originator told"], waived = false },
  { id = "VT-3", expects = "the global cap reaps the largest family, ties to the youngest origin; a second call does not reap it again", test_file = "test/threads-caps.test.ts", keywords = ["the global cap reaps the largest family", "does not reap the same family again"], waived = false },
  { id = "VT-4", expects = "a call whose creating commit throws after a reap-other verdict leaves no tombstone and no notice; a call admitted before another conversation reaps its family is refused in its commit", test_file = "test/threads-caps.test.ts", keywords = ["leaves no tombstone and no notice", "refused in its commit and creates nothing"], waived = false },
  { id = "VT-5", expects = "two conversations of one family reaping at once create one tombstone and one notice; two distinct reaps write two tombstones to the same document", test_file = "test/threads-caps.test.ts", keywords = ["create one tombstone and one notice", "two distinct reaps write two tombstones"], waived = false },
  { id = "VT-6", expects = "crash cases: after the reap commit before any withdrawal no queued family post is delivered after restart; the family-reaped notice is delivered once with no startup scan", test_file = "test/threads-caps.test.ts", keywords = ["delivers no queued family post after restart", "delivers the family-reaped notice once after restart"], waived = false },
  { id = "VT-7", expects = "a post that passed its tombstone check before the reap commit is delivered, and its turn cannot post or start threads", test_file = "test/threads-caps.test.ts", keywords = ["passed its tombstone check before the reap commit is delivered"], waived = false },
]
specs        = []
