  { id = "EX-6", text = "src/threads/extension.ts holds ThreadDeps, EarlyThreadDeps, LateThreadDeps (bound through lateBinding) and threadsExtension registering the task only. test/thread-fixture.ts exists: a room session with the extension installed, scripted caller turns, and readers for post tasks and entries." },
