# Implementation plan for SL-009 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-009"

# Canonical spec/requirement links — cite ids, never restate what they say. The
# plan reader does not model these yet, so nothing downstream consumes them.
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One # ---------------------------------------------------------------------------
[[phase]]
id        = "PHASE-01"
name      = "Real-pi probes: ASM-004..008 and the RV-021 probe routes"
objective = "Settle the premises the pi side rests on before any bridge code is written, against real pi and a real pi jail, with a throwaway stub extension kept out of the shipped tree. Each probe's outcome validates or invalidates its ASM; an invalidated premise stops the slice at /consult (design revision), not a workaround. ASM-006 is daemon-side and becomes a standing premise test."
entrance_criteria = [
  { id = "EN-1", text = "Design SL-009 locked (run dr-01a185c0…, rev 55); RV-021 concluded; `just check` green on main." },
  { id = "EN-2", text = "A real pi build (~/.local/src/pi) and a pi jail from ~/flakes/agents/jailed-agents.nix are runnable by the operator. SL-010 need not have landed: this phase touches no src/ code." },
]
exit_criteria = [
  { id = "EX-1", text = "ASM-004 (narrowed by DEC-090 to the idle paths the extension uses: sendMessage with triggerTurn true and false while ctx.isIdle()): the custom entry and its details are in ctx.sessionManager entries when sendMessage returns, or at the latest by the consuming turn_end. Outcome recorded on ASM-004 (validated or invalidated)." },
  { id = "EX-2", text = "ASM-005: notify-send run inside a pi jail shows a desktop notification, or fails; either outcome recorded on ASM-005. Failure is acceptable (the loud floor is ctx.ui.notify and stderr, DEC-073) and, if the operator wants the bus, becomes a CHR-007 item, not SL-009 work." },
  { id = "EX-3", text = "ASM-007: a stub at the jail home's ~/.pi/agent/extensions/<stub>/index.ts with no node_modules imports typebox and registers a TypeBox-schema tool inside a pi jail. Outcome recorded on ASM-007." },
  { id = "EX-4", text = "ASM-008 and RV-021 F-6 (probe): a createBashTool spawnHook sets a variable and prepends the stub's directory to PATH; a bash call in the jailed pi sees the variable and runs a bare executable from that directory from another cwd; the replaced bash tool keeps the built-in's behaviour. Outcome recorded on ASM-008." },
  { id = "EX-5", text = "RV-021 F-1 (probe): in real pi, ctx.isIdle() is false in the window between a run's start and agent_start (e.g. delayed by a before_agent_start handler); a stub delivery in that window is held by the stub's buffer, not queued in pi; Esc then settle shows aborted=true. Recorded in notes.md § Probes with the pi commit probed." },
  { id = "EX-6", text = "RV-021 F-9 (probe): with a retryable model error (forced by a stub-registered provider that fails once with an error pi classifies as retryable, or failing that by pi's own agent-session tests with the evidence cited), agent_end fires before agent_settled and pi continues; agent_settled fires once, last, with aborted false. Recorded in notes.md § Probes." },
  { id = "EX-7", text = "DEC-090/DEC-079 abort probe (design sec-9 'abort probe'): busy delivery, Esc, settle against real pi with the stub's buffer-and-flush: the message appears once, as a note. Recorded in notes.md § Probes." },
  { id = "EX-8", text = "ASM-006 as a standing premise test: an idle pi-durable conversation given a `write` with model content starts no run, and the next input's run sees the entry. ASM-006 updated from the result." },
  { id = "EX-9", text = "No stub code under src/ or pi-bridge/; the stub lives in the scratchpad or notes and is described in notes.md § Probes well enough to rerun. Any invalidated ASM has stopped the slice at /consult." },
  { id = "EX-10", text = "Command runtime premise (not in ASM-004..008; record a new ASM via /knowledge): the jail's node runs an executable script that imports a .ts module (pi-bridge/wire.ts) with no flags (type stripping, node >= 23.6), as malebolge-bridge will (DEC-075). Invalidated → /consult (e.g. a jiti shim or a built .js), not a workaround." },
]
verification = [
  { id = "VT-1", expects = "ASM-006: a write with model content on an idle conversation starts no run; the next input's run sees it", test_file = "test/queue-premises.test.ts", keywords = ["ASM-006", "write"], waived = false },
  { id = "VA-1", text = "Agent runs the non-jail probes (EX-1, EX-5, EX-6, EX-7) against real pi, records each outcome with the pi commit in notes.md § Probes and on the ASM records via `doctrine knowledge`; RV-021 F-1 and F-9 probe evidence cited there." },
  { id = "VH-1", text = "Operator runs the in-jail probes (EX-2 notify-send, EX-3 typebox stub, EX-4 spawnHook env and PATH; RV-021 F-6; EX-10 node type stripping) in a real pi jail and reports each outcome." },
]
specs        = []
requirements = []

