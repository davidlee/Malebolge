  { id = "EX-2", text = "pair {posture, project}: project validated against the topic rule as <project>-bridge; setTopic({name, toolset: \"bridge\"}) in its own commit if absent (no directory, no model; DEC-093); then topicInit with require = toolset is bridge and no startedBy, writing the pairing document in the creating commit's init. A topic with another toolset is refused and nothing is created. The topic's model, else the daemon default, is the conversation's (DEC-092); a stored model the catalog lacks answers `refused {reason: \"unknown model <ref>\"}` and creates nothing (SL-010 DEC-083). Token: 32 random bytes base64url, sent once, stored as its sha256." },
