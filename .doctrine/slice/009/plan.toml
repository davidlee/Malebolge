name      = "Pairing: the document, its pure rules, the listener's pair / resume / end"
objective = "src/bridge/pairing.ts (PairingDoc and pure rules checkToken, appendOutbox, ackEntry, admitTurn, refill) and src/bridge/listener.ts serving bridge.sock through servePrivateUnix in the room profile, with BRIDGE_FIRST_LINE and BRIDGE_BOUND tables, pair through setTopic then topicInit (DEC-065, DEC-092, DEC-093), resume, end, newest-connection-wins, and refusal of every unnamed frame. Messages flow in PHASE-06/07: BRIDGE_BOUND is a mapped type, so its post, ack and refill rows exist here and refuse until their phase fills them. test/bridge-fixture.ts is born here."
