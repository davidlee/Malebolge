name      = "pi-bridge/ in the gate; the wire module; the socket path rule"
objective = "Bring pi-bridge/ under typecheck, lint, format and coverage, with the structure rule that it imports nothing from src/; author pi-bridge/wire.ts (frame types, pure parser, bridgeSocketPath, capHeadTail, capUtf8 moved from src/truncate.ts and re-exported there) and the daemon's path rule (config bridgeSocket, bridge variant of inProfileDir). Design sec-2, sec-4 'Framing and caps', sec-8; RV-021 F-7."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 completed." },
]
exit_criteria = [
  { id = "EX-1", text = "tsconfig.json includes pi-bridge; vitest coverage includes pi-bridge/**/*.ts; eslint and biome cover pi-bridge/; @earendil-works/pi-coding-agent is a dev dependency only (types and tests; the jail loads pi's own, ASM-007)." },
  { id = "EX-2", text = "test/structure.test.ts rejects a pi-bridge/ module importing from src/, with a negative case; src/bridge/ may import pi-bridge/wire.ts." },
  { id = "EX-3", text = "pi-bridge/wire.ts: frame unions for the three first lines, the four bound client frames and the daemon frames (paired, accepted, refused, deliver) per design sec-2's tables; a pure parser refusing an unknown type, a missing or ill-typed key, and an attach verb, each as `refused {reason}` text; BRIDGE_BODY_MAX_BYTES (32 KiB), a line cap above it, BRIDGE_POST_WAIT_MS." },
  { id = "EX-4", text = "capHeadTail(text, maxBytes) keeps head and tail on character boundaries and inserts `[… <n> bytes cut …]`; capUtf8 lives beside it and src/truncate.ts re-exports it so daemon callers are unchanged." },
  { id = "EX-5", text = "bridgeSocketPath(env): MALEBOLGE_BRIDGE_SOCKET, else $XDG_RUNTIME_DIR/satan/durable/room/bridge/bridge.sock. The room Config carries bridgeSocket from it; the host Config has none; inProfileDir's bridge variant requires grandparent = profile and parent = bridge." },
  { id = "EX-6", text = "`just check` green, coverage including pi-bridge/." },
