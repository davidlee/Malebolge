verification = [
  { id = "VT-1", expects = "parser: each frame round-trips; unknown type, wrong key type and an attach verb are refused with reason text", test_file = "test/pi-bridge-wire.test.ts", keywords = ["parseFrame", "refused", "attach"], waived = false },
  { id = "VT-2", expects = "capHeadTail keeps head and tail, never splits a code point, states the cut", test_file = "test/pi-bridge-wire.test.ts", keywords = ["capHeadTail", "bytes cut"], waived = false },
  { id = "VT-3", expects = "bridge path rule: env override, XDG default, profile/bridge directory check; host config has no bridge socket", test_file = "test/config.test.ts", keywords = ["bridgeSocket", "MALEBOLGE_BRIDGE_SOCKET"], waived = false },
  { id = "VT-4", expects = "structure rule rejects pi-bridge importing src/", test_file = "test/structure.test.ts", keywords = ["pi-bridge/"], waived = false },
