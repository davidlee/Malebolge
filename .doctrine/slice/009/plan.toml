[[phase]]
id        = "PHASE-02"
name      = "Daemon-side extractions on SL-010's seam: servePrivateUnix, connection-reply, endingOf, topicInit hook split"
objective = "Behaviour-preserving moves the bridge reuses (design sec-1 reuse list, sec-8): servePrivateUnix beside serveUnix with runner control using it; answer/write/finish/fail to src/connection-reply.ts with answer generic over its reply; endingOf to src/submission-ending.ts; topicInit's thread? parameter split into optional require and startedBy; the src/conversations.ts header comment narrowed per DEC-093. No bridge behaviour."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 completed with every ASM validated (or the design revised through /consult)." },
  { id = "EN-2", text = "SL-010 implemented and on main: topicInit, ModelCatalog, ModelsMessage and Connection.modelRefs exist in src/ (its DEC-083..089). Re-grep each before starting; if any is renamed, reconcile design sec-3/sec-8 first." },
]
exit_criteria = [
  { id = "EX-1", text = "src/unix-socket.ts exports servePrivateUnix: creates the socket's directory 0700, refuses a directory with another owner or a wider mode, serves through serveUnix, chmods the socket 0600. src/runner/control.ts uses it; its tests pass unchanged." },
  { id = "EX-2", text = "src/connection-reply.ts holds answer (generic over its reply type; the daemon's union includes SL-010's ModelsMessage), write, finish, fail, moved from src/daemon.ts. Connection and Connection.modelRefs stay in src/daemon.ts. Daemon tests pass unchanged." },
  { id = "EX-3", text = "src/submission-ending.ts exports endingOf; src/threads/task.ts imports it; thread tests pass unchanged." },
  { id = "EX-4", text = "topicInit's last parameter becomes an optional {require?, startedBy?}; thread_start passes both; behaviour unchanged. The src/conversations.ts header says no attach frame creates a topic implicitly (DEC-016), citing DEC-093 for pair." },
  { id = "EX-5", text = "`just check` green." },
]
verification = [
  { id = "VT-1", expects = "servePrivateUnix refuses a directory owned by another uid or with group/other bits, and leaves the socket 0600", test_file = "test/unix-socket.test.ts", keywords = ["servePrivateUnix", "0o700", "0o600"], waived = false },
  { id = "VT-2", expects = "topicInit with only require refuses a mismatched toolset inside the creating commit and creates nothing; with neither, creates as before", test_file = "test/conversations.test.ts", keywords = ["topicInit", "require"], waived = false },
  { id = "VA-1", text = "`git diff` of test/daemon.test.ts, test/threads-*.test.ts and test/runner/ shows only import-path changes (EX-2, EX-3)." },
]
