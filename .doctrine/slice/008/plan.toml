[[phase]]
id        = "PHASE-04"
name      = "Backup source: the port, file choice, caps and errors"
objective = "The I/O half: BookmarkSource, Snapshot, BookmarkSourceError, backupSource(dir) (choose the newest backup by name date, stat and capped read, decode, parse, validate, project), unconfiguredSource(), and the recording fakeBookmarkSource for tests (design sec-2). Stateless per call (DEC-027)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-03 completed; suite green." },
]
exit_criteria = [
  { id = "EX-1", text = "File choice: names matching ^bookmarks-(\\d{4}-\\d{2}-\\d{2})_\\d+_[A-Za-z0-9_=+-]+\\.jsonlz4$ with a real calendar date; greatest date, ties by lexically greatest name; none → no_backup. Snapshot.date is the chosen name's date." },
  { id = "EX-2", text = "Caps: stat over BACKUP_FILE_MAX_BYTES (16 MiB) → too_large; then one open reading at most BACKUP_FILE_MAX_BYTES + 1 bytes, the extra byte → too_large; declared size over BACKUP_JSON_MAX_BYTES (64 MiB) → too_large." },
  { id = "EX-3", text = "BookmarkSourceError.reason is closed: not_configured | no_backup | too_large | unreadable | corrupt | invalid. Messages are built from fixed text and the file name's date only, never file content; a missing or unreadable directory → unreadable, naming the directory." },
  { id = "EX-4", text = "unconfiguredSource().read() rejects not_configured. fakeBookmarkSource(snapshot | error) in test/bookmarks/bookmark-fixtures.ts records its calls." },
  { id = "EX-5", text = "`just check` green." },
]
verification = [
  { id = "VT-1", expects = "newest by name date; non-matching files and a name dated 9999-99-99 ignored; empty dir → no_backup; missing dir → unreadable", test_file = "test/bookmarks/backup.test.ts", keywords = ["backupSource", "no_backup", "9999-99-99", "unreadable"], waived = false },
  { id = "VT-2", expects = "oversize file → too_large; a file that grows past the cap after stat → too_large; corrupt bytes → corrupt; schema miss including an oversized guid → invalid (RV-019 F-12, first half)", test_file = "test/bookmarks/backup.test.ts", keywords = ["too_large", "grows", "corrupt", "invalid", "guid"], waived = false },
  { id = "VT-3", expects = "no error message carries file content (a distinctive marker in the fixture never appears in any message)", test_file = "test/bookmarks/backup.test.ts", keywords = ["never", "message"], waived = false },
  { id = "VT-4", expects = "unconfiguredSource rejects not_configured", test_file = "test/bookmarks/backup.test.ts", keywords = ["unconfiguredSource", "not_configured"], waived = false },
  { id = "VA-1", text = "Decode the operator's newest live backup through backupSource in a scratch run (outside the repo); report place and tagged counts against research F5 (≈446 places, ≈306 tagged), the backup date, and any reason other than success, without printing titles, URLs or tags." },
]
specs        = []
requirements = []

