[[phase]]
id        = "PHASE-03"
name      = "Backup schema and projection"
objective = "The pure half of reading a backup: the fail-closed TypeBox schema of the node shapes the projection reads (in src/bookmarks/backup.ts) and the projection tree → Snapshot body (src/bookmarks/project.ts): Bookmark[] with folder path, tags, added date, field caps and `cut`, plus every container in `folders` with its direct count (design sec-2 'Validation', 'Projection')."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 completed; suite green." },
]
exit_criteria = [
  { id = "EX-1", text = "The schema accepts container, place and separator shapes with extra fields allowed; place.guid must match ^[A-Za-z0-9_-]{12}$; any other node, or a missing required field, fails validation (→ invalid in PHASE-04). One malformed guid invalidates the whole backup (RV-019 F-21)." },
  { id = "EX-2", text = "project(tree) yields bookmarks and folders per design sec-2: root names Menu/Toolbar/Other/Mobile from `root`; folder paths joined with `/`; tags split on `,`, trimmed, empties dropped; added as UTC YYYY-MM-DD, absent when missing or not a safe integer; separators and `place:` URIs skipped." },
  { id = "EX-3", text = "Field caps TITLE_MAX_BYTES 200, URL_MAX_BYTES 512, TAG_MAX_BYTES 64, TAGS_MAX 20, FOLDER_MAX_BYTES 256, applied with cutRendered(…, \"…\") from src/untrusted-block.ts, each cut naming its field in `cut`." },
  { id = "EX-4", text = "folders lists every container's capped path with its direct bookmark count, zero allowed; equal paths after caps merge with summed counts (RV-019 F-13, F-20)." },
  { id = "EX-5", text = "Fixture builders for trees (containers, places, separators, roots) live in test/bookmarks/bookmark-fixtures.ts; tests build trees through them, not inline JSON." },
  { id = "EX-6", text = "`just check` green." },
]
verification = [
  { id = "VT-1", expects = "folder paths and root names; tags split and trimmed; separators and place: skipped; added dates including missing and unsafe", test_file = "test/bookmarks/project.test.ts", keywords = ["Menu", "Toolbar", "place:", "added"], waived = false },
  { id = "VT-2", expects = "an empty folder and a parent holding only subfolders appear in folders with count 0; two same-titled siblings give one entry with the summed count (RV-019 F-13, F-20)", test_file = "test/bookmarks/project.test.ts", keywords = ["count 0", "same-titled", "folders"], waived = false },
  { id = "VT-3", expects = "each cap cuts its field and names it in cut; the 21st tag is dropped with tags in cut", test_file = "test/bookmarks/project.test.ts", keywords = ["TITLE_MAX_BYTES", "URL_MAX_BYTES", "TAG_MAX_BYTES", "TAGS_MAX", "FOLDER_MAX_BYTES"], waived = false },
  { id = "VT-4", expects = "the schema refuses an unknown node type, a missing uri and a guid that is not 12 characters of [A-Za-z0-9_-]; it accepts extra fields", test_file = "test/bookmarks/project.test.ts", keywords = ["guid", "schema"], waived = false },
]
specs        = []
requirements = []

