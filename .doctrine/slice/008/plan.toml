[[phase]]
id        = "PHASE-05"
name      = "Bookmark rendering: page fill, trusted header, cutCount"
objective = "src/bookmarks/render.ts: the page (fitWhole over matches from offset), the fixed-form trusted header for each tool (items, matched, next_offset, source, stale, clamps, shown N of M, cut by caps), cutCount, and the result through renderBlock(\"bookmark-data\", …) (design sec-4)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-04 completed; suite green." },
]
exit_criteria = [
  { id = "EX-1", text = "Search header lines exactly as design sec-4: `bookmarks_search: N items, K with cuts`, `matched: M` with `next_offset: X` only when matches remain (X = offset + items emitted), `source: bookmark backup YYYY-MM-DD`, `stale: D days` only when the backup is more than 2 days older than the injected now, clamps via clampsLine. Fails closed on any value not in a fixed form; header within HEADER_MAX_BYTES." },
  { id = "EX-2", text = "Tags/folders header: `shown N of M` (N = items emitted), next_offset when more, source/stale, and `cut by caps: N bookmarks` only when cutCount(bookmarks) > 0." },
  { id = "EX-3", text = "A page holds ≥1 item whenever any match remains past offset; an offset at or past the last match gives 0 items and no next_offset." },
  { id = "EX-4", text = "RV-019 F-12 (probe): the item-size bound holds for any field of any length inside a backup that passes the file caps and the schema. Criterion: an oversized-guid fixture through the real backupSource yields invalid, and a fixture with every field at its cap, read through the real backupSource and rendered, gives one item within ITEMS_MAX_BYTES." },
  { id = "EX-5", text = "`just check` green." },
]
verification = [
  { id = "VT-1", expects = "header fixed forms; a non-count or non-date value fails closed; stale only past 2 days; cut by caps only when cutCount > 0", test_file = "test/bookmarks/render.test.ts", keywords = ["stale", "cut by caps", "cutCount", "fails closed"], waived = false },
  { id = "VT-2", expects = "a page stops at budget with ≥1 item and next_offset = offset + items; offset past the end gives 0 items and no next_offset", test_file = "test/bookmarks/render.test.ts", keywords = ["next_offset", "budget"], waived = false },
  { id = "VT-3", expects = "the block escapes <>& and is wrapped in bookmark-data untrusted=\"true\"", test_file = "test/bookmarks/render.test.ts", keywords = ["bookmark-data", "\\u003c"], waived = false },
  { id = "VT-4", expects = "RV-019 F-12: an every-field-at-cap backup read through the real backupSource renders one item within ITEMS_MAX_BYTES; an oversized guid through the real backupSource is invalid", test_file = "test/bookmarks/render.test.ts", keywords = ["RV-019 F-12", "backupSource", "ITEMS_MAX_BYTES", "invalid"], waived = false },
]
