[[phase]]
id        = "PHASE-06"
name      = "The three tools and the bookmarks extension"
objective = "bookmarks_search, bookmarks_tags and bookmarks_folders in src/bookmarks/tools.ts (design sec-3) over BookmarkSource, with bounded limit/offset from src/ranges.ts, input refusals before the source is read, and descriptions carrying usage (DEC-030); bookmarksExtension({source, now}) and BOOKMARKS_SECTION in src/bookmarks/extension.ts."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-05 completed; suite green." },
]
exit_criteria = [
  { id = "EX-1", text = "Each tool: defineTool, replay \"safe\", one text output, isError true for input and source errors (the mail pattern, src/mail/tools.ts). limit 1–200 default 50; offset 0–10000 default 0; out-of-range clamps named in the header; offset 1e21 is clamped, not thrown." },
  { id = "EX-2", text = "Search: every whitespace-split, lowercased query term is a substring of the lowercased title, url, a tag or folder; tag is case-insensitive equality; folder is a case-insensitive prefix at a segment boundary; filters AND; matching on capped fields. Order: added desc, missing last, then guid." },
  { id = "EX-3", text = "Tags: {tag, count} by count desc then tag. Folders: every Snapshot.folders entry, empty ones included, by path asc." },
  { id = "EX-4", text = "Input refusals before the source is read: query over 512 bytes, tag over 64, folder over 256; the refusal text never repeats the value." },
  { id = "EX-5", text = "Descriptions state: results come from a daily backup up to a day behind; run several searches or page the full list for loose recall; use bookmarks_tags / bookmarks_folders to see structure first; matching and counts use capped fields (with the caps); folders counts are direct while the search folder filter includes subfolders." },
  { id = "EX-6", text = "bookmarksExtension({source, now}) registers the three tools and the BOOKMARKS_SECTION text of design sec-4; not_configured surfaces as an error result." },
  { id = "EX-7", text = "`just check` green." },
]
verification = [
  { id = "VT-1", expects = "search AND-terms across fields, tag equality, folder segment-boundary prefix (Menu/dev matches Menu/dev/cli, not Menu/devops), order including missing added", test_file = "test/bookmarks/tools.test.ts", keywords = ["bookmarks_search", "Menu/devops", "missing added"], waived = false },
  { id = "VT-2", expects = "paging and next_offset; clamps in header; offset 1e21 clamped", test_file = "test/bookmarks/tools.test.ts", keywords = ["1e21", "clamped", "next_offset"], waived = false },
  { id = "VT-3", expects = "oversize query/tag/folder refused with no source call recorded", test_file = "test/bookmarks/tools.test.ts", keywords = ["no source call", "calls"], waived = false },
  { id = "VT-4", expects = "tags and folders counts and order; empty folders listed; not_configured is an error result", test_file = "test/bookmarks/tools.test.ts", keywords = ["bookmarks_tags", "bookmarks_folders", "not_configured", "isError"], waived = false },
  { id = "VT-5", expects = "each description carries the staleness, structure-first and cap clauses", test_file = "test/bookmarks/tools.test.ts", keywords = ["description", "up to a day"], waived = false },
