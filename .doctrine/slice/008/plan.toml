# Implementation plan for SL-008 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-008"

# Canonical spec/requirement links — cite ids, never restate what they say. The
# plan reader does not model these yet, so nothing downstream consumes them.
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase, in execution order — the authored array order
# IS the order; never sort by id. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber. Criterion ids
# are local to their phase, bare, and equally immutable.

# ---------------------------------------------------------------------------
[[phase]]
id        = "PHASE-01"
name      = "Shared framing and ranges: src/untrusted-block.ts, src/ranges.ts"
objective = "Move mail's framing primitives into src/untrusted-block.ts and its input-range code into src/ranges.ts (design sec-4; DEC-054), behaviour unchanged, mail re-importing them; add the structure rule that src/bookmarks/ imports nothing from src/mail/. No bookmark code. This phase is the SL-007 overlap: whichever of SL-007 / SL-008 executes second rebases onto it."
entrance_criteria = [
  { id = "EN-1", text = "Design SL-008 locked (run dr-01a18592…, rev 40); RV-019 concluded; `just check` green on main (3351 tests at plan time)." },
  { id = "EN-2", text = "SL-007 has not landed changes to src/mail/render.ts or src/mail/tools.ts since this plan; if it has, rebase the move list onto its version first (DEC-054) and note it in notes.md." },
]
exit_criteria = [
  { id = "EX-1", text = "src/untrusted-block.ts exports RESULT_MAX_BYTES (51200), HEADER_RESERVE, WRAPPER_BYTES, HEADER_MAX_BYTES, ITEMS_MAX_BYTES, dataLine, renderedLength, cutRendered, count, assertWithin, clampsLine, fitWhole and renderBlock, per design sec-4. count throws `header: <what> is not a count`; mail's next-cursor check keeps its own `mail header:` text." },
  { id = "EX-2", text = "fitWhole(values) returns {lines, shown, of}: the longest prefix of whole data lines within ITEMS_MAX_BYTES, stopping at the first that does not fit. fitMailboxes is gone; mail_mailboxes uses fitWhole." },
  { id = "EX-3", text = "renderBlock(tag, header, lines) emits header, `<tag untrusted=\"true\">`, one data line each, `</tag>`, and asserts RESULT_MAX_BYTES. Mail's result wrapper is a use of it (`mail-data`); no second copy of the wrapper or the open/close-tag text remains in src/mail/." },
  { id = "EX-4", text = "src/ranges.ts exports Range, Clamp<N extends string>, bounded and report, generic in N; it imports nothing from src/untrusted-block.ts; src/untrusted-block.ts imports only the Clamp type from it. Mail instantiates N = \"limit\" | \"max_bytes\" | \"offset\". MAIL_MAX_BYTES is gone; its users use RESULT_MAX_BYTES." },
  { id = "EX-5", text = "Mail behaviour unchanged: in test/mail/ only import lines and the renamed identifiers (MAIL_MAX_BYTES → RESULT_MAX_BYTES, fitMailboxes → fitWhole) change; every assertion and expected string is byte-identical. The fitMailboxes cases move to test/untrusted-block.test.ts as fitWhole cases." },
  { id = "EX-6", text = "test/structure.test.ts gains the rule that a src/bookmarks/ module imports nothing in src/mail/, beside seamAllows, with a negative case (design sec-6)." },
  { id = "EX-7", text = "`just check` green." },
]
verification = [
  { id = "VT-1", expects = "fitWhole keeps whole lines in order within ITEMS_MAX_BYTES, stops at the first that does not fit, and reports shown/of", test_file = "test/untrusted-block.test.ts", keywords = ["fitWhole", "ITEMS_MAX_BYTES", "shown"], waived = false },
  { id = "VT-2", expects = "renderBlock wraps lines in the given tag with untrusted=\"true\", escapes <>& in data lines, and fails closed beyond RESULT_MAX_BYTES", test_file = "test/untrusted-block.test.ts", keywords = ["renderBlock", "RESULT_MAX_BYTES", "untrusted"], waived = false },
  { id = "VT-3", expects = "count refuses a negative or non-integer value with `header: <what> is not a count`", test_file = "test/untrusted-block.test.ts", keywords = ["is not a count", "count("], waived = false },
  { id = "VT-4", expects = "bounded: omitted and non-integer take the default, out-of-range clamps and reports once per name, in-range reports nothing", test_file = "test/ranges.test.ts", keywords = ["bounded", "report", "Clamp"], waived = false },
  { id = "VT-5", expects = "the structure checker rejects a bookmarks module importing a mail module", test_file = "test/structure.test.ts", keywords = ["bookmarks/", "rejects a bookmarks module importing a mail module"], waived = false },
  { id = "VA-1", text = "`git diff -- test/mail/` shows only import-line and identifier-rename changes (EX-5); no assertion or expected string changed." },
]
specs        = []
requirements = []

# ---------------------------------------------------------------------------
[[phase]]
id        = "PHASE-02"
name      = "mozlz4 decoder"
objective = "A pure in-repo decoder for Firefox's mozlz4 format, decodeMozLz4 in src/bookmarks/mozlz4.ts (design sec-2 'Decoding'), tested directly against a real fixture, an independent decoder's output, hand-built boundary vectors and every refusal; plus the test-side literal-only encoder later phases build fixtures with."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 completed; suite green." },
]
exit_criteria = [
  { id = "EX-1", text = "decodeMozLz4(buf, maxBytes) returns the decoded Buffer. It refuses bad magic, a literal or match running past the input or past the declared size, a match offset of 0 or beyond the bytes written, and an output length ≠ declared size, as corrupt; a declared size over maxBytes is refused as too_large before any allocation. Its refusal is a decoder-local error carrying one of those two kinds and fixed text only; PHASE-04 maps it to BookmarkSourceError." },
  { id = "EX-2", text = "Fixture test/bookmarks/fixtures/scratchpad.jsonlz4 is the operator's 857-byte scratchpad-profile backup (Mozilla defaults only); beside it, the bytes an independent decoder produced once (e.g. python lz4.block via a nix shell), with test/bookmarks/fixtures/SOURCE.md stating both files' provenance and the one-off command." },
  { id = "EX-3", text = "test/bookmarks/bookmark-fixtures.ts exports a literal-only LZ4 encoder producing mozlz4 bytes; it round-trips through decodeMozLz4." },
  { id = "EX-4", text = "src/bookmarks/mozlz4.ts imports nothing outside node builtins; the decoder is ~30 lines plus its refusals." },
  { id = "EX-5", text = "`just check` green." },
]
verification = [
  { id = "VT-1", expects = "the real scratchpad backup decodes byte-equal to the independent decoder's stored output, and parses as JSON", test_file = "test/bookmarks/mozlz4.test.ts", keywords = ["decodeMozLz4", "scratchpad.jsonlz4"], waived = false },
  { id = "VT-2", expects = "each refusal: bad magic, truncated input, offset 0, offset beyond written, overrun past declared size, size mismatch, truncated length extension → corrupt; declared size over the cap → too_large", test_file = "test/bookmarks/mozlz4.test.ts", keywords = ["corrupt", "too_large", "magic", "offset"], waived = false },
  { id = "VT-3", expects = "an overlapping match (offset 1, length ≥ 4) decodes correctly; exact-output vectors for literal and match length extensions at 15 and 255, including a terminating zero extension byte", test_file = "test/bookmarks/mozlz4.test.ts", keywords = ["overlap", "255", "15"], waived = false },
  { id = "VT-4", expects = "the literal-only encoder's output round-trips through decodeMozLz4", test_file = "test/bookmarks/mozlz4.test.ts", keywords = ["encodeMozLz4", "round-trip"], waived = false },
]
specs        = []
requirements = []

