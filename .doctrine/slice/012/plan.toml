  { id = "VH-1", text = "Operator signs off the plan document and staged summary as tuned." },
  { id = "VA-1", text = "The PHASE-05 and PHASE-06 VT rows still pass after tuning (`doctrine slice verify-vt 12`)." },
]
specs        = []
