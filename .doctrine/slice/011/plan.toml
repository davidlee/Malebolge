id        = "PHASE-05"
name      = "Bridge framing in every room interactive conversation"
objective = "Pin the section rule now that every room interactive conversation has the extension: BRIDGE_UNTRUSTED always, environment and posture once bridged, framing kept on forks; bridge_post says when it works (design sec-5, DEC-102, DEC-107)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-04 completed." },
]
exit_criteria = [
  { id = "EX-1", text = "bridgeSectionText is unchanged. In a room interactive conversation the section is BRIDGE_UNTRUSTED alone when never bridged; all three parts when bridged; all three parts after end." },
  { id = "EX-2", text = "A fork of a bridged conversation taken after a bridge entry carries BRIDGE_UNTRUSTED in its prompt, and its pairing is unpaired (RV-029 F-17)." },
  { id = "EX-3", text = "bridge_post's description gains one clause: it works only once pi has paired with this conversation. It stays registered unconditionally and refuses through appendOutbox as now." },
  { id = "EX-4", text = "`just check` green." },
]
verification = [
  { id = "VT-1", expects = "section: never bridged → BRIDGE_UNTRUSTED alone; bridged → three parts; ended → still three parts", test_file = "test/daemon-sections.test.ts", keywords = ["never bridged", "three parts"], waived = false },
  { id = "VT-2", expects = "fork a bridged conversation after a bridge entry: the fork's prompt carries BRIDGE_UNTRUSTED; its pairing is unpaired (RV-029 F-17)", test_file = "test/daemon-sections.test.ts", keywords = ["BRIDGE_UNTRUSTED", "RV-029 F-17"], waived = false },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-06"
name      = "A bridge-started turn opens its own origin"
objective = "A bridge turn opens a thread origin of kind `bridge`; a bridge note opens none (design sec-6, DEC-105)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-04 completed (bridged conversations are interactive and in the talk set)." },
]
exit_criteria = [
  { id = "EX-1", text = "src/threads/origin.ts: Origin.kind is `human | wake | bridge`; isOrigin accepts `bridge`, so a post entry's serialised origin round-trips." },
  { id = "EX-2", text = "src/threads/admission.ts originOf: a BRIDGE_ENTRY_KIND entry whose data.kind is `turn` opens `{conversation: caller, entry: entry.id, kind: \"bridge\"}`; a note returns undefined, so callerOrigin skips it as today (RV-029 F-4)." },
  { id = "EX-3", text = "`just check` green." },
]
verification = [
  { id = "VT-1", expects = "a thread post from a bridge-started turn carries origin kind `bridge`; a bridge note after an operator input leaves the caller's origin kind `human` (RV-029 F-4)", test_file = "test/threads-admission.test.ts", keywords = ["kind: \"bridge\"", "RV-029 F-4"], waived = false },
]
