# Implementation plan for SL-011 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-011"

# Canonical spec/requirement links — cite ids, never restate what they say. The
# plan reader does not model these yet, so nothing downstream consumes them.
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase, in execution order — the authored array order
# IS the order; never sort by id. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber, so the id
# sequence goes non-monotonic after a split and that is expected. Criterion ids
# are local to their phase, bare, and equally immutable
# (`lib:reference/glossary.md` § reference forms). The prefix is
# the only mode marker; there is no mode field. Reference a criterion from
# another phase phase-qualified (PHASE-03/EX-8) — bare EX-8 is ambiguous.
[[phase]]
id        = "PHASE-01"
name      = "Attached set: Daemon.attached() and BridgeHost.attached"
objective = "The daemon knows which conversations operator clients are attached to, and the bridge host can ask (design sec-4 'Attached set', DEC-104). Additive: nothing consumes it until PHASE-02."
entrance_criteria = [
  { id = "EN-1", text = "Design SL-011 locked (0c2c9f2); `just check` green on main." },
  { id = "EN-2", text = "Re-grep before starting: `serve`, `startConnection`, `Connection.bound` in src/daemon.ts; `bridgeHostOf` in src/daemon-start.ts; `BridgeHost` in src/bridge/listener.ts. A rename means reconciling design sec-4 first." },
]
exit_criteria = [
  { id = "EX-1", text = "src/daemon.ts `serve` keeps the set of live Connections (added in startConnection, removed on socket close). `Daemon` is `UnixServer & { attached(): readonly ConversationId[] }`; attached() returns the distinct bound ids of live, not-ended connections." },
  { id = "EX-2", text = "A listing connection binds nothing and does not count; root counts once bound; an ended or closed connection drops out." },
  { id = "EX-3", text = "`BridgeHost` gains `attached: () => readonly ConversationId[]` (mirroring onOperatorInput). src/daemon-start.ts binds `const socket = await serve(...)`, assigns `daemon = socket`, and passes `() => socket.attached()` into bridgeHostOf (`daemon` is `Daemon | undefined` there and non-null assertions are lint-banned)." },
  { id = "EX-4", text = "`just check` green." },
  { id = "EX-5", text = "test/bridge-fixture.ts's BridgeHost literal gains `attached`, backed by a fixture-owned mutable list, empty by default; PHASE-02 gives it its default target." },
]
verification = [
  { id = "VT-1", expects = "attached(): a listing connection does not count; root counts once bound; two clients on one conversation count once; a closed connection drops out", test_file = "test/daemon.test.ts", keywords = ["attached()"], waived = false },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-02"
name      = "Pair binds an existing interactive conversation"
objective = "pair names its target, or takes the one attached conversation, and binds it; it never creates (design sec-4 'Frame' and 'Target', DEC-099, DEC-104). The SL-009 create path and its host fields go."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 completed." },
]
exit_criteria = [
  { id = "EX-1", text = "pi-bridge/wire.ts: `PairFrame` gains `conversation?: string`; `FIRST_LINE_FRAMES.pair` gains `conversation: optional(text)`." },
  { id = "EX-2", text = "pairRow follows design sec-4 'Target': token minted before any commit; the id from `conversationKeyOf` (refuse `not a conversation id: X`) or from attachedTarget (refuse `no operator client is attached; name a conversation`, or `several conversations are attached (N, M); name one`, ids ascending); in one commit, refuse `no conversation N` or `conversation N has toolset T, not interactive`, else openPairing; then bindAndFollow. A refusal writes nothing. An index entry with no toolset (unreconciled) is refused `no conversation N`, as storedEntry reads it." },
  { id = "EX-3", text = "pair refuses a project over 255 bytes as `project longer than 255 bytes`, before the commit (RV-029 F-12)." },
  { id = "EX-4", text = "createBridged, bridgedInit, requireBridge and the topic creation are deleted. BridgeHost loses conversations, defaults, catalog and profile; bridgeHostOf stops passing them; their unused imports go (RV-029 F-8). src/conversations.ts's header comment says no frame ever creates a topic implicitly (DEC-093 superseded)." },
  { id = "EX-5", text = "bridgeHost()/bridgeWorld() create one interactive conversation at setup, with a reconciled index entry (toolset interactive), and the fixture's attached list defaults to [it]. pair(options?) keeps its zero-arg form, which pairs with no id and so binds that target via the attached set; options `{conversation?, attached?}` serve only the new cases. Existing callers (bridge-listener, bridge-inbound, bridge-pairing, and pi-bridge-shell's direct `/bridge pair delegate` end-to-end cases) keep working unchanged. The create-in-topic block in test/bridge-pairing.test.ts ('pair, through the listener') moves to socket-level cases in test/bridge-listener.test.ts (RV-029 F-6); its project-name-rule case is replaced by the 255-byte case." },
  { id = "EX-6", text = "A fork of an interactive conversation can be paired." },
  { id = "EX-7", text = "`just check` green. Stored `bridge`-toolset conversations are refused as not interactive until PHASE-04 retires the toolset; existing pairings on them still resume." },
]
verification = [
  { id = "VT-1", expects = "pair by id binds an existing interactive conversation and answers paired with a token, creating no topic or conversation; refuses an unknown id, a non-decimal id, a mail conversation and an over-long project, writing nothing", test_file = "test/bridge-listener.test.ts", keywords = ["not a conversation id", "not interactive", "project longer than 255 bytes"], waived = false },
  { id = "VT-2", expects = "pair without id: one attached conversation is bound; none or several are refused, naming the ids", test_file = "test/bridge-listener.test.ts", keywords = ["no operator client is attached", "several conversations are attached"], waived = false },
  { id = "VT-3", expects = "pair binds a fork of an interactive conversation", test_file = "test/bridge-listener.test.ts", keywords = ["fork of an interactive conversation"], waived = false },
  { id = "VA-1", text = "`rg 'createBridged|bridgedInit|requireBridge' src test` is empty; `rg 'topicInit' src/bridge` is empty." },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-03"
name      = "Replacing a pairing: close reason, seq continuity, stale-line refusal"
objective = "A new pair replaces the conversation's pairing cleanly: the old connection is closed `superseded by a new pairing`, the seq continues, and a line of the old connection is refused (design sec-4 'Replacing a pairing', DEC-103, DEC-106)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 completed." },
]
exit_criteria = [
  { id = "EX-1", text = "openPairing resets token, posture, project, ended, outbox and spent, and keeps nextSeq (DEC-106, RV-029 F-15)." },
  { id = "EX-2", text = "bind takes its close reason from its caller: pairRow passes `superseded by a new pairing`, resumeRow `superseded by a newer connection`. resumeRow keeps its existing token check. bindAndFollow carries the close reason and the token hash to bind (it is bind's only caller)." },
  { id = "EX-3", text = "A connection records the token hash it bound under (pair: the minted token; resume: the presented one). boundLine compares it with the pairing snapshot it already reads, beside the ended check; on a mismatch it refuses `superseded by a new pairing`, finishes the connection and mutates nothing (RV-029 F-16)." },
  { id = "EX-4", text = "The operator-input refill path (operatorRefill, refillBridged) is unchanged." },
  { id = "EX-5", text = "`just check` green." },
]
verification = [
  { id = "VT-1", expects = "openPairing over a used pairing resets token, outbox and budget and keeps nextSeq (the 'resets a used document to a fresh pairing' case, retitled to say it keeps nextSeq)", test_file = "test/bridge-pairing.test.ts", keywords = ["keeps nextSeq"], waived = false },
  { id = "VT-2", expects = "re-pair replaces: the old connection gets `superseded by a new pairing`; the old token resumes `bad token`; the first message under the new pairing has the seq after the old pairing's last (RV-029 F-15)", test_file = "test/bridge-listener.test.ts", keywords = ["superseded by a new pairing", "RV-029 F-15"], waived = false },
  { id = "VT-3", expects = "a line on a bound connection after its pairing was reopened under a new token is refused `superseded by a new pairing`, the connection finished, nothing mutated (RV-029 F-16; no pause seam, no ordering matrix)", test_file = "test/bridge-listener.test.ts", keywords = ["RV-029 F-16", "nothing mutated"], waived = false },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-04"
name      = "Retire the bridge toolset: interactive gains the bridge extension; stored bridge rewritten"
objective = "The `bridge` mode is gone: the room interactive list carries the bridge extension, and startup reconcile rewrites stored `bridge` toolsets to `interactive` once, so the room daemon starts over SL-009's store (design sec-2, sec-3, DEC-100, DEC-101)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 completed (nothing creates a `bridge`-toolset conversation any more)." },
  { id = "EN-2", text = "Re-grep `entryToolsets` (src/topics.ts), `allowedToolsets` (src/session.ts), `CATALOG`, `ROOM_ONLY`, `PROFILE_TOOLSETS`, `TALK_SETS` (src/toolsets.ts) against the design's line references." },
]
exit_criteria = [
  { id = "EX-1", text = "src/toolsets.ts per design sec-2: Toolset loses `bridge`, CATALOG.bridge deleted, CATALOG.interactive gains `bridge` between `bookmarks` and SATAN, ROOM_ONLY gains `bridge`, PROFILE_TOOLSETS.room.allowed is [interactive, mail], TALK_SETS unchanged. src/persona.ts's `bridge` arm and its comment go." },
  { id = "EX-2", text = "src/topics.ts per design sec-3: IndexDoc holds StoredEntry and a new StoredTopicRecord, both with `toolset?: StoredToolset` (`DaemonToolset | \"bridge\"`); TopicRecord, NamedTopic, TopicChange and IndexEntry keep DaemonToolset. One pure `liveToolset` is the narrowing, used by entryToolsets (which writes changed values back) and by storedEntry, storedTopic, topicsOf and indexConversation's fork copy; no cast (RV-029 F-1)." },
  { id = "EX-3", text = "entryToolsets stays log-free and also returns `retired`, the names of topics it rewrote; src/session.ts logs `topic NAME: toolset bridge retired, now interactive` for each. A rewritten entry is logged by the existing step-3 path. A second start rewrites nothing (RV-029 F-9)." },
  { id = "EX-4", text = "Tests that built `bridge`-toolset conversations (bridge-fixture, bridge-extension, daemon-sections, daemon-start, wake-tools, persona, pi-bridge-shell where it applies) build interactive ones; the persona `bridge` case goes. In test/wake-tools.test.ts, the bridge-caller-waking-another-topic refusal case is deleted with no successor, and the two bridge-self cases become one bridged-interactive case passing the talk-set check (VT-4)." },
  { id = "EX-5", text = "`just check` green." },
]
verification = [
  { id = "VT-1", expects = "room interactive list has `bridge` before `satan`, host's does not; `bridge` is no toolset and not allowed. `bridge` joins withoutPostBaseline's exclusions; VT-5's room expectation gains extension `bridge` before `satan`, tool bridge_post and a `bridge` section of BRIDGE_UNTRUSTED alone; host unchanged (RV-029 F-7)", test_file = "test/toolsets.test.ts", keywords = ["bridge_post"], waived = false },
  { id = "VT-2", expects = "reconcile rewrites a stored `bridge` entry and topic to `interactive`, re-derives the list, logs both, and a second start rewrites nothing", test_file = "test/session.test.ts", keywords = ["toolset bridge retired, now interactive"], waived = false },
  { id = "VT-3", expects = "liveToolset maps `bridge` to `interactive` and every DaemonToolset to itself", test_file = "test/topics.test.ts", keywords = ["liveToolset"], waived = false },
  { id = "VT-4", expects = "a wake from a bridged (interactive) conversation passes the talk-set check", test_file = "test/wake-tools.test.ts", keywords = ["bridged conversation"], waived = false },
  { id = "VA-1", text = "`rg 'as DaemonToolset|as Toolset' src/topics.ts src/session.ts` is empty; `rg '\"bridge\"' src/toolsets.ts src/persona.ts` hits only the extension name in CATALOG.interactive and ROOM_ONLY." },
]
specs        = []
requirements = []

