[[phase]]
id        = "PHASE-07"
name      = "pi side: pair names a conversation"
objective = "pi's `/bridge pair <posture> [conversation]` carries the target through its state table, treats a replacement as terminal and names conversations in its notices (design sec-7)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 (wire `conversation` key) and PHASE-03 (the new close reason) completed." },
]
exit_criteria = [
  { id = "EX-1", text = "pi-bridge/shell.ts accepts one or two words after `pair`; the second must be decimal digits, else usage. BRIDGE_USAGE is `usage: /bridge pair delegate|consult [conversation], or /bridge end`." },
  { id = "EX-2", text = "pi-bridge/state.ts: `PairRequest = Pick<PairFrame, \"posture\" | \"conversation\">`, derived from the wire frame rather than restated. It is the pair command event's payload, the pairing phase's content and the bound phase's `ending.then`; one pure function builds the pair frame from a PairRequest and state.project, replacing the two inline constructions (pairEvent, terminalRefusal's re-pair) (RV-029 F-11)." },
  { id = "EX-3", text = "TERMINAL_REASONS gains `superseded by a new pairing`. A bound `/bridge pair` ends its own pairing first, so pi never meets its own supersede." },
  { id = "EX-4", text = "Notices: topicOf and Ends.topic go; ends name the conversation id when known. pairFailedText's created clause becomes `the daemon may have paired conversation N` (or `the attached conversation` with no id) when the pair timed out after sending. The `pair failed` notice gains `conversation?: string`, taken from the pairing phase's PairRequest (EX-2), for pairFailedText to render; `mayHaveCreated` is renamed `mayHavePaired`." },
  { id = "EX-5", text = "After a re-pair of the same conversation, pi delivers the new pairing's first message: its seq follows the old pairing's last, so pi's conversation-and-seq dedupe does not drop it (DEC-106, RV-029 F-15)." },
  { id = "EX-6", text = "`just check` green." },
]
verification = [
  { id = "VT-1", expects = "`/bridge pair consult 12` sends conversation \"12\"; a non-decimal second word or a third word prints the new usage", test_file = "test/pi-bridge-shell.test.ts", keywords = ["/bridge pair consult 12", "[conversation]"], waived = false },
  { id = "VT-2", expects = "`superseded by a new pairing` is terminal (unpairs); `/bridge pair consult 12` while bound ends then re-pairs with conversation 12; a timed-out pair's notice names conversation 12, or the attached conversation with no id", test_file = "test/pi-bridge-state.test.ts", keywords = ["superseded by a new pairing", "conversation: \"12\""], waived = false },
  { id = "VT-3", expects = "a pi session re-pairs the same conversation and receives the new pairing's first message (RV-029 F-15)", test_file = "test/pi-bridge-state.test.ts", keywords = ["RV-029 F-15", "injects"], waived = false },
]
