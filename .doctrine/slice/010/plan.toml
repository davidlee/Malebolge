[[phase]]
id        = "PHASE-02"
name      = "Topic model: store, judge, frame"
objective = "A topic stores a model ref, judged against the catalog on write (design sec-3 store, judge, frame and reply rows; DEC-086). conversations(…) takes the catalog; setTopic writes, clears or leaves `model` exactly as it does `toolset`. No creation change and no CLI yet."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 completed; suite green." },
]
exit_criteria = [
  { id = "EX-1", text = "src/topics.ts: TopicRecord.model?: string; TopicChange.model?: string | null; KEYS = [\"cwd\", \"toolset\", \"model\"]; merged/written/without unchanged; topicsOf unchanged (it spreads the record)." },
  { id = "EX-2", text = "src/conversations.ts: TopicWrite.model?: string | null; modelChange(write, catalog) beside toolsetChange — absent and null pass through, a string must pass catalog.require and is stored as given; a refusal writes nothing. conversations(session, defaults, profile, catalog); startDaemon passes its catalog." },
  { id = "EX-3", text = "src/protocol.ts: TopicMessage.model?: string | null; TOPIC_KEYS gains model; parsed by topicField, which refuses control characters; TopicSummary.model?: string." },
  { id = "EX-4", text = "`default` stays refused by both the frame parser and writeTopicRecord: pinned by existing tests (test/topics.test.ts, test/protocol.test.ts), unchanged." },
  { id = "EX-5", text = "`just check` green." },
]
verification = [
  { id = "VT-1", expects = "model set, cleared and left unchanged round-trips through the store, and survives reopening", test_file = "test/topics.test.ts", keywords = ["model: null"], waived = false },
  { id = "VT-2", expects = "setTopic with a model the catalog lacks is refused naming it and writes nothing; a known one is stored as given and returned in the topics reply", test_file = "test/conversations.test.ts", keywords = ["setTopic", "unknown model"], waived = false },
  { id = "VT-3", expects = "the topic frame parses model (string, null, absent) and refuses a model with a control character", test_file = "test/protocol.test.ts", keywords = ["topic: model must not contain a control character"], waived = false },
]
