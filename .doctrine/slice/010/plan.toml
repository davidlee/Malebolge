# Implementation plan for SL-010 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-010"

# Canonical spec/requirement links — cite ids, never restate what they say. The
# plan reader does not model these yet, so nothing downstream consumes them.
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase, in execution order — the authored array order
# IS the order; never sort by id. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber, so the id
# sequence goes non-monotonic after a split and that is expected. Criterion ids
# are local to their phase, bare, and equally immutable
# (`lib:reference/glossary.md` § reference forms). The prefix is
# the only mode marker; there is no mode field. Reference a criterion from
# another phase phase-qualified (PHASE-03/EX-8) — bare EX-8 is ambiguous.

# ---------------------------------------------------------------------------
[[phase]]
id        = "PHASE-01"
name      = "Model catalog port and creationModel"
objective = "src/models.ts gains the ModelCatalog port (require, refs), modelCatalog, refOf, the UnknownModel error class, ModelSources and the pure creationModel (design sec-2, sec-4 first block; DEC-082, DEC-085, DEC-088). startDaemon builds one catalog and checks MALEBOLGE_MODEL through it; requireKnownModel is deleted. Nothing outside tests calls creationModel yet."
entrance_criteria = [
  { id = "EN-1", text = "Design SL-010 locked (run dr-01a18627…, rev 38; commit eddc7d9); `just check` green on main." },
  { id = "EN-2", text = "Carried phase-plan check (notes.md § Review passes): the installed pi-ai's Models exposes getModelsOfType(type, provider?) — at plan time node_modules/@earendil-works/pi-ai/dist/models.d.ts:151 (pi-ai 1.4.0). Re-confirm against the installed version; `refs` uses getModelsOfType(\"chat\"). If the name differs, use the installed one and note it in notes.md." },
]
exit_criteria = [
  { id = "EX-1", text = "src/models.ts exports ModelCatalog { require(ref: string): ModelRef; refs(): string[] }, modelCatalog(models: Models), refOf(model: ModelRef): string, class UnknownModel extends Error, ModelSources { topic?: string; fallback: ModelRef } and creationModel(sources, require), with the doc comments design sec-2 and sec-4 give." },
  { id = "EX-2", text = "require parses the ref (parseModel), then looks it up with getModelOfType(\"chat\", …). Both refusals — an unparseable ref (no slash) and one the catalog lacks — throw UnknownModel whose message names the ref; a catalog miss reads `unknown model <ref>`." },
  { id = "EX-3", text = "refs returns every chat model's `provider/modelId`, sorted. refOf renders `provider/modelId` and is parseModel's inverse for a model id that itself contains slashes." },
  { id = "EX-4", text = "creationModel: topic set → require(topic), its UnknownModel propagating (no fallback); topic unset → fallback, unchecked." },
  { id = "EX-5", text = "src/daemon-start.ts: requireKnownModel is gone; modelsFor still returns Models for openBoundSession; startDaemon builds one catalog from it and checks the configured model with catalog.require(refOf(config.model)). A MALEBOLGE_MODEL the catalog lacks still refuses the start with `unknown model <ref>`." },
  { id = "EX-6", text = "A shared test fixture (test/harness-fixture.ts or beside it) offers a catalog holding a chat model with a slashed id (e.g. gateway/openai-david/gpt-6.1-terra) and a literal ModelCatalog stub; later phases reuse both rather than defining their own." },
  { id = "EX-7", text = "`just check` green." },
]
verification = [
  { id = "VT-1", expects = "require accepts a known slashed ref, and refuses an unknown ref and an unparseable one with UnknownModel naming it", test_file = "test/models.test.ts", keywords = ["modelCatalog", "UnknownModel", "unknown model"], waived = false },
  { id = "VT-2", expects = "refs lists only chat models, sorted; refOf(parseModel(r)) === r for a slashed model id", test_file = "test/models.test.ts", keywords = ["refs()", "refOf(parseModel"], waived = false },
  { id = "VT-3", expects = "creationModel: topic set and known → it; set and unknown → throws UnknownModel; unset → fallback", test_file = "test/models.test.ts", keywords = ["creationModel", "fallback"], waived = false },
  { id = "VT-4", expects = "startDaemon refuses a MALEBOLGE_MODEL the catalog lacks, naming it", test_file = "test/daemon-start.test.ts", keywords = ["unknown model"], waived = false },
]
specs        = []
requirements = []

