[[phase]]
id        = "PHASE-03"
name      = "Creation through topicInit; heartbeat catch"
objective = "Every creating path takes its topic's model in the creating commit (design sec-4; DEC-083, DEC-084, DEC-085): writeCreated returns the topic's record, toolsetInit becomes topicInit and configures extensions and model together via creationModel. thread_start and the heartbeat follow; startRoomTasks catches UnknownModel only, logs, and the daemon serves without a heartbeat."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 completed; suite green." },
  { id = "EN-2", text = "Carried phase-plan check (notes.md § Review passes): the heartbeat's create reaches topicInit. At plan time: ensureHeartbeat calls deps.conversations.open({kind: \"topic\", new: false}) (src/wake/heartbeat.ts:38), deps.conversations is the shared Conversations (src/daemon-start.ts:269), and openTopic creates through create(…, toolsetInit(profile, name)). Re-confirm at phase-plan; if the path differs, /consult before relying on the catch." },
  { id = "EN-3", text = "An error thrown inside a create's init leaves createConversation as the same object (class intact), as thread tools already rely on for Refusal through api.commit (src/threads/tools.ts:447-458). Confirm with the first red test; if pi-durable wraps it, match on the wrapper's cause and note it in notes.md." },
]
exit_criteria = [
  { id = "EX-1", text = "src/topics.ts: writeCreated returns the topic's record alongside the toolset it chose; the record is read once, in the creating commit." },
  { id = "EX-2", text = "src/conversations.ts: topicInit(profile, topic, catalog, fallback, thread?) replaces toolsetInit and, after writing the entry, calls configure(tx, id, { extensions, model: creationModel({ topic: record?.model, fallback }, catalog.require) }). openTopic and plain new pass it; fallback is the defaults' model. No caller of toolsetInit remains." },
  { id = "EX-3", text = "src/threads/tools.ts and src/threads/extension.ts: createStarted uses topicInit; thread deps carry the catalog. thread_fork is unchanged (no code)." },
  { id = "EX-4", text = "A stored model the catalog lacks makes the creating commit throw UnknownModel: nothing is created — no conversation, no index entry, and for thread_start no post task. An attach answers the client an error naming the model (the daemon's generic error relay; VT-6)." },
  { id = "EX-8", text = "thread_start surfaces UnknownModel as its refusal result (isError, naming the model), as it does a Refusal — not as a thrown bug. The thread tools' attempted maps only Refusal today (src/threads/tools.ts:447-458); widen it to UnknownModel, or rethrow it as a Refusal in createStarted, whichever is smaller. Design sec-4 is silent on this mapping; see plan.md." },
  { id = "EX-5", text = "src/daemon-start.ts: startRoomTasks catches UnknownModel only around ensureHeartbeat, logs `wake: no heartbeat: unknown model <ref> in topic <name>`, and the start continues. Any other heartbeat failure still fails the start and undoes it (the existing VT-3 f test stays unchanged and passing)." },
  { id = "EX-6", text = "Root keeps the defaults' model on every open (VT-1). Runner job conversations (src/runner/conversations.ts) are unchanged: no code." },
  { id = "EX-7", text = "`just check` green." },
]
verification = [
  { id = "VT-1", expects = "attach --topic and --topic --new in a topic with a model create with it; without one, the default; plain new takes the default; an existing conversation keeps its model after the topic's model changes; root keeps the defaults' model on every open", test_file = "test/conversations.test.ts", keywords = ["topicInit", "keeps its model", "root keeps the default"], waived = false },
  { id = "VT-2", expects = "a stored model the catalog lacks refuses creation in that topic, naming it, and creates nothing", test_file = "test/conversations.test.ts", keywords = ["unknown model", "creates nothing"], waived = false },
  { id = "VT-3", expects = "a started thread takes its topic's model; with a stale stored model the tool returns a refusal naming it and no child or post task exists", test_file = "test/threads-tools.test.ts", keywords = ["unknown model", "topic's model"], waived = false },
  { id = "VT-4", expects = "a fork keeps its parent's model even when the topic's model differs", test_file = "test/threads-fork.test.ts", keywords = ["parent's model"], waived = false },
  { id = "VT-5", expects = "a wake topic with an unknown stored model and no conversation: the daemon starts, logs the no-heartbeat line, and creates no heartbeat; the existing VT-3 f test is unchanged", test_file = "test/daemon-start.test.ts", keywords = ["no heartbeat: unknown model"], waived = false },
  { id = "VT-6", expects = "an attach --topic NAME --new frame into a topic whose stored model the catalog lacks is answered with an error naming the model, and nothing is created", test_file = "test/daemon.test.ts", keywords = ["unknown model"], waived = false },
]
