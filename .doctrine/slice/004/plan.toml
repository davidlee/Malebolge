# Implementation plan for SL-004 — the authored, durable phase plan.
#
# This is the single source of each phase's objective, criteria, verification,
# and links. Runtime status lives separately under .doctrine/state/ (phase
# tracking) — never record progress here. Hand-edit freely: the tool reads this
# file but does not rewrite it.
schema  = "doctrine.plan.overview"
version = 1
slice   = "SL-004"

# Canonical spec/requirement links — cite ids, never restate what they say. The
# plan reader does not model these yet, so nothing downstream consumes them.
[specs]
primary       = []
collaborators = []

[requirements]
targets      = []
dependencies = []

# One [[phase]] per ordered phase, in execution order — the authored array order
# IS the order; never sort by id. Ids are PHASE-NN (zero-padded), immutable and
# never reused once authored — edits append, they never renumber.
[[phase]]
id        = "PHASE-01"
name      = "The conversation context: index read and pure mapping"
objective = "New module `src/conversation-context.ts` (DEC-018): `ConversationContext {id, entry?}`; `contextOf(read, id)`, the one index read, an own-key lookup over `readIndex` (`src/topics.ts` stays the index's only owner); pure `conversationVars(profile, cwd, context)` giving all six `SATAN_*` names, empty when absent (DEC-021), with the comment that no key may be omitted (RV-012 F-1); pure `conversationLine(context)` (DEC-019 wording). No consumer wired yet (design sec-2, sec-5)."
entrance_criteria = [
  { id = "EN-1", text = "Design locked (run rev 36, commit 546b74f); SL-003 done." },
  { id = "EN-2", text = "Gate baseline at the base commit: `just check` green on the host at 67208d0 (2026-10-24: 70 files, 2062 tests, exit 0). In an agent container, red only in the `test/runner/*` set `mem.fact.malebolge.runner-suite-red-in-agent-container` names is the baseline, not this slice's regression." },
]
exit_criteria = [
  { id = "EX-1", text = "`conversationVars` returns a `Record<string, string>` with exactly the six names on every input: no key omitted, no `undefined` value — the room half of RV-012 F-1 (pi-env drops `undefined`, so an omitted key cannot mask an inherited one)." },
  { id = "EX-2", text = "Values: `SATAN_HARNESS=malebolge`; `SATAN_PROFILE` as given; ids decimal strings; topic and parent from the entry; empty parent for a non-fork; empty topic and parent with no entry (DEC-021); `SATAN_CWD` as given (the caller resolves DEC-022's fallback)." },
  { id = "EX-3", text = "`contextOf` reads root in `default` (DEC-015), a fork's parent, and no entry for an id the index lacks; the lookup is own-key (`constructor`-safe, as `storedTopic`)." },
  { id = "EX-4", text = "`conversationLine` gives `Conversation: <id> (topic: <t>)`, or `Conversation: <id>` with no entry." },
  { id = "EX-5", text = "`just check` green (baseline reds excepted, per EN-2); eslint zero warnings; biome format clean." },
]
verification = [
  { id = "VT-1", expects = "design VT-1: the mapping table — fork, non-fork, no entry; every row has all six keys, string values (RV-012 F-1)", test_file = "test/conversation-context.test.ts", keywords = ["conversationVars", "SATAN_HARNESS", "SATAN_PARENT_CONVERSATION", "SATAN_TOPIC"], waived = false },
  { id = "VT-2", expects = "design VT-2: contextOf over openTestHarness reads root in default, a fork's parent, and no entry for an unindexed id", test_file = "test/conversation-context.test.ts", keywords = ["contextOf", "openTestHarness", "assignTopic", "DEFAULT_TOPIC"], waived = false },
  { id = "VT-3", expects = "conversationLine with and without a topic", test_file = "test/conversation-context.test.ts", keywords = ["conversationLine", "Conversation: "], waived = false },
]
specs        = []
requirements = []

# PHASE-02 EX-4, VT-2, VT-3 moved to PHASE-04 (RV-013 F-3); those ids are retired.
[[phase]]
id        = "PHASE-02"
name      = "Tool environment, host: the hook type, the fixture, shellEnv"
objective = "Wire the variables into the host's execs (DEC-020, design sec-3): `SessionOptions.env` widens to pi-durable's `(target: EnvTarget) => ExecutionEnv | Promise<ExecutionEnv>`; `daemon-env.ts` gains `conversationEnv(profile, defaultCwd, target)` (resolves `target.cwd ?? default` once, DEC-022) and the host arm passes `shellEnv`; a failed index read propagates (design sec-3 Failure, RV-013 F-2); `openTestHarness` takes an optional `env` hook so a test can run through the real `daemonEnv` (RV-012 F-9, RV-013 F-4). The room arm is PHASE-04."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-01 completed." },
  { id = "EN-2", text = "Re-read in the installed dist before writing against them: `NodeExecutionEnv`'s env merge (`env/node.js` ~205-212), bash tool's `{env: {}, inheritEnv: true}` (`tools/bash.js` ~36), env-build rejection handling (`harness/tool.js` ~309-329)." },
]
exit_criteria = [
  { id = "EX-1", text = "Host, through `openTestHarness` with `env: daemonEnv({profile: \"host\", cwd}, log).env`: a bash tool call in root (topic `default`) prints root's six values; a second conversation created with `harness.createConversation({ownership: {kind: \"ownerless\"}, init: assignTopic(<name>)}, context)` prints its own id and `<name>`; results read with `toolResults(harness, conversation)`; the test closes the `DaemonEnv` in `afterEach` (RV-013 F-4)." },
  { id = "EX-2", text = "Host: with `SATAN_TOPIC` set in the daemon's process environment, an unindexed conversation's bash prints `[${SATAN_TOPIC}]` as `[]` — empty, distinguished from absent (RV-012 F-1 demonstrate, host half). The test restores `process.env` in `afterEach` (RV-013 F-9)." },
  { id = "EX-3", text = "A caller's explicit per-exec `env` wins over `shellEnv` on the host." },
  { id = "EX-5", text = "Existing `daemon-env.test.ts` cases updated to the `EnvTarget` call shape and `await`; `daemon-start.ts` compiles unchanged or with only the type follow-through; `openTestHarness`'s callers without `env` behave as before." },
  { id = "EX-6", text = "`just check` green (baseline reds excepted); eslint zero warnings; biome format clean." },
  { id = "EX-7", text = "A reader whose `snapshot` rejects makes the host env build reject with that error (design VT-6, RV-013 F-2): no fallback to an empty context." },
]
verification = [
  { id = "VT-1", expects = "design VT-3: host bash sees its own conversation's SATAN_*; inherited SATAN_TOPIC overridden with empty ([]); per-exec env wins (RV-012 F-1)", test_file = "test/daemon-env.test.ts", keywords = ["callThenAnswer", "assignTopic", "SATAN_CONVERSATION", "[${SATAN_TOPIC}]"], waived = false },
  { id = "VT-4", expects = "openTestHarness accepts an env hook, used with the real daemonEnv (RV-012 F-9, RV-013 F-4)", test_file = "test/daemon-env.test.ts", keywords = ["openTestHarness", "daemonEnv"], waived = false },
  { id = "VT-5", expects = "design VT-6: a rejecting index read fails the env build (RV-013 F-2)", test_file = "test/daemon-env.test.ts", keywords = ["rejects", "snapshot"], waived = false },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-04"
name      = "Tool environment, room: shellEnv through observedEnv"
objective = "The room arm uses `conversationEnv` and passes `shellEnv`; `observedEnv` (`src/room/connection.ts`) gains an optional `shellEnv` passed to `RemoteExecutionEnv`; the env id stays `pi-env:daemon-room` for every conversation (RFC-002, RV-012 F-4). Isolates the room half of RV-012 F-1 (RV-013 F-3). The other `observedEnv` callers, `src/runner/env.ts:25` and `src/room/shell.ts:217`, stay unchanged (RV-013 F-6)."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-02 completed." },
  { id = "EN-2", text = "Re-read `RemoteExecutionEnv`'s `shellEnv` handling (`pi-env/dist/remote-env.js` ~756-769) in the installed dist." },
]
exit_criteria = [
  { id = "EX-1", text = "Room, over the existing fixture (fake `ssh` running pi-env's local daemon): every conversation's env is a `RemoteExecutionEnv` with id `pi-env:daemon-room`, and an exec prints that conversation's values." },
  { id = "EX-2", text = "Room masking: `SATAN_TOPIC` set on `process.env` before the fixture's first exec on a fresh connection (the daemon inherits env at its lazy spawn), restored in `afterEach`; an unindexed conversation's exec prints `[${SATAN_TOPIC}]` as `[]` (RV-012 F-1 demonstrate, room half; RV-013 F-9). The fixture over-approximates production, whose daemon gets sshd's non-login environment (design sec-2, RV-013 F-1): this tests pi-env's merge order, not a known leak." },
  { id = "EX-3", text = "A caller's explicit per-exec `env` wins over `shellEnv` in the room." },
  { id = "EX-4", text = "`shellEnv` is optional on `observedEnv`: `src/runner/env.ts` and `src/room/shell.ts` unchanged; `src/runner/` untouched (RV-013 F-6)." },
  { id = "EX-5", text = "`just check` green (baseline reds excepted); eslint zero warnings; biome format clean." },
]
verification = [
  { id = "VT-1", expects = "design VT-4, strengthened: room env keeps id pi-env:daemon-room, carries shellEnv, masks an inherited SATAN_TOPIC, per-exec env wins (RV-012 F-1, F-4)", test_file = "test/daemon-env.test.ts", keywords = ["pi-env:daemon-room", "SATAN_PARENT_CONVERSATION", "[${SATAN_TOPIC}]", "RemoteExecutionEnv"], waived = false },
  { id = "VT-2", expects = "observedEnv passes an optional shellEnv to RemoteExecutionEnv", test_file = "src/room/connection.ts", keywords = ["shellEnv?:", "shellEnv"], waived = false },
]
specs        = []
requirements = []

[[phase]]
id        = "PHASE-03"
name      = "System prompt section and docs"
objective = "`conversationExtension` in `src/conversation-context.ts`, a constant like `cwdExtension`: one untagged section `conversation` rendering `conversationLine(await contextOf(input.read, input.conversationId))` (DEC-019); registered in `daemonExtensions` right after `cwdExtension`. No other extension declares the key (RV-012 F-6). Docs (RV-013 F-8): the six variables in their own README subsection — what tools receive, not daemon configuration, so not in the table at `README.md:274-291` (RV-012 F-2); `docs/internals.md`: the `conversation` section in the section tree and `shellEnv` in the env diagram (~36-37). Then VH-1."
entrance_criteria = [
  { id = "EN-1", text = "PHASE-04 completed." },
]
exit_criteria = [
  { id = "EX-1", text = "`systemPromptSections` shows `conversation` untagged, directly after `cwd`, with `Conversation: <id> (topic: <t>)`; and `Conversation: <id>` for an unindexed conversation." },
  { id = "EX-2", text = "The four exact assertions in `test/daemon-sections.test.ts` that the new key breaks are updated: the key lists at ~87 and ~117, and the re-send case (~128 and the sequence from ~140), whose stored conversation now also gets `conversation` re-sent (RV-013 F-5). Nothing else changes order." },
  { id = "EX-3", text = "README and docs/internals.md updated as in the objective." },
  { id = "EX-4", text = "`just check` green (baseline reds excepted); eslint zero warnings; biome format clean." },
]
verification = [
  { id = "VT-1", expects = "design VT-5: the conversation section, untagged, after cwd (asserted by key order), with and without a topic", test_file = "test/daemon-sections.test.ts", keywords = ["conversationExtension", "Conversation: ", "systemPromptSections"], waived = false },
  { id = "VH-1", expects = "design VH-1: after the user deploys this build to the room, from a malebolge conversation `env | grep SATAN_` shows all six with this conversation's values and `~/db/q who` shows a mem.origin row with them. User at the terminal." },
]
